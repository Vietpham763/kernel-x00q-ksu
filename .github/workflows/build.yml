name: Build KernelSU Boot Image for Zenfone 5 (X00QD)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Cài đặt công cụ biên dịch & Magiskboot
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libncurses5-dev git zip libarchive-tools gcc-aarch64-linux-gnu g++-aarch64-linux-gnu gcc-arm-linux-gnueabi g++-arm-linux-gnueabi
          
          # Tải Magisk APK chính chủ để trích xuất magiskboot chuẩn
          wget https://github.com/topjohnwu/Magisk/releases/download/v27.0/Magisk-v27.0.apk
          unzip Magisk-v27.0.apk "lib/x86_64/libmagiskboot.so" -d .
          mv lib/x86_64/libmagiskboot.so magiskboot
          chmod +x magiskboot
          sudo mv magiskboot /usr/local/bin/

      - name: Clone Nguồn Kernel X00QD (Nhánh Stable lineage-18.1)
        run: |
          git clone https://github.com/LineageOS/android_kernel_asus_sdm660 -b lineage-18.1 --depth=1 kernel

      - name: Tích hợp KernelSU Next & Fix Signature
        run: |
          cd kernel
          git clone https://github.com/KernelSU-Next/KernelSU-Next KSU --depth=1
          cp -r KSU/kernel drivers/kernelsu
          rm -rf KSU
          echo "obj-y += kernelsu/" >> drivers/Makefile
          echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig

          # Forward declare struct fix
          echo -e "\nstruct mdss_dsi_ctrl_pdata;\nstruct dsi_panel_cmds;\nvoid mdss_dsi_panel_cmds_send(struct mdss_dsi_ctrl_pdata *ctrl, struct dsi_panel_cmds *pcmds, u32 flags) {}\n" >> drivers/video/fbdev/msm/mdss_livedisplay.c

      - name: Tải Toolchain Proton Clang
        run: |
          git clone https://github.com/kdrag0n/proton-clang --depth=1 clang

      - name: Biên dịch Kernel cho X00QD
        run: |
          cd kernel
          export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          make O=out sdm660_defconfig
          make -j$(nproc) O=out CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- KCFLAGS="-Wno-error -Wno-implicit-function-declaration" KCPPFLAGS="-Wno-error"

      - name: Unpack & Repack boot.img Chuẩn Kích Thước 32MB
        run: |
          if [ -f boot.zip ]; then
            unzip -o boot.zip
          fi

          if [ ! -f boot.img ]; then
            echo "LỖI: Không tìm thấy boot.img trong repository!"
            exit 1
          fi

          ORIG_SIZE=$(stat -c%s "boot.img")
          echo "Kích thước boot.img gốc: $ORIG_SIZE bytes"

          mkdir workdir
          cp boot.img workdir/
          cd workdir

          # Unpack boot.img gốc bằng magiskboot
          magiskboot unpack boot.img

          # Xử lý nén kernel bắt buộc dạng gzip -9 để giảm kích thước từ 50MB xuống 12MB
          KOUT="../kernel/out/arch/arm64/boot"
          if [ -f "$KOUT/Image.gz-dtb" ]; then
            echo "Tìm thấy Image.gz-dtb sẵn có"
            cp "$KOUT/Image.gz-dtb" kernel
          elif [ -f "$KOUT/Image.gz" ]; then
            echo "Tìm thấy Image.gz sẵn có"
            cp "$KOUT/Image.gz" kernel
          elif [ -f "$KOUT/Image" ]; then
            echo "Tìm thấy Image thô (50MB), tiến hành ép nén gzip -9..."
            gzip -9 -n -c "$KOUT/Image" > kernel
          else
            echo "Không tìm thấy file kernel đầu ra!"
            exit 1
          fi

          K_SIZE=$(stat -c%s "kernel")
          echo "Kích thước kernel sau khi chuẩn bị nạp: $K_SIZE bytes"

          # Repack lại boot image
          magiskboot repack boot.img new-boot.img

          NEW_SIZE=$(stat -c%s "new-boot.img")
          echo "Kích thước file mới repack: $NEW_SIZE bytes"

          if [ $NEW_SIZE -gt $ORIG_SIZE ]; then
            echo "LỖI: File mới ($NEW_SIZE) vẫn vượt quá dung lượng gốc ($ORIG_SIZE)!"
            exit 1
          fi

          # Padding chính xác bằng dd khớp 100% từng byte dung lượng gốc 32MB
          cp new-boot.img ../boot_ksu.img
          PAD_BYTES=$((ORIG_SIZE - NEW_SIZE))
          if [ $PAD_BYTES -gt 0 ]; then
            echo "Padding thêm $PAD_BYTES bytes trống..."
            dd if=/dev/zero bs=1 count=$PAD_BYTES >> ../boot_ksu.img
          fi

      - name: Tải file boot_ksu.img về
        uses: actions/upload-artifact@v4
        with:
          name: boot_ksu_X00QD
          path: boot_ksu.img
