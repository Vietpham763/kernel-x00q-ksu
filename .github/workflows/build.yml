name: Build ZE620KL crDroid 9.5 KernelSU

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # DEPENDENCIES
      # ============================================================
      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            libncurses5-dev \
            libncurses-dev \
            git \
            wget \
            unzip \
            zip \
            cpio \
            rsync \
            device-tree-compiler \
            python3 \
            python3-pip \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            g++-arm-linux-gnueabi


      # ============================================================
      # CHECK INPUT FILES
      # ============================================================
      - name: Check repository files
        shell: bash
        run: |
          set -euxo pipefail

          echo "=========================================="
          echo "REPOSITORY"
          echo "=========================================="

          pwd
          ls -lah

          echo "=========================================="
          echo "SEARCH boot.img"
          echo "=========================================="

          find . \
            -maxdepth 4 \
            -type f \
            -name "boot.img" \
            -print || true


      # ============================================================
      # MAGISKBOOT
      # ============================================================
      - name: Install MagiskBoot
        shell: bash
        run: |
          set -euxo pipefail

          MAGISK_VERSION="27.0"

          wget -q -O Magisk.apk \
            "https://github.com/topjohnwu/Magisk/releases/download/v${MAGISK_VERSION}/Magisk-v${MAGISK_VERSION}.apk"

          rm -rf magisk_extract
          mkdir -p magisk_extract

          unzip -o Magisk.apk \
            "lib/x86_64/libmagiskboot.so" \
            -d magisk_extract

          test -f \
            magisk_extract/lib/x86_64/libmagiskboot.so

          cp \
            magisk_extract/lib/x86_64/libmagiskboot.so \
            magiskboot

          chmod +x magiskboot

          ./magiskboot --help

          sudo cp magiskboot /usr/local/bin/magiskboot

          magiskboot --help


      # ============================================================
      # CLONE KERNEL SOURCE
      # ============================================================
      - name: Clone ASUS SDM660 kernel
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf kernel

          git clone \
            --depth=1 \
            -b lineage-18.1 \
            https://github.com/LineageOS/android_kernel_asus_sdm660 \
            kernel

          test -d kernel
          test -f kernel/Makefile
          test -d kernel/arch/arm64

          cd kernel

          echo "=========================================="
          echo "KERNEL SOURCE"
          echo "=========================================="

          git log -1 --oneline
          git status --short

          echo "Kernel path:"
          pwd

          echo "Kernel Makefile:"
          test -f Makefile

          echo "ARM64:"
          test -d arch/arm64


      # ============================================================
      # FIND EXTRACT-I KCONFIG
      # ============================================================
      - name: Locate extract-ikconfig
        shell: bash
        run: |
          set -euxo pipefail

          echo "=========================================="
          echo "SEARCH extract-ikconfig"
          echo "=========================================="

          find kernel \
            -type f \
            \( \
              -name "extract-ikconfig" \
              -o \
              -name "extract-ikconfig*" \
            \) \
            -print

          if [ ! -f kernel/scripts/extract-ikconfig ]; then
            echo "ERROR: kernel/scripts/extract-ikconfig does not exist."

            echo "Available kernel scripts:"
            find kernel/scripts \
              -maxdepth 2 \
              -type f \
              -printf '%p\n' \
              | sort \
              | head -200

            exit 1
          fi

          chmod +x kernel/scripts/extract-ikconfig


      # ============================================================
      # FIND BOOT IMAGE
      # ============================================================
      - name: Prepare original boot image
        shell: bash
        run: |
          set -euxo pipefail

          echo "=========================================="
          echo "SEARCH ORIGINAL BOOT"
          echo "=========================================="

          BOOT_FOUND=""

          if [ -f boot.img ]; then
            BOOT_FOUND="boot.img"
          elif [ -f boot.zip ]; then
            echo "boot.zip found."

            unzip -l boot.zip

            unzip -o boot.zip

            if [ -f boot.img ]; then
              BOOT_FOUND="boot.img"
            fi
          fi

          if [ -z "$BOOT_FOUND" ]; then
            echo "Searching repository for boot.img..."

            FOUND=$(find . \
              -path ./kernel \
              -prune \
              -o \
              -type f \
              -name "boot.img" \
              -print \
              | head -1 || true)

            if [ -n "$FOUND" ]; then
              cp "$FOUND" boot.img
              BOOT_FOUND="boot.img"
            fi
          fi

          if [ -z "$BOOT_FOUND" ]; then
            echo "ERROR: boot.img was not found."
            echo ""
            echo "The workflow requires the original ZE620KL boot.img."
            echo "Place boot.img in the repository root."
            exit 1
          fi

          test -f boot.img

          echo "Original boot image:"
          ls -lh boot.img


      # ============================================================
      # EXTRACT ORIGINAL CONFIG
      # ============================================================
      - name: Extract original kernel config
        shell: bash
        run: |
          set -euxo pipefail

          echo "=========================================="
          echo "EXTRACT ORIGINAL CONFIG"
          echo "=========================================="

          test -f boot.img
          test -f kernel/scripts/extract-ikconfig

          rm -f kernel_config_goc

          chmod +x kernel/scripts/extract-ikconfig

          if kernel/scripts/extract-ikconfig \
              boot.img > kernel_config_goc 2>/dev/null; then

            if [ ! -s kernel_config_goc ]; then
              echo "ERROR: extracted config is empty."
              exit 1
            fi

            echo "Original kernel config extracted."

          else
            echo "ERROR: Unable to extract kernel config from boot.img."
            exit 1
          fi

          echo "=========================================="
          echo "CONFIG CHECK"
          echo "=========================================="

          grep -E \
            '^(CONFIG_SCHED_WALT|CONFIG_SCHED_FREQ_INPUT|CONFIG_COMPAT|CONFIG_COMPAT_VDSO|CONFIG_VDSO32|CONFIG_OVERLAY_FS|CONFIG_MODULE_SIG)=' \
            kernel_config_goc || true


      # ============================================================
      # CLEAN KERNEL SOURCE
      # ============================================================
      - name: Clean kernel source
        shell: bash
        run: |
          set -euxo pipefail

          cd kernel

          echo "=========================================="
          echo "CLEAN SOURCE"
          echo "=========================================="

          make ARCH=arm64 mrproper

          echo "Kernel source cleaned."

          test -f Makefile
          test -d arch/arm64


      # ============================================================
      # INSTALL ORIGINAL DEFCONFIG
      # ============================================================
      - name: Install original kernel config
        shell: bash
        run: |
          set -euxo pipefail

          cd kernel

          echo "=========================================="
          echo "INSTALL DEFCONFIG"
          echo "=========================================="

          test -s ../kernel_config_goc

          mkdir -p arch/arm64/configs

          cp \
            ../kernel_config_goc \
            arch/arm64/configs/custom_x00qd_defconfig

          test -f \
            arch/arm64/configs/custom_x00qd_defconfig

          echo "Defconfig installed."

          wc -l \
            arch/arm64/configs/custom_x00qd_defconfig


      # ============================================================
      # KERNELSU NEXT
      # ============================================================
      - name: Integrate KernelSU Next
        shell: bash
        run: |
          set -euxo pipefail

          cd kernel

          echo "=========================================="
          echo "KERNELSU NEXT"
          echo "=========================================="

          rm -rf KSU
          rm -rf drivers/kernelsu

          git clone \
            --depth=1 \
            https://github.com/KernelSU-Next/KernelSU-Next \
            KSU

          test -d KSU/kernel

          cp -r \
            KSU/kernel \
            drivers/kernelsu

          rm -rf KSU

          test -d drivers/kernelsu

          if ! grep -q 'obj-y += kernelsu/' drivers/Makefile; then
            echo 'obj-y += kernelsu/' >> drivers/Makefile
          fi

          if ! grep -q 'drivers/kernelsu/Kconfig' drivers/Kconfig; then
            echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig
          fi

          echo "KernelSU integrated."

          grep -n "kernelsu" drivers/Makefile || true
          grep -n "drivers/kernelsu" drivers/Kconfig || true


      # ============================================================
      # LLVM TOOLCHAIN
      # ============================================================
      - name: Download Android LLVM Clang
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf clang

          git clone \
            --depth=1 \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
            clang

          CLANG_BIN=$(
            find "$GITHUB_WORKSPACE/clang" \
              -type f \
              -path '*/bin/clang' \
              -printf '%h\n' \
              | sort \
              | tail -1
          )

          if [ -z "$CLANG_BIN" ]; then
            echo "ERROR: clang binary not found."
            exit 1
          fi

          test -x "$CLANG_BIN/clang"

          echo "CLANG_BIN=$CLANG_BIN" >> "$GITHUB_ENV"
          echo "$CLANG_BIN" >> "$GITHUB_PATH"

          echo "=========================================="
          echo "CLANG"
          echo "=========================================="

          "$CLANG_BIN/clang" --version
          "$CLANG_BIN/ld.lld" --version


      # ============================================================
      # PREPARE CONFIG
      # ============================================================
      - name: Prepare kernel configuration
        shell: bash
        run: |
          set -euxo pipefail

          cd kernel

          export ARCH=arm64
          export SUBARCH=arm64

          echo "=========================================="
          echo "PREPARE CONFIG"
          echo "=========================================="

          rm -rf out
          mkdir -p out

          make \
            O=out \
            ARCH=arm64 \
            SUBARCH=arm64 \
            custom_x00qd_defconfig

          test -f out/.config

          echo "=========================================="
          echo "KERNELSU CONFIG"
          echo "=========================================="

          ./scripts/config \
            --file out/.config \
            --enable KSU

          ./scripts/config \
            --file out/.config \
            --enable OVERLAY_FS

          echo "=========================================="
          echo "COMPAT CONFIG"
          echo "=========================================="

          # Keep ARM64 compatibility unless the original
          # configuration explicitly requires it disabled.
          #
          # The previous workflow disabled COMPAT/VDSO32 here,
          # which could break an old Qualcomm Android kernel.
          #
          # Therefore do NOT forcibly disable COMPAT.

          ./scripts/config \
            --file out/.config \
            --disable VDSO32

          ./scripts/config \
            --disable COMPAT_VDSO

          echo "=========================================="
          echo "MODULE SIGNING"
          echo "=========================================="

          ./scripts/config \
            --file out/.config \
            --set-str SYSTEM_TRUSTED_KEYS ""

          ./scripts/config \
            --file out/.config \
            --set-str SYSTEM_REVOCATION_KEYS ""

          ./scripts/config \
            --disable MODULE_SIG

          echo "=========================================="
          echo "OLDDEFCONFIG"
          echo "=========================================="

          make \
            O=out \
            ARCH=arm64 \
            SUBARCH=arm64 \
            olddefconfig

          test -f out/.config

          echo "=========================================="
          echo "FINAL CONFIG"
          echo "=========================================="

          grep -E \
            '^(CONFIG_(SCHED_WALT|SCHED_FREQ_INPUT|COMPAT|COMPAT_VDSO|VDSO32|KSU|OVERLAY_FS|MODULE_SIG))=' \
            out/.config || true


      # ============================================================
      # BUILD KERNEL
      # ============================================================
      - name: Build kernel
        shell: bash
        run: |
          set -euxo pipefail

          cd kernel

          export ARCH=arm64
          export SUBARCH=arm64

          export PATH="$CLANG_BIN:$PATH"

          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          export LLVM=1
          export LLVM_IAS=1

          export CC=clang
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export STRIP=llvm-strip
          export READELF=llvm-readelf

          echo "=========================================="
          echo "TOOLCHAIN"
          echo "=========================================="

          clang --version
          ld.lld --version

          echo "=========================================="
          echo "BUILD KERNEL"
          echo "=========================================="

          # GitHub runner has limited memory.
          # Keep jobs low to avoid LLVM Broken pipe / OOM failures.
          JOBS=2

          echo "Parallel jobs: $JOBS"

          make \
            -j"$JOBS" \
            O=out \
            ARCH=arm64 \
            SUBARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            READELF=llvm-readelf \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            KCFLAGS="-Wno-error" \
            Image.gz

          test -f out/arch/arm64/boot/Image.gz

          ls -lh out/arch/arm64/boot/Image.gz


      # ============================================================
      # VERIFY KERNEL
      # ============================================================
      - name: Verify kernel output
        shell: bash
        run: |
          set -euxo pipefail

          cd kernel

          test -f out/arch/arm64/boot/Image.gz

          echo "=========================================="
          echo "KERNEL OUTPUT"
          echo "=========================================="

          ls -lh \
            out/arch/arm64/boot/Image.gz

          file \
            out/arch/arm64/boot/Image.gz


      # ============================================================
      # REPACK BOOT IMAGE
      # ============================================================
      - name: Repack boot image
        shell: bash
        run: |
          set -euxo pipefail

          echo "=========================================="
          echo "REPACK BOOT"
          echo "=========================================="

          test -f boot.img

          rm -rf workdir
          mkdir -p workdir

          cp boot.img workdir/original-boot.img

          cd workdir

          echo "Unpacking original boot image..."

          magiskboot unpack original-boot.img

          echo "=========================================="
          echo "BOOT COMPONENTS"
          echo "=========================================="

          ls -lah

          KOUT="../kernel/out/arch/arm64/boot"

          test -f "$KOUT/Image.gz"

          echo "=========================================="
          echo "REPLACE KERNEL"
          echo "=========================================="

          # MagiskBoot automatically detects the original
          # kernel compression when repacking.
          #
          # Image.gz is used for this kernel tree.
          cp "$KOUT/Image.gz" kernel

          test -f kernel

          echo "New kernel:"
          ls -lh kernel

          echo "=========================================="
          echo "REPACK"
          echo "=========================================="

          magiskboot repack \
            original-boot.img \
            new-boot.img

          test -f new-boot.img

          cp \
            new-boot.img \
            ../boot_ksu.img

          echo "Created:"
          ls -lh ../boot_ksu.img


      # ============================================================
      # VERIFY BOOT IMAGE
      # ============================================================
      - name: Verify boot image
        shell: bash
        run: |
          set -euxo pipefail

          test -f boot.img
          test -f boot_ksu.img

          echo "=========================================="
          echo "BOOT IMAGE"
          echo "=========================================="

          ORIGINAL=$(stat -c%s boot.img)
          NEW=$(stat -c%s boot_ksu.img)

          echo "Original: $ORIGINAL bytes"
          echo "New:      $NEW bytes"

          if [ "$NEW" -gt "$ORIGINAL" ]; then
            echo "WARNING: New boot image is larger than original."
            echo "Do not automatically pad/truncate it."
            echo "The repacked image must remain structurally valid."
          fi

          echo "=========================================="
          echo "MAGISKBOOT VERIFY"
          echo "=========================================="

          magiskboot verify boot_ksu.img || true

          ls -lh boot_ksu.img


      # ============================================================
      # ARTIFACT
      # ============================================================
      - name: Upload boot image
        uses: actions/upload-artifact@v4
        with:
          name: boot_ksu_X00QD_KernelSU
          path: boot_ksu.img
          if-no-files-found: error
