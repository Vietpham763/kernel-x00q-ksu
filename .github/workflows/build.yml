name: Build ZE620KL crDroid 9.5 KernelSU

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1


      # ============================================================
      # DEPENDENCIES
      # ============================================================
      - name: Install build dependencies
        shell: bash
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libncurses5-dev \
            git \
            wget \
            unzip \
            zip \
            cpio \
            rsync \
            device-tree-compiler \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            g++-arm-linux-gnueabi


      # ============================================================
      # MAGISKBOOT
      # ============================================================
      - name: Install MagiskBoot
        shell: bash
        run: |
          set -eux

          wget -q -O Magisk.apk \
            https://github.com/topjohnwu/Magisk/releases/download/v27.0/Magisk-v27.0.apk

          rm -rf magisk_extract
          mkdir -p magisk_extract

          unzip -o Magisk.apk \
            "lib/x86_64/libmagiskboot.so" \
            -d magisk_extract

          test -f magisk_extract/lib/x86_64/libmagiskboot.so

          cp \
            magisk_extract/lib/x86_64/libmagiskboot.so \
            magiskboot

          chmod +x magiskboot

          ./magiskboot --help || true

          sudo install -m 0755 \
            magiskboot \
            /usr/local/bin/magiskboot

          command -v magiskboot


      # ============================================================
      # KERNEL SOURCE
      # ============================================================
      - name: Clone ASUS SDM660 Kernel
        shell: bash
        run: |
          set -eux

          rm -rf kernel

          git clone \
            --depth=1 \
            -b lineage-18.1 \
            https://github.com/LineageOS/android_kernel_asus_sdm660 \
            kernel

          cd kernel

          git status --short

          test -d arch/arm64
          test -f Makefile


      # ============================================================
      # SOURCE CHECK
      # ============================================================
      - name: Check kernel source
        shell: bash
        run: |
          set -eux

          cd kernel

          echo "=========================================="
          echo "KERNEL SOURCE"
          echo "=========================================="

          echo "Kernel:"
          git rev-parse HEAD

          echo
          echo "Available defconfigs:"

          find arch/arm64/configs \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' |
            sort |
            head -100


      # ============================================================
      # ORIGINAL BOOT CONFIG
      # ============================================================
      - name: Extract original boot config
        shell: bash
        run: |
          set -eux

          if [ -f boot.zip ]; then
            unzip -o boot.zip
          fi

          if [ ! -f boot.img ]; then
            echo "WARNING: boot.img not found."
            echo "Kernel compilation will continue."
            exit 0
          fi

          test -f kernel/scripts/extract-ikconfig

          chmod +x kernel/scripts/extract-ikconfig

          if kernel/scripts/extract-ikconfig \
              boot.img \
              > kernel_config_goc \
              2>/dev/null; then

            if [ -s kernel_config_goc ]; then

              echo "Original kernel config found."

              cp \
                kernel_config_goc \
                kernel/arch/arm64/configs/custom_x00qd_defconfig

            else

              echo "No embedded kernel config."
              rm -f kernel_config_goc

            fi
          else
            echo "Unable to extract original kernel config."
            rm -f kernel_config_goc
          fi


      # ============================================================
      # VERIFY / CREATE DEFCONFIG
      # ============================================================
      - name: Prepare defconfig
        shell: bash
        run: |
          set -eux

          cd kernel

          if [ -f arch/arm64/configs/custom_x00qd_defconfig ]; then

            echo "Using custom_x00qd_defconfig"

          else

            echo "custom_x00qd_defconfig not found."

            if [ -f arch/arm64/configs/defconfig ]; then
              echo "Using defconfig"
              cp \
                arch/arm64/configs/defconfig \
                arch/arm64/configs/custom_x00qd_defconfig

            else
              echo "ERROR: No usable defconfig found."
              exit 1
            fi

          fi

          test -f \
            arch/arm64/configs/custom_x00qd_defconfig


      # ============================================================
      # KERNELSU
      # ============================================================
      - name: Integrate KernelSU Next
        shell: bash
        run: |
          set -eux

          cd kernel

          rm -rf KSU
          rm -rf drivers/kernelsu

          git clone \
            --depth=1 \
            https://github.com/KernelSU-Next/KernelSU-Next \
            KSU

          test -d KSU/kernel

          cp -a \
            KSU/kernel \
            drivers/kernelsu

          rm -rf KSU

          if ! grep -q \
            'obj-y += kernelsu/' \
            drivers/Makefile; then

            echo 'obj-y += kernelsu/' \
              >> drivers/Makefile

          fi

          if ! grep -q \
            'drivers/kernelsu/Kconfig' \
            drivers/Kconfig; then

            echo 'source "drivers/kernelsu/Kconfig"' \
              >> drivers/Kconfig

          fi

          test -d drivers/kernelsu

          echo "KernelSU source integrated."


      # ============================================================
      # LLVM TOOLCHAIN
      # ============================================================
      - name: Download Android LLVM Clang
        shell: bash
        run: |
          set -eux

          rm -rf clang

          git clone \
            --depth=1 \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
            clang

          CLANG_BIN=$(
            find "$GITHUB_WORKSPACE/clang" \
              -type f \
              -path '*/bin/clang' \
              -printf '%h\n' |
            sort |
            tail -1
          )

          test -n "$CLANG_BIN"
          test -x "$CLANG_BIN/clang"

          echo "CLANG_BIN=$CLANG_BIN" \
            >> "$GITHUB_ENV"

          echo "$CLANG_BIN" \
            >> "$GITHUB_PATH"

          "$CLANG_BIN/clang" --version


      # ============================================================
      # CLEAN OUT TREE
      # ============================================================
      - name: Prepare clean output tree
        shell: bash
        run: |
          set -eux

          cd kernel

          rm -rf out

          mkdir -p out

          echo "Output directory:"
          realpath out


      # ============================================================
      # DEFCONFIG
      # ============================================================
      - name: Generate kernel config
        shell: bash
        run: |
          set -eux

          cd kernel

          export ARCH=arm64
          export SUBARCH=arm64

          make \
            O=out \
            ARCH=arm64 \
            custom_x00qd_defconfig

          test -f out/.config

          echo "=========================================="
          echo "CONFIGURATION"
          echo "=========================================="

          # KernelSU
          ./scripts/config \
            --file out/.config \
            --enable KSU

          # OverlayFS
          ./scripts/config \
            --file out/.config \
            --enable OVERLAY_FS

          # Disable module signing
          ./scripts/config \
            --file out/.config \
            --disable MODULE_SIG

          ./scripts/config \
            --file out/.config \
            --set-str SYSTEM_TRUSTED_KEYS ""

          ./scripts/config \
            --file out/.config \
            --set-str SYSTEM_REVOCATION_KEYS ""

          # Disable 32-bit VDSO.
          # This avoids the previous assembler -EL problem.
          ./scripts/config \
            --file out/.config \
            --disable VDSO32

          ./scripts/config \
            --file out/.config \
            --disable COMPAT_VDSO

          # Keep ARM64 kernel compatible with the original
          # SDM660 source unless the source explicitly requires
          # otherwise.
          #
          # Do NOT blindly disable CONFIG_COMPAT here.

          make \
            O=out \
            ARCH=arm64 \
            olddefconfig

          echo
          echo "Final config:"

          grep -E \
            'CONFIG_(KSU|OVERLAY_FS|VDSO32|COMPAT_VDSO|COMPAT|MODULE_SIG)' \
            out/.config || true


      # ============================================================
      # SOURCE SANITY
      # ============================================================
      - name: Verify source tree
        shell: bash
        run: |
          set -eux

          cd kernel

          echo "Checking kernel source..."

          test -f Makefile
          test -d arch/arm64
          test -d drivers/kernelsu
          test -f out/.config

          echo
          echo "Source modifications:"
          git status --short || true

          echo
          echo "Output:"
          ls -la out | head


      # ============================================================
      # BUILD KERNEL
      # ============================================================
      - name: Build kernel
        shell: bash
        run: |
          set -eux

          cd kernel

          export ARCH=arm64
          export SUBARCH=arm64

          export PATH="$CLANG_BIN:$PATH"

          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          echo "=========================================="
          echo "TOOLCHAIN"
          echo "=========================================="

          clang --version
          ld.lld --version
          aarch64-linux-gnu-gcc --version
          arm-linux-gnueabi-gcc --version

          echo "=========================================="
          echo "BUILD KERNEL"
          echo "=========================================="

          make \
            -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            READELF=llvm-readelf \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            KCFLAGS="-Wno-error" \
            Image.gz


      # ============================================================
      # VERIFY KERNEL
      # ============================================================
      - name: Verify kernel output
        shell: bash
        run: |
          set -eux

          cd kernel

          test -f \
            out/arch/arm64/boot/Image.gz

          echo "Kernel built successfully."

          ls -lh \
            out/arch/arm64/boot/Image.gz


      # ============================================================
      # REPACK BOOT
      # ============================================================
      - name: Repack boot image
        if: ${{ hashFiles('boot.img') != '' }}
        shell: bash
        run: |
          set -eux

          test -f boot.img

          rm -rf workdir
          mkdir -p workdir

          cp boot.img workdir/boot.img

          cd workdir

          echo "=========================================="
          echo "UNPACK BOOT"
          echo "=========================================="

          magiskboot unpack boot.img

          KERNEL="$GITHUB_WORKSPACE/kernel/out/arch/arm64/boot/Image.gz"

          test -f "$KERNEL"

          echo "Original boot components:"
          ls -lah

          echo "Replacing kernel..."

          # MagiskBoot normally writes/reads the kernel
          # component as "kernel".
          #
          # Image.gz is used directly only when the original
          # kernel component is gzip-compatible.
          cp "$KERNEL" kernel

          echo "=========================================="
          echo "REPACK BOOT"
          echo "=========================================="

          magiskboot repack \
            boot.img \
            new-boot.img

          test -f new-boot.img

          cp \
            new-boot.img \
            "$GITHUB_WORKSPACE/boot_ksu.img"

          ls -lh \
            "$GITHUB_WORKSPACE/boot_ksu.img"


      # ============================================================
      # VERIFY BOOT
      # ============================================================
      - name: Verify boot image
        if: ${{ hashFiles('boot_ksu.img') != '' }}
        shell: bash
        run: |
          set -eux

          test -f boot_ksu.img

          echo "Boot image generated."

          ls -lh boot_ksu.img

          echo
          echo "MagiskBoot verification:"

          magiskboot verify boot_ksu.img || true


      # ============================================================
      # ARTIFACT
      # ============================================================
      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: ZE620KL-KernelSU-Kernel
          path: |
            kernel/out/arch/arm64/boot/Image.gz
          if-no-files-found: error


      - name: Upload boot image
        if: ${{ hashFiles('boot_ksu.img') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ZE620KL-KernelSU-Boot
          path: boot_ksu.img
          if-no-files-found: error
