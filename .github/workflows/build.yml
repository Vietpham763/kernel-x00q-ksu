name: Build ZE620KL crDroid 9.5 KernelSU

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # DEPENDENCIES
      # ============================================================
      - name: Install dependencies
        shell: bash
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            cpio \
            flex \
            git \
            libelf-dev \
            libncurses5-dev \
            libssl-dev \
            lz4 \
            python3 \
            rsync \
            unzip \
            wget \
            zip \
            device-tree-compiler \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi

      # ============================================================
      # ANDROID CLANG
      # ============================================================
      - name: Download Android Clang
        shell: bash
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE"

          rm -rf clang

          git clone \
            --depth=1 \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
            clang

          CLANG_BIN="$(
            find "$GITHUB_WORKSPACE/clang" \
              -type f \
              -path '*/bin/clang' \
              -printf '%h\n' |
            sort |
            tail -1
          )"

          test -n "$CLANG_BIN"
          test -x "$CLANG_BIN/clang"
          test -x "$CLANG_BIN/ld.lld"
          test -x "$CLANG_BIN/llvm-ar"
          test -x "$CLANG_BIN/llvm-nm"
          test -x "$CLANG_BIN/llvm-objcopy"
          test -x "$CLANG_BIN/llvm-objdump"
          test -x "$CLANG_BIN/llvm-readelf"
          test -x "$CLANG_BIN/llvm-strip"

          echo "CLANG_BIN=$CLANG_BIN" >> "$GITHUB_ENV"
          echo "$CLANG_BIN" >> "$GITHUB_PATH"

          echo "=========================================="
          echo "ANDROID CLANG"
          echo "=========================================="

          "$CLANG_BIN/clang" --version
          "$CLANG_BIN/ld.lld" --version

      # ============================================================
      # KERNEL SOURCE
      # ============================================================
      - name: Clone X00QD kernel
        shell: bash
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE"

          rm -rf kernel

          git clone \
            --depth=1 \
            --branch lineage-18.1 \
            https://github.com/LineageOS/android_kernel_asus_sdm660 \
            kernel

          cd kernel

          echo "=========================================="
          echo "KERNEL SOURCE"
          echo "=========================================="

          git rev-parse HEAD

          echo "Available defconfigs:"
          find arch/arm64/configs \
            -maxdepth 1 \
            -type f \
            -name '*defconfig' \
            -printf '%f\n' |
            sort

      # ============================================================
      # CHECK CONFIG
      # ============================================================
      - name: Select X00QD configuration
        shell: bash
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE/kernel"

          echo "=========================================="
          echo "CONFIGURATION"
          echo "=========================================="

          # X00QD/ZenFone 5z sử dụng nền SDM660.
          # Source Lineage hiện tại không có custom_x00qd_defconfig.
          # Dùng defconfig có thật trong source.

          if [ -f arch/arm64/configs/X00TD_defconfig ]; then
            DEFCONFIG=X00TD_defconfig

          elif [ -f arch/arm64/configs/X01BD_defconfig ]; then
            DEFCONFIG=X01BD_defconfig

          elif [ -f arch/arm64/configs/sdm660-perf_defconfig ]; then
            DEFCONFIG=sdm660-perf_defconfig

          elif [ -f arch/arm64/configs/sdm660_defconfig ]; then
            DEFCONFIG=sdm660_defconfig

          else
            echo "ERROR: Không tìm thấy defconfig phù hợp!"
            find arch/arm64/configs \
              -maxdepth 1 \
              -type f \
              -name '*defconfig' \
              -print
            exit 1
          fi

          echo "Using: $DEFCONFIG"

          echo "DEFCONFIG=$DEFCONFIG" >> "$GITHUB_ENV"

      # ============================================================
      # KERNELSU
      # ============================================================
      - name: Integrate KernelSU
        shell: bash
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE/kernel"

          rm -rf KernelSU

          git clone \
            --depth=1 \
            https://github.com/tiann/KernelSU.git \
            KernelSU

          test -f KernelSU/kernel/setup.sh

          bash KernelSU/kernel/setup.sh

          echo "=========================================="
          echo "KERNELSU"
          echo "=========================================="

          find drivers -maxdepth 2 \
            -type d \
            -name '*kernelsu*' \
            -print || true

      # ============================================================
      # CONFIGURE
      # ============================================================
      - name: Configure kernel
        shell: bash
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE/kernel"

          export ARCH=arm64
          export SUBARCH=arm64

          rm -rf out
          mkdir -p out

          echo "=========================================="
          echo "DEFCONFIG"
          echo "=========================================="

          make \
            O=out \
            ARCH=arm64 \
            "$DEFCONFIG"

          test -f out/.config

          echo "=========================================="
          echo "KERNELSU CONFIG"
          echo "=========================================="

          grep -E \
            'CONFIG_KSU|CONFIG_OVERLAY_FS|CONFIG_KPROBES' \
            out/.config || true

          echo "=========================================="
          echo "OLDDEFCONFIG"
          echo "=========================================="

          make \
            O=out \
            ARCH=arm64 \
            olddefconfig

          test -f out/.config

      # ============================================================
      # BUILD
      # ============================================================
      - name: Build kernel
        shell: bash
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE/kernel"

          export ARCH=arm64
          export SUBARCH=arm64

          export PATH="$CLANG_BIN:$PATH"

          export CC=clang
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export STRIP=llvm-strip
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export READELF=llvm-readelf

          echo "=========================================="
          echo "TOOLCHAIN"
          echo "=========================================="

          clang --version
          ld.lld --version
          llvm-ar --version
          llvm-objdump --version
          llvm-readelf --version

          echo "=========================================="
          echo "BUILD KERNEL"
          echo "=========================================="

          make \
            -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            STRIP=llvm-strip \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            READELF=llvm-readelf \
            KCFLAGS="-Wno-error" \
            Image.gz

          echo "=========================================="
          echo "BUILD RESULT"
          echo "=========================================="

          test -f out/arch/arm64/boot/Image.gz

          ls -lh \
            out/arch/arm64/boot/Image.gz

      # ============================================================
      # MAGISKBOOT
      # ============================================================
      - name: Prepare MagiskBoot
        shell: bash
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE"

          wget -q \
            https://github.com/topjohnwu/Magisk/releases/download/v27.0/Magisk-v27.0.apk \
            -O Magisk.apk

          rm -rf magisk_extract
          mkdir -p magisk_extract

          unzip -o \
            Magisk.apk \
            'lib/x86_64/libmagiskboot.so' \
            -d magisk_extract

          test -f \
            magisk_extract/lib/x86_64/libmagiskboot.so

          cp \
            magisk_extract/lib/x86_64/libmagiskboot.so \
            magiskboot

          chmod +x magiskboot

          echo "=========================================="
          echo "MAGISKBOOT"
          echo "=========================================="

          ./magiskboot --help

      # ============================================================
      # PREPARE BOOT
      # ============================================================
      - name: Prepare boot image
        shell: bash
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE"

          test -f boot.zip

          rm -rf boot_work
          mkdir -p boot_work

          unzip -o boot.zip -d boot_work

          BOOT_IMG="$(
            find boot_work \
              -type f \
              -name 'boot.img' |
            head -1
          )"

          if [ -z "$BOOT_IMG" ]; then
            echo "ERROR: Không tìm thấy boot.img trong boot.zip"
            find boot_work -type f -maxdepth 5 -print
            exit 1
          fi

          cp \
            "$BOOT_IMG" \
            boot_work/original-boot.img

          ls -lh \
            boot_work/original-boot.img

      # ============================================================
      # UNPACK
      # ============================================================
      - name: Unpack boot image
        shell: bash
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE/boot_work"

          "$GITHUB_WORKSPACE/magiskboot" \
            unpack \
            -h \
            original-boot.img

          echo "=========================================="
          echo "BOOT COMPONENTS"
          echo "=========================================="

          ls -lah

          test -f kernel

      # ============================================================
      # REPLACE KERNEL
      # ============================================================
      - name: Replace boot kernel
        shell: bash
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE/boot_work"

          test -f kernel

          test -f \
            "$GITHUB_WORKSPACE/kernel/out/arch/arm64/boot/Image.gz"

          cp kernel kernel.stock

          cp \
            "$GITHUB_WORKSPACE/kernel/out/arch/arm64/boot/Image.gz" \
            kernel

          echo "=========================================="
          echo "KERNEL REPLACED"
          echo "=========================================="

          ls -lh kernel kernel.stock

      # ============================================================
      # REPACK
      # ============================================================
      - name: Repack boot image
        shell: bash
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE/boot_work"

          "$GITHUB_WORKSPACE/magiskboot" \
            repack \
            original-boot.img \
            new-boot.img

          test -f new-boot.img

          echo "=========================================="
          echo "REPACK RESULT"
          echo "=========================================="

          ls -lh \
            original-boot.img \
            new-boot.img

      # ============================================================
      # VERIFY
      # ============================================================
      - name: Verify boot image
        shell: bash
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE/boot_work"

          "$GITHUB_WORKSPACE/magiskboot" \
            verify \
            new-boot.img || true

      # ============================================================
      # ARTIFACTS
      # ============================================================
      - name: Prepare artifacts
        shell: bash
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE"

          rm -rf artifacts
          mkdir -p artifacts

          cp \
            kernel/out/arch/arm64/boot/Image.gz \
            artifacts/Image.gz

          cp \
            boot_work/new-boot.img \
            artifacts/boot_ksu.img

          echo "=========================================="
          echo "ARTIFACTS"
          echo "=========================================="

          ls -lh artifacts

      # ============================================================
      # UPLOAD
      # ============================================================
      - name: Upload artifacts
        uses: actions/upload-artifact@v4

        with:
          name: ZE620KL-crDroid-9.5-KernelSU
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
