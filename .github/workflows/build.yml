name: Build ZE620KL crDroid 9.5 KernelSU

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. Dependencies
      # ============================================================
      - name: Install build dependencies
        shell: bash
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            cpio \
            flex \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            git \
            libelf-dev \
            libncurses5-dev \
            libssl-dev \
            lz4 \
            python3 \
            rsync \
            unzip \
            wget \
            zip \
            device-tree-compiler

      # ============================================================
      # 3. Get boot.img from boot.zip
      # ============================================================
      - name: Extract original boot image
        shell: bash
        run: |
          set -eux

          test -f boot.zip

          unzip -o boot.zip

          if [ ! -f boot.img ]; then
            echo "ERROR: boot.img was not found"
            find . -maxdepth 3 -type f | sort
            exit 1
          fi

          ls -lh boot.img

      # ============================================================
      # 4. Clone kernel source
      # ============================================================
      - name: Clone SDM660 kernel source
        shell: bash
        run: |
          set -eux

          rm -rf kernel

          git clone \
            --depth=1 \
            --branch lineage-18.1 \
            https://github.com/LineageOS/android_kernel_asus_sdm660 \
            kernel

          cd kernel

          git rev-parse HEAD

      # ============================================================
      # 5. Download Android clang
      # ============================================================
      - name: Download Android Clang
        shell: bash
        run: |
          set -eux

          rm -rf clang

          git clone \
            --depth=1 \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
            clang

          CLANG_BIN="$(find "$GITHUB_WORKSPACE/clang" \
            -type f \
            -path '*/bin/clang' \
            -printf '%h\n' \
            | sort \
            | tail -1)"

          test -n "$CLANG_BIN"
          test -x "$CLANG_BIN/clang"

          echo "CLANG_BIN=$CLANG_BIN" >> "$GITHUB_ENV"
          echo "$CLANG_BIN" >> "$GITHUB_PATH"

          "$CLANG_BIN/clang" --version

      # ============================================================
      # 6. Integrate KernelSU
      # ============================================================
      - name: Integrate KernelSU
        shell: bash
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE/kernel"

          rm -rf KernelSU

          git clone \
            --depth=1 \
            https://github.com/tiann/KernelSU.git \
            KernelSU

          bash KernelSU/kernel/setup.sh

          echo "KernelSU integration completed"

          test -d KernelSU/kernel

      # ============================================================
      # 7. Prepare clean output directory
      # ============================================================
      - name: Prepare kernel configuration
        shell: bash
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE/kernel"

          rm -rf out
          mkdir -p out

          export ARCH=arm64
          export SUBARCH=arm64

          make O=out \
            ARCH=arm64 \
            sdm660_defconfig

          # Enable required KernelSU-related options where available.
          if [ -x scripts/config ]; then
            scripts/config \
              --file out/.config \
              --enable CONFIG_KSU \
              --enable CONFIG_OVERLAY_FS || true
          fi

          make O=out \
            ARCH=arm64 \
            olddefconfig

          test -f out/.config

          echo "Kernel configuration:"
          grep -E \
            'CONFIG_KSU=|CONFIG_OVERLAY_FS=|CONFIG_KPROBES=|CONFIG_COMPAT=' \
            out/.config || true

      # ============================================================
      # 8. Build kernel
      # ============================================================
      - name: Build kernel
        shell: bash
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE/kernel"

          export ARCH=arm64
          export SUBARCH=arm64

          export PATH="$CLANG_BIN:$PATH"

          export CC=clang
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          echo "=========================================="
          echo "COMPILER"
          echo "=========================================="

          clang --version
          aarch64-linux-gnu-gcc --version | head -1

          echo "=========================================="
          echo "BUILD"
          echo "=========================================="

          make \
            -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            KCFLAGS="-Wno-error" \
            Image.gz \
            dtbs

          echo "=========================================="
          echo "BUILD OUTPUT"
          echo "=========================================="

          find out/arch/arm64/boot \
            -maxdepth 3 \
            -type f \
            -printf '%p %s bytes\n' \
            | sort

      # ============================================================
      # 9. Prepare MagiskBoot
      # ============================================================
      - name: Prepare MagiskBoot
        shell: bash
        run: |
          set -eux

          wget -q \
            https://github.com/topjohnwu/Magisk/releases/download/v27.0/Magisk-v27.0.apk \
            -O Magisk.apk

          rm -rf magisk_extract
          mkdir -p magisk_extract

          unzip -o \
            Magisk.apk \
            'lib/x86_64/libmagiskboot.so' \
            -d magisk_extract

          test -f magisk_extract/lib/x86_64/libmagiskboot.so

          cp \
            magisk_extract/lib/x86_64/libmagiskboot.so \
            magiskboot

          chmod +x magiskboot

          ./magiskboot version || true

      # ============================================================
      # 10. Unpack original boot.img
      # ============================================================
      - name: Unpack boot image
        shell: bash
        run: |
          set -eux

          rm -rf boot_work
          mkdir -p boot_work

          cp boot.img boot_work/original-boot.img

          cd boot_work

          ../../magiskboot unpack -h original-boot.img

          echo "Boot image components:"
          ls -lah

          test -f kernel

      # ============================================================
      # 11. Replace kernel only
      # ============================================================
      - name: Replace kernel
        shell: bash
        run: |
          set -eux

          KERNEL_DIR="$GITHUB_WORKSPACE/kernel/out/arch/arm64/boot"
          WORK_DIR="$GITHUB_WORKSPACE/boot_work"

          test -f "$KERNEL_DIR/Image.gz"

          cd "$WORK_DIR"

          cp kernel kernel.stock

          cp "$KERNEL_DIR/Image.gz" kernel.gz

          # Preserve the original DTB when boot.img contains one.
          if [ -f kernel_dtb ]; then
            cat kernel.gz kernel_dtb > kernel.new
            mv kernel.new kernel
          else
            cp kernel.gz kernel
          fi

          ls -lh kernel

      # ============================================================
      # 12. Repack boot image
      # ============================================================
      - name: Repack boot image
        shell: bash
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE/boot_work"

          ./../magiskboot repack \
            original-boot.img \
            new-boot.img

          test -f new-boot.img

          ls -lh \
            original-boot.img \
            new-boot.img

      # ============================================================
      # 13. Validate result
      # ============================================================
      - name: Validate boot image
        shell: bash
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE/boot_work"

          ../magiskboot verify new-boot.img || true

          mkdir -p "$GITHUB_WORKSPACE/artifacts"

          cp \
            new-boot.img \
            "$GITHUB_WORKSPACE/artifacts/boot_ksu.img"

          cp \
            "$GITHUB_WORKSPACE/kernel/out/arch/arm64/boot/Image.gz" \
            "$GITHUB_WORKSPACE/artifacts/Image.gz"

          find "$GITHUB_WORKSPACE/artifacts" \
            -type f \
            -printf '%f %s bytes\n'

      # ============================================================
      # 14. Upload artifacts
      # ============================================================
      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ZE620KL-crDroid-9.5-KernelSU
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
