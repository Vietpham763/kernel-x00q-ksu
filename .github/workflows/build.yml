name: Build ZE620KL crDroid 9.5 KernelSU

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1


      # ============================================================
      # DEPENDENCIES
      # ============================================================
      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            libncurses5-dev \
            libncurses-dev \
            git \
            wget \
            unzip \
            zip \
            cpio \
            rsync \
            device-tree-compiler \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            g++-arm-linux-gnueabi


      # ============================================================
      # MAGISKBOOT
      #
      # IMPORTANT:
      # Do NOT run "magiskboot --help".
      # MagiskBoot 27 prints help but returns exit code 1.
      # ============================================================
      - name: Install MagiskBoot
        shell: bash
        run: |
          set -euxo pipefail

          MAGISK_VERSION="27.0"

          rm -f Magisk.apk
          rm -rf magisk_extract

          mkdir -p magisk_extract

          echo "=========================================="
          echo "DOWNLOAD MAGISK"
          echo "=========================================="

          wget -q \
            -O Magisk.apk \
            "https://github.com/topjohnwu/Magisk/releases/download/v${MAGISK_VERSION}/Magisk-v${MAGISK_VERSION}.apk"

          test -s Magisk.apk

          echo "=========================================="
          echo "EXTRACT MAGISKBOOT"
          echo "=========================================="

          unzip -o \
            Magisk.apk \
            "lib/x86_64/libmagiskboot.so" \
            -d magisk_extract

          test -f \
            magisk_extract/lib/x86_64/libmagiskboot.so

          cp \
            magisk_extract/lib/x86_64/libmagiskboot.so \
            magiskboot

          chmod 0755 magiskboot

          sudo install \
            -m 0755 \
            magiskboot \
            /usr/local/bin/magiskboot

          test -x /usr/local/bin/magiskboot

          echo "=========================================="
          echo "MAGISKBOOT INSTALLED"
          echo "=========================================="

          file /usr/local/bin/magiskboot
          ls -lh /usr/local/bin/magiskboot


      # ============================================================
      # CLONE KERNEL
      # ============================================================
      - name: Clone ASUS SDM660 Kernel
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf kernel

          git clone \
            --depth=1 \
            -b lineage-18.1 \
            https://github.com/LineageOS/android_kernel_asus_sdm660 \
            kernel

          cd kernel

          test -f Makefile
          test -d arch/arm64

          echo "=========================================="
          echo "KERNEL COMMIT"
          echo "=========================================="

          git log -1 --oneline


      # ============================================================
      # CLEAN SOURCE
      #
      # MUST happen BEFORE creating defconfig
      # and BEFORE KernelSU integration.
      # ============================================================
      - name: Clean kernel source
        shell: bash
        run: |
          set -euxo pipefail

          cd kernel

          echo "=========================================="
          echo "MRPROPER"
          echo "=========================================="

          rm -rf out

          make \
            ARCH=arm64 \
            mrproper

          rm -rf out

          mkdir -p out

          echo "Kernel source cleaned."


      # ============================================================
      # CHECK ORIGINAL BOOT
      # ============================================================
      - name: Check original boot image
        shell: bash
        run: |
          set -euxo pipefail

          echo "=========================================="
          echo "CHECK BOOT IMAGE"
          echo "=========================================="

          if [ -f boot.zip ]; then
            unzip -o boot.zip
          fi

          test -f boot.img

          ls -lh boot.img


      # ============================================================
      # EXTRACT ORIGINAL KERNEL CONFIG
      # ============================================================
      - name: Extract original kernel config
        shell: bash
        run: |
          set -euxo pipefail

          echo "=========================================="
          echo "EXTRACT ORIGINAL CONFIG"
          echo "=========================================="

          chmod +x kernel/scripts/extract-ikconfig

          if kernel/scripts/extract-ikconfig \
              boot.img \
              > kernel_config_goc 2>/dev/null; then

            test -s kernel_config_goc

          else

            echo "ERROR: Unable to extract kernel config."
            exit 1

          fi

          echo "Config lines:"
          wc -l kernel_config_goc

          cp \
            kernel_config_goc \
            kernel/arch/arm64/configs/custom_x00qd_defconfig

          test -f \
            kernel/arch/arm64/configs/custom_x00qd_defconfig

          echo "Custom defconfig created."


      # ============================================================
      # KERNELSU NEXT
      # ============================================================
      - name: Integrate KernelSU Next
        shell: bash
        run: |
          set -euxo pipefail

          cd kernel

          echo "=========================================="
          echo "KERNELSU NEXT"
          echo "=========================================="

          rm -rf KSU
          rm -rf drivers/kernelsu

          git clone \
            --depth=1 \
            https://github.com/KernelSU-Next/KernelSU-Next \
            KSU

          test -d KSU/kernel

          cp -a \
            KSU/kernel \
            drivers/kernelsu

          rm -rf KSU

          test -d drivers/kernelsu

          # --------------------------------------------------------
          # drivers/Makefile
          # --------------------------------------------------------
          if ! grep -qE \
            '^[[:space:]]*obj-y[[:space:]]*\+=[[:space:]]*kernelsu/' \
            drivers/Makefile; then

            echo 'obj-y += kernelsu/' >> drivers/Makefile

          fi

          # --------------------------------------------------------
          # drivers/Kconfig
          # --------------------------------------------------------
          if ! grep -qF \
            'drivers/kernelsu/Kconfig' \
            drivers/Kconfig; then

            echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig

          fi

          echo "=========================================="
          echo "KSU CHECK"
          echo "=========================================="

          test -f drivers/kernelsu/Kconfig
          test -f drivers/kernelsu/Makefile

          grep -n kernelsu drivers/Makefile || true
          grep -n 'drivers/kernelsu/Kconfig' drivers/Kconfig || true


      # ============================================================
      # PREPARE CONFIG
      # ============================================================
      - name: Prepare kernel config
        shell: bash
        run: |
          set -euxo pipefail

          cd kernel

          export ARCH=arm64
          export SUBARCH=arm64

          rm -rf out
          mkdir -p out

          echo "=========================================="
          echo "CREATE DEFCONFIG"
          echo "=========================================="

          make \
            O=out \
            ARCH=arm64 \
            SUBARCH=arm64 \
            custom_x00qd_defconfig

          test -f out/.config

          echo "=========================================="
          echo "CONFIGURATION"
          echo "=========================================="

          # --------------------------------------------------------
          # Fix old Android kernel VDSO32 assembler issue.
          # --------------------------------------------------------
          ./scripts/config \
            --file out/.config \
            --disable VDSO32

          ./scripts/config \
            --file out/.config \
            --disable COMPAT_VDSO

          # --------------------------------------------------------
          # DO NOT disable CONFIG_COMPAT.
          # ZE620KL Android userspace may require it.
          # --------------------------------------------------------

          # --------------------------------------------------------
          # KernelSU
          # --------------------------------------------------------
          ./scripts/config \
            --file out/.config \
            --enable KSU

          ./scripts/config \
            --enable OVERLAY_FS

          # --------------------------------------------------------
          # Disable module signing requirements.
          # --------------------------------------------------------
          ./scripts/config \
            --set-str SYSTEM_TRUSTED_KEYS ""

          ./scripts/config \
            --set-str SYSTEM_REVOCATION_KEYS ""

          ./scripts/config \
            --disable MODULE_SIG

          # --------------------------------------------------------
          # Synchronize configuration.
          # --------------------------------------------------------
          make \
            O=out \
            ARCH=arm64 \
            SUBARCH=arm64 \
            olddefconfig

          echo "=========================================="
          echo "FINAL CONFIG"
          echo "=========================================="

          grep -E \
            'CONFIG_(VDSO32|COMPAT_VDSO|COMPAT|KSU|OVERLAY_FS|MODULE_SIG)=' \
            out/.config || true


      # ============================================================
      # ANDROID CLANG
      #
      # Do NOT use latest LLVM 22 for this old kernel.
      # ============================================================
      - name: Download Android Clang
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf clang

          echo "=========================================="
          echo "DOWNLOAD ANDROID CLANG"
          echo "=========================================="

          git clone \
            --depth=1 \
            -b android12-qpr3-s1-release \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
            clang

          echo "=========================================="
          echo "LOCATE CLANG"
          echo "=========================================="

          CLANG_BIN="$(
            find "$GITHUB_WORKSPACE/clang" \
              -type f \
              -path '*/clang-r416183b1/bin/clang' \
              -printf '%h\n' \
              | head -1
          )"

          if [ -z "$CLANG_BIN" ]; then
            CLANG_BIN="$(
              find "$GITHUB_WORKSPACE/clang" \
                -type f \
                -path '*/bin/clang' \
                -printf '%h\n' \
                | grep 'r416183' \
                | head -1
            )"
          fi

          test -n "$CLANG_BIN"
          test -x "$CLANG_BIN/clang"

          echo "CLANG_BIN=$CLANG_BIN" >> "$GITHUB_ENV"
          echo "$CLANG_BIN" >> "$GITHUB_PATH"

          echo "=========================================="
          echo "CLANG VERSION"
          echo "=========================================="

          "$CLANG_BIN/clang" --version

          echo "=========================================="
          echo "LLD VERSION"
          echo "=========================================="

          "$CLANG_BIN/ld.lld" --version


      # ============================================================
      # TOOLCHAIN CHECK
      # ============================================================
      - name: Check toolchain
        shell: bash
        run: |
          set -euxo pipefail

          export PATH="$CLANG_BIN:$PATH"

          echo "=========================================="
          echo "LLVM TOOLCHAIN"
          echo "=========================================="

          command -v clang
          command -v ld.lld
          command -v llvm-ar
          command -v llvm-nm
          command -v llvm-objcopy
          command -v llvm-objdump
          command -v llvm-strip
          command -v llvm-readelf

          clang --version
          ld.lld --version

          echo "=========================================="
          echo "CROSS COMPILERS"
          echo "=========================================="

          aarch64-linux-gnu-gcc --version
          arm-linux-gnueabi-gcc --version


      # ============================================================
      # BUILD KERNEL
      #
      # -j2 intentionally used to reduce LLVM broken-pipe failures.
      # ============================================================
      - name: Build kernel
        shell: bash
        run: |
          set -euxo pipefail

          cd kernel

          export ARCH=arm64
          export SUBARCH=arm64

          export PATH="$CLANG_BIN:$PATH"

          export LLVM=1
          export LLVM_IAS=1

          export CC=clang
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export STRIP=llvm-strip
          export READELF=llvm-readelf

          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          echo "=========================================="
          echo "BUILD CONFIG"
          echo "=========================================="

          test -f out/.config

          grep -E \
            'CONFIG_(VDSO32|COMPAT_VDSO|COMPAT|KSU|OVERLAY_FS|MODULE_SIG)=' \
            out/.config || true

          echo "=========================================="
          echo "TOOLCHAIN"
          echo "=========================================="

          clang --version
          ld.lld --version

          echo "=========================================="
          echo "BUILD KERNEL"
          echo "=========================================="

          JOBS=2

          echo "Parallel jobs: ${JOBS}"

          make \
            -j"${JOBS}" \
            O=out \
            ARCH=arm64 \
            SUBARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            READELF=llvm-readelf \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            KCFLAGS="-Wno-error" \
            Image.gz

          echo "=========================================="
          echo "BUILD SUCCESS"
          echo "=========================================="

          test -f \
            out/arch/arm64/boot/Image.gz

          ls -lh \
            out/arch/arm64/boot/Image.gz


      # ============================================================
      # VERIFY KERNEL
      # ============================================================
      - name: Verify kernel
        shell: bash
        run: |
          set -euxo pipefail

          cd kernel

          test -f \
            out/arch/arm64/boot/Image.gz

          echo "=========================================="
          echo "KERNEL"
          echo "=========================================="

          ls -lh \
            out/arch/arm64/boot/Image.gz

          file \
            out/arch/arm64/boot/Image.gz

          if [ -f out/include/config/kernel.release ]; then
            echo "Kernel release:"
            cat out/include/config/kernel.release
          fi


      # ============================================================
      # UNPACK + REPACK BOOT
      # ============================================================
      - name: Repack boot.img
        shell: bash
        run: |
          set -euxo pipefail

          echo "=========================================="
          echo "INPUT CHECK"
          echo "=========================================="

          test -f boot.img
          test -f kernel/out/arch/arm64/boot/Image.gz

          rm -rf workdir
          mkdir -p workdir

          cp \
            boot.img \
            workdir/boot.img

          cd workdir

          echo "=========================================="
          echo "UNPACK BOOT"
          echo "=========================================="

          /usr/local/bin/magiskboot \
            unpack \
            boot.img

          echo "=========================================="
          echo "UNPACKED FILES"
          echo "=========================================="

          ls -lah

          KOUT="../kernel/out/arch/arm64/boot"

          test -f "$KOUT/Image.gz"

          echo "=========================================="
          echo "REPLACE KERNEL"
          echo "=========================================="

          cp \
            "$KOUT/Image.gz" \
            kernel.gz

          # --------------------------------------------------------
          # Preserve original DTB.
          # --------------------------------------------------------
          if [ -f kernel_dtb ]; then

            echo "Original kernel_dtb found."

            cat \
              kernel.gz \
              kernel_dtb \
              > kernel

          else

            echo "No kernel_dtb found."

            cp \
              kernel.gz \
              kernel

          fi

          test -s kernel

          echo "New kernel:"
          ls -lh kernel

          echo "=========================================="
          echo "REPACK BOOT"
          echo "=========================================="

          /usr/local/bin/magiskboot \
            repack \
            boot.img \
            new-boot.img

          test -s new-boot.img

          cp \
            new-boot.img \
            ../boot_ksu.img

          echo "=========================================="
          echo "REPACK SUCCESS"
          echo "=========================================="

          ls -lh \
            ../boot_ksu.img


      # ============================================================
      # VERIFY BOOT
      # ============================================================
      - name: Verify boot image
        shell: bash
        run: |
          set -euxo pipefail

          test -f boot.img
          test -f boot_ksu.img

          echo "=========================================="
          echo "VERIFY ORIGINAL BOOT"
          echo "=========================================="

          /usr/local/bin/magiskboot \
            verify \
            boot.img || true

          echo "=========================================="
          echo "VERIFY NEW BOOT"
          echo "=========================================="

          /usr/local/bin/magiskboot \
            verify \
            boot_ksu.img || true

          echo "=========================================="
          echo "BOOT FILES"
          echo "=========================================="

          ls -lh \
            boot.img \
            boot_ksu.img


      # ============================================================
      # BOOT SIZE
      # ============================================================
      - name: Check boot image size
        shell: bash
        run: |
          set -euxo pipefail

          ORIGINAL=$(stat -c%s boot.img)
          NEW=$(stat -c%s boot_ksu.img)

          echo "=========================================="
          echo "BOOT SIZE"
          echo "=========================================="

          echo "Original: $ORIGINAL bytes"
          echo "New:      $NEW bytes"

          # --------------------------------------------------------
          # Do not truncate a larger boot image.
          # --------------------------------------------------------
          if [ "$NEW" -gt "$ORIGINAL" ]; then

            echo "WARNING:"
            echo "New boot image is larger than original."
            echo "No truncation will be performed."

          else

            PAD=$((ORIGINAL - NEW))

            echo "Padding: $PAD bytes"

            if [ "$PAD" -gt 0 ]; then

              dd \
                if=/dev/zero \
                bs=1 \
                count="$PAD" \
                status=none \
                >> boot_ksu.img

            fi

          fi

          FINAL=$(stat -c%s boot_ksu.img)

          echo "Final: $FINAL bytes"

          ls -lh boot_ksu.img


      # ============================================================
      # FINAL CHECK
      # ============================================================
      - name: Final check
        shell: bash
        run: |
          set -euxo pipefail

          test -s boot_ksu.img

          echo "=========================================="
          echo "FINAL OUTPUT"
          echo "=========================================="

          ls -lh boot_ksu.img

          file boot_ksu.img

          sha256sum boot_ksu.img


      # ============================================================
      # ARTIFACT
      # ============================================================
      - name: Upload boot_ksu.img
        uses: actions/upload-artifact@v4
        with:
          name: boot_ksu_X00QD_KernelSU
          path: boot_ksu.img
          if-no-files-found: error
