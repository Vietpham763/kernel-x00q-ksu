name: Build ZE620KL crDroid 9.5 KernelSU

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1


      # ============================================================
      # BUILD DEPENDENCIES
      # ============================================================
      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libncurses5-dev \
            libelf-dev \
            libdw-dev \
            cpio \
            rsync \
            unzip \
            zip \
            wget \
            curl \
            git \
            file \
            python3 \
            python3-pip \
            device-tree-compiler \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            g++-arm-linux-gnueabi


      # ============================================================
      # CHECK REPOSITORY
      # ============================================================
      - name: Check repository
        shell: bash
        run: |
          set -euxo pipefail

          echo "=========================================="
          echo "REPOSITORY"
          echo "=========================================="

          if [ -d kernel ] && [ -f kernel/Makefile ]; then
            KERNEL_DIR="$GITHUB_WORKSPACE/kernel"
          elif [ -f Makefile ] && [ -d arch/arm64 ]; then
            KERNEL_DIR="$GITHUB_WORKSPACE"
          else
            echo "ERROR: Cannot locate kernel source."
            echo
            echo "Workspace:"
            pwd
            find . -maxdepth 2 -name Makefile -print
            exit 1
          fi

          echo "Kernel directory: $KERNEL_DIR"

          test -f "$KERNEL_DIR/Makefile"
          test -d "$KERNEL_DIR/arch/arm64"

          cd "$KERNEL_DIR"

          echo "Kernel commit:"
          git log -1 --oneline || true

          echo "Kernel source:"
          pwd

          echo "=========================================="
          echo "DEFCONFIGS"
          echo "=========================================="

          find arch/arm64/configs \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' |
            sort |
            head -150


      # ============================================================
      # FIND ORIGINAL BOOT IMAGE
      # ============================================================
      - name: Locate original boot image
        shell: bash
        run: |
          set -euxo pipefail

          echo "=========================================="
          echo "SEARCH ORIGINAL BOOT IMAGE"
          echo "=========================================="

          if [ -f boot.img ]; then
            echo "Found: ./boot.img"

          elif [ -f boot.zip ]; then
            echo "Found: ./boot.zip"

            unzip -o boot.zip

            if [ ! -f boot.img ]; then
              echo "ERROR: boot.zip does not contain boot.img"
              exit 1
            fi

          else
            echo "ERROR: boot.img or boot.zip not found"
            echo
            echo "Files in repository:"
            find . -maxdepth 4 -type f \
              \( -name "*.img" -o -name "*.zip" \) \
              -print

            exit 1
          fi

          test -f boot.img

          echo "Boot image:"
          ls -lh boot.img

          file boot.img


      # ============================================================
      # INSTALL MAGISKBOOT
      # ============================================================
      - name: Install MagiskBoot
        shell: bash
        run: |
          set -euxo pipefail

          MAGISK_VERSION="27.0"

          echo "=========================================="
          echo "MAGISKBOOT"
          echo "=========================================="

          wget -q -O Magisk.apk \
            "https://github.com/topjohnwu/Magisk/releases/download/v${MAGISK_VERSION}/Magisk-v${MAGISK_VERSION}.apk"

          test -s Magisk.apk

          rm -rf magisk_extract
          mkdir -p magisk_extract

          unzip -o Magisk.apk \
            "lib/x86_64/libmagiskboot.so" \
            -d magisk_extract

          test -f magisk_extract/lib/x86_64/libmagiskboot.so

          cp \
            magisk_extract/lib/x86_64/libmagiskboot.so \
            magiskboot

          chmod +x magiskboot

          sudo install -m 0755 \
            magiskboot \
            /usr/local/bin/magiskboot

          test -x /usr/local/bin/magiskboot

          echo "MagiskBoot installed:"
          command -v magiskboot

          echo "Testing MagiskBoot..."

          set +e
          magiskboot --help >/tmp/magiskboot_help.txt 2>&1
          MAGISK_HELP_RC=$?
          set -e

          cat /tmp/magiskboot_help.txt

          echo "MagiskBoot help exit code: $MAGISK_HELP_RC"

          # MagiskBoot 27.0 prints help and returns 1.
          # This is NOT treated as a build failure.

          echo "MagiskBoot ready."


      # ============================================================
      # UNPACK ORIGINAL BOOT
      # ============================================================
      - name: Unpack original boot image
        shell: bash
        run: |
          set -euxo pipefail

          echo "=========================================="
          echo "UNPACK ORIGINAL BOOT"
          echo "=========================================="

          rm -rf boot_work
          mkdir -p boot_work

          cp boot.img boot_work/boot.img

          cd boot_work

          magiskboot unpack -h boot.img

          echo "=========================================="
          echo "UNPACKED COMPONENTS"
          echo "=========================================="

          ls -lah

          test -f kernel

          echo "Kernel extracted:"
          file kernel
          ls -lh kernel

          if [ -f kernel_dtb ]; then
            echo "kernel_dtb found:"
            ls -lh kernel_dtb
          fi

          if [ -f dtb ]; then
            echo "dtb found:"
            ls -lh dtb
          fi

          if [ -f ramdisk.cpio ]; then
            echo "ramdisk.cpio found:"
            ls -lh ramdisk.cpio
          fi


      # ============================================================
      # INSTALL EXTRACT-IKCONFIG
      # ============================================================
      - name: Install extract-ikconfig helper
        shell: bash
        run: |
          set -euxo pipefail

          echo "=========================================="
          echo "INSTALL EXTRACT-IKCONFIG"
          echo "=========================================="

          mkdir -p tools

          wget -q -O tools/extract-ikconfig \
            https://raw.githubusercontent.com/torvalds/linux/v4.14/scripts/extract-ikconfig

          test -s tools/extract-ikconfig

          chmod +x tools/extract-ikconfig

          echo "extract-ikconfig installed:"
          ls -lh tools/extract-ikconfig


      # ============================================================
      # EXTRACT ORIGINAL KERNEL CONFIG
      # ============================================================
      - name: Extract original kernel config
        shell: bash
        run: |
          set -euxo pipefail

          echo "=========================================="
          echo "EXTRACT ORIGINAL KERNEL CONFIG"
          echo "=========================================="

          rm -f kernel_config_goc

          set +e

          tools/extract-ikconfig \
            boot_work/kernel \
            > kernel_config_goc \
            2>/tmp/extract_ikconfig.log

          EXTRACT_RC=$?

          set -e

          echo "extract-ikconfig exit code: $EXTRACT_RC"

          if [ "$EXTRACT_RC" -ne 0 ] || [ ! -s kernel_config_goc ]; then

            echo "WARNING: Unable to extract embedded config."
            echo
            echo "extract-ikconfig output:"
            cat /tmp/extract_ikconfig.log || true
            echo
            echo "Kernel:"
            file boot_work/kernel
            ls -lh boot_work/kernel

            echo
            echo "Continuing without original embedded config."

            rm -f kernel_config_goc

          else

            echo "Original kernel config extracted."

            echo "Config size:"
            wc -l kernel_config_goc

            echo "=========================================="
            echo "IMPORTANT CONFIG OPTIONS"
            echo "=========================================="

            grep -E \
              '^(CONFIG_SCHED_WALT|CONFIG_SCHED_FREQ_INPUT|CONFIG_COMPAT|CONFIG_COMPAT_VDSO|CONFIG_VDSO32|CONFIG_OVERLAY_FS|CONFIG_MODULE_SIG|CONFIG_SYSTEM_TRUSTED_KEYS|CONFIG_SYSTEM_REVOCATION_KEYS)=' \
              kernel_config_goc || true

          fi


      # ============================================================
      # CLEAN KERNEL SOURCE
      # ============================================================
      - name: Prepare clean kernel source tree
        shell: bash
        run: |
          set -euxo pipefail

          echo "=========================================="
          echo "PREPARE CLEAN KERNEL SOURCE"
          echo "=========================================="

          if [ -d kernel ] && [ -f kernel/Makefile ]; then
            KERNEL_DIR="$GITHUB_WORKSPACE/kernel"
          elif [ -f Makefile ] && [ -d arch/arm64 ]; then
            KERNEL_DIR="$GITHUB_WORKSPACE"
          else
            echo "ERROR: Kernel source not found."
            exit 1
          fi

          cd "$KERNEL_DIR"

          export ARCH=arm64
          export SUBARCH=arm64

          echo "Kernel directory:"
          pwd

          echo
          echo "Git status BEFORE mrproper:"
          git status --short || true

          echo
          echo "Running mrproper..."

          make ARCH=arm64 mrproper

          echo
          echo "Git status AFTER mrproper:"
          git status --short || true

          # Remove only generated output.
          rm -rf out

          mkdir -p out

          test -f Makefile
          test -d arch/arm64

          echo
          echo "Kernel source prepared."


      # ============================================================
      # INTEGRATE KERNELSU NEXT
      # ============================================================
      - name: Integrate KernelSU Next
        shell: bash
        run: |
          set -euxo pipefail

          echo "=========================================="
          echo "KERNELSU NEXT"
          echo "=========================================="

          if [ -d kernel ] && [ -f kernel/Makefile ]; then
            KERNEL_DIR="$GITHUB_WORKSPACE/kernel"
          elif [ -f Makefile ] && [ -d arch/arm64 ]; then
            KERNEL_DIR="$GITHUB_WORKSPACE"
          else
            echo "ERROR: Kernel source not found."
            exit 1
          fi

          cd "$KERNEL_DIR"

          rm -rf KSU
          rm -rf drivers/kernelsu

          git clone \
            --depth=1 \
            https://github.com/KernelSU-Next/KernelSU-Next \
            KSU

          test -d KSU/kernel

          cp -a KSU/kernel drivers/kernelsu

          rm -rf KSU

          test -d drivers/kernelsu
          test -f drivers/kernelsu/Kconfig

          if ! grep -qF 'obj-y += kernelsu/' drivers/Makefile; then
            printf '\nobj-y += kernelsu/\n' >> drivers/Makefile
          fi

          if ! grep -qF 'source "drivers/kernelsu/Kconfig"' drivers/Kconfig; then
            printf '\nsource "drivers/kernelsu/Kconfig"\n' >> drivers/Kconfig
          fi

          echo "KernelSU integration complete."

          echo
          echo "drivers/Makefile:"
          grep -nF 'kernelsu' drivers/Makefile || true

          echo
          echo "drivers/Kconfig:"
          grep -nF 'drivers/kernelsu/Kconfig' drivers/Kconfig || true


      # ============================================================
      # PREPARE CONFIG
      # ============================================================
      - name: Prepare kernel config
        shell: bash
        run: |
          set -euxo pipefail

          echo "=========================================="
          echo "PREPARE CONFIG"
          echo "=========================================="

          if [ -d kernel ] && [ -f kernel/Makefile ]; then
            KERNEL_DIR="$GITHUB_WORKSPACE/kernel"
          elif [ -f Makefile ] && [ -d arch/arm64 ]; then
            KERNEL_DIR="$GITHUB_WORKSPACE"
          else
            echo "ERROR: Kernel source not found."
            exit 1
          fi

          cd "$KERNEL_DIR"

          export ARCH=arm64
          export SUBARCH=arm64

          rm -rf out
          mkdir -p out

          # Prefer the config extracted from the original boot image.
          if [ -s ../kernel_config_goc ]; then
            cp ../kernel_config_goc out/.config

          elif [ -s "$GITHUB_WORKSPACE/kernel_config_goc" ]; then
            cp "$GITHUB_WORKSPACE/kernel_config_goc" out/.config

          else
            echo "No embedded original config found."
            echo "Trying available X00TD/X00QD defconfig."

            DEFCONFIG=""

            for cfg in \
              x00td_defconfig \
              x00td-perf_defconfig \
              x00td_defconfig_user \
              x00td-user_defconfig \
              X00TD_defconfig \
              X00QD_defconfig
            do
              if [ -f "arch/arm64/configs/$cfg" ]; then
                DEFCONFIG="$cfg"
                break
              fi
            done

            if [ -z "$DEFCONFIG" ]; then
              echo "ERROR: No suitable defconfig found."
              find arch/arm64/configs \
                -maxdepth 1 \
                -type f \
                -printf '%f\n' |
                sort |
                grep -Ei 'x00|ze620|asus' || true

              exit 1
            fi

            echo "Using defconfig: $DEFCONFIG"

            make \
              O=out \
              ARCH=arm64 \
              "$DEFCONFIG"
          fi

          test -s out/.config

          echo "Running olddefconfig..."

          make \
            O=out \
            ARCH=arm64 \
            olddefconfig

          echo "Applying KernelSU configuration..."

          if [ -x scripts/config ]; then

            ./scripts/config \
              --file out/.config \
              --enable KSU || true

            ./scripts/config \
              --file out/.config \
              --enable OVERLAY_FS || true

            ./scripts/config \
              --file out/.config \
              --disable MODULE_SIG || true

            ./scripts/config \
              --file out/.config \
              --set-str SYSTEM_TRUSTED_KEYS "" || true

            ./scripts/config \
              --file out/.config \
              --set-str SYSTEM_REVOCATION_KEYS "" || true

          fi

          make \
            O=out \
            ARCH=arm64 \
            olddefconfig

          test -f out/.config

          echo "=========================================="
          echo "FINAL CONFIG"
          echo "=========================================="

          grep -E \
            '^(CONFIG_(KSU|OVERLAY_FS|MODULE_SIG|SYSTEM_TRUSTED_KEYS|SYSTEM_REVOCATION_KEYS))=' \
            out/.config || true


      # ============================================================
      # DOWNLOAD ANDROID LLVM CLANG
      # ============================================================
      - name: Download Android LLVM Clang
        shell: bash
        run: |
          set -euxo pipefail

          echo "=========================================="
          echo "ANDROID CLANG"
          echo "=========================================="

          rm -rf clang

          git clone \
            --depth=1 \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
            clang

          CLANG_BIN="$(
            find "$GITHUB_WORKSPACE/clang" \
              -type f \
              -path '*/bin/clang' \
              -printf '%h\n' |
              sort |
              tail -1
          )"

          test -n "$CLANG_BIN"
          test -x "$CLANG_BIN/clang"
          test -x "$CLANG_BIN/ld.lld"

          echo "CLANG_BIN=$CLANG_BIN" >> "$GITHUB_ENV"
          echo "$CLANG_BIN" >> "$GITHUB_PATH"

          echo "=========================================="
          echo "CLANG VERSION"
          echo "=========================================="

          "$CLANG_BIN/clang" --version
          "$CLANG_BIN/ld.lld" --version


      # ============================================================
      # BUILD KERNEL
      # ============================================================
      - name: Build kernel
        shell: bash
        run: |
          set -euxo pipefail

          echo "=========================================="
          echo "BUILD KERNEL"
          echo "=========================================="

          if [ -d kernel ] && [ -f kernel/Makefile ]; then
            KERNEL_DIR="$GITHUB_WORKSPACE/kernel"
          elif [ -f Makefile ] && [ -d arch/arm64 ]; then
            KERNEL_DIR="$GITHUB_WORKSPACE"
          else
            echo "ERROR: Kernel source not found."
            exit 1
          fi

          cd "$KERNEL_DIR"

          export ARCH=arm64
          export SUBARCH=arm64

          export PATH="$CLANG_BIN:$PATH"

          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          export LLVM=1
          export LLVM_IAS=1

          export CC=clang
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export STRIP=llvm-strip
          export READELF=llvm-readelf

          echo "=========================================="
          echo "TOOLCHAIN"
          echo "=========================================="

          clang --version
          ld.lld --version

          echo
          echo "AArch64 GCC:"
          aarch64-linux-gnu-gcc --version

          echo
          echo "ARM32 GCC:"
          arm-linux-gnueabi-gcc --version

          echo
          echo "=========================================="
          echo "CONFIG CHECK"
          echo "=========================================="

          test -f out/.config

          grep -E \
            'CONFIG_(KSU|OVERLAY_FS|MODULE_SIG|SYSTEM_TRUSTED_KEYS|SYSTEM_REVOCATION_KEYS)' \
            out/.config || true

          echo
          echo "=========================================="
          echo "BUILD"
          echo "=========================================="

          # IMPORTANT:
          #
          # Previous builds failed with:
          #
          # LLVM ERROR: IO failure on output stream: Broken pipe
          #
          # Use one job to eliminate the parallel LLVM failure.
          JOBS=1

          echo "Build jobs: $JOBS"

          make \
            -j"$JOBS" \
            O=out \
            ARCH=arm64 \
            SUBARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            READELF=llvm-readelf \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            KCFLAGS="-Wno-error" \
            Image.gz

          echo "=========================================="
          echo "BUILD COMPLETE"
          echo "=========================================="

          test -f out/arch/arm64/boot/Image.gz

          ls -lh out/arch/arm64/boot/Image.gz


      # ============================================================
      # VERIFY KERNEL OUTPUT
      # ============================================================
      - name: Verify kernel output
        shell: bash
        run: |
          set -euxo pipefail

          echo "=========================================="
          echo "VERIFY KERNEL"
          echo "=========================================="

          if [ -d kernel ]; then
            IMAGE="kernel/out/arch/arm64/boot/Image.gz"
          else
            IMAGE="out/arch/arm64/boot/Image.gz"
          fi

          test -f "$IMAGE"

          file "$IMAGE"
          ls -lh "$IMAGE"


      # ============================================================
      # REPACK BOOT IMAGE
      # ============================================================
      - name: Repack boot image
        shell: bash
        run: |
          set -euxo pipefail

          echo "=========================================="
          echo "REPACK BOOT IMAGE"
          echo "=========================================="

          test -f boot.img

          if [ -d kernel ]; then
            KERNEL_IMAGE="$GITHUB_WORKSPACE/kernel/out/arch/arm64/boot/Image.gz"
          else
            KERNEL_IMAGE="$GITHUB_WORKSPACE/out/arch/arm64/boot/Image.gz"
          fi

          test -f "$KERNEL_IMAGE"

          rm -rf repack
          mkdir -p repack

          cp boot.img repack/boot.img

          cd repack

          echo "Unpacking original boot image..."

          magiskboot unpack -h boot.img

          echo "=========================================="
          echo "ORIGINAL BOOT COMPONENTS"
          echo "=========================================="

          ls -lah

          test -f kernel

          echo
          echo "Original kernel:"
          file kernel
          ls -lh kernel

          echo
          echo "New kernel:"
          file "$KERNEL_IMAGE"
          ls -lh "$KERNEL_IMAGE"

          # ========================================================
          # REPLACE KERNEL
          # ========================================================
          #
          # magiskboot unpack decompresses the kernel component.
          #
          # Image.gz produced by the kernel build is gzip compressed.
          # Decompress it before putting it into the unpack directory.
          #
          # magiskboot repack will automatically restore the original
          # compression format based on the original boot image.
          # ========================================================

          rm -f kernel

          gzip -cd "$KERNEL_IMAGE" > kernel

          test -s kernel

          echo
          echo "Replacement kernel:"
          file kernel
          ls -lh kernel

          echo
          echo "=========================================="
          echo "PRESERVED COMPONENTS"
          echo "=========================================="

          if [ -f kernel_dtb ]; then
            echo "kernel_dtb: preserved"
          fi

          if [ -f dtb ]; then
            echo "dtb: preserved"
          fi

          if [ -f recovery_dtbo ]; then
            echo "recovery_dtbo: preserved"
          fi

          if [ -f ramdisk.cpio ]; then
            echo "ramdisk.cpio: preserved"
          fi

          if [ -f second ]; then
            echo "second: preserved"
          fi

          if [ -f extra ]; then
            echo "extra: preserved"
          fi

          echo
          echo "=========================================="
          echo "MAGISKBOOT REPACK"
          echo "=========================================="

          magiskboot repack \
            boot.img \
            new-boot.img

          test -f new-boot.img
          test -s new-boot.img

          cp new-boot.img "$GITHUB_WORKSPACE/boot_ksu.img"

          echo
          echo "New boot image:"
          ls -lh "$GITHUB_WORKSPACE/boot_ksu.img"

          file "$GITHUB_WORKSPACE/boot_ksu.img"


      # ============================================================
      # VERIFY BOOT IMAGE
      # ============================================================
      - name: Verify repacked boot image
        shell: bash
        run: |
          set -euxo pipefail

          echo "=========================================="
          echo "VERIFY REPACKED BOOT"
          echo "=========================================="

          test -f boot.img
          test -f boot_ksu.img
          test -s boot_ksu.img

          echo "Original:"
          ls -lh boot.img

          echo
          echo "New:"
          ls -lh boot_ksu.img

          echo
          echo "File information:"
          file boot.img
          file boot_ksu.img

          echo
          echo "MagiskBoot verification:"

          set +e

          magiskboot verify boot_ksu.img

          VERIFY_RC=$?

          set -e

          echo "AVB verify exit code: $VERIFY_RC"

          # verify returns non-zero when the image does not contain
          # an AVB 1.0 signature. That is not automatically an error.


      # ============================================================
      # CHECK BOOT IMAGE SIZE
      # ============================================================
      - name: Check boot image size
        shell: bash
        run: |
          set -euxo pipefail

          echo "=========================================="
          echo "CHECK BOOT SIZE"
          echo "=========================================="

          ORIGINAL=$(stat -c%s boot.img)
          NEW=$(stat -c%s boot_ksu.img)

          echo "Original size: $ORIGINAL"
          echo "New size:      $NEW"

          if [ "$NEW" -gt "$ORIGINAL" ]; then
            echo
            echo "WARNING:"
            echo "New boot image is larger than original."
            echo
            echo "Original image will NOT be truncated."
            echo "Failing is safer than producing a corrupted boot image."
            exit 1
          fi

          PAD=$((ORIGINAL - NEW))

          if [ "$PAD" -gt 0 ]; then

            echo "Padding image by $PAD bytes."

            dd \
              if=/dev/zero \
              bs=1 \
              count="$PAD" \
              status=progress \
              >> boot_ksu.img

          fi

          FINAL=$(stat -c%s boot_ksu.img)

          echo "Final size: $FINAL"

          if [ "$FINAL" -ne "$ORIGINAL" ]; then
            echo "ERROR: final boot image size does not match original."
            exit 1
          fi

          echo "Boot image size OK."


      # ============================================================
      # FINAL INFORMATION
      # ============================================================
      - name: Final artifact information
        shell: bash
        run: |
          set -euxo pipefail

          echo "=========================================="
          echo "FINAL OUTPUT"
          echo "=========================================="

          test -f boot_ksu.img
          test -s boot_ksu.img

          ls -lh boot_ksu.img

          file boot_ksu.img

          echo
          echo "SHA256:"
          sha256sum boot_ksu.img


      # ============================================================
      # UPLOAD ARTIFACT
      # ============================================================
      - name: Upload KernelSU boot image
        uses: actions/upload-artifact@v4
        with:
          name: boot_ksu_X00QD_KernelSU
          path: boot_ksu.img
          if-no-files-found: error
