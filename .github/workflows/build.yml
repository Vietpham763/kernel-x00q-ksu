name: Build ZE620KL crDroid 9.5 KernelSU

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      ARCH: arm64
      SUBARCH: arm64
      KERNEL_REPO: https://github.com/LineageOS/android_kernel_asus_sdm660.git
      KERNEL_BRANCH: lineage-18.1
      KSU_VERSION: v0.9.5

    steps:

      # ============================================================
      # 1. Checkout repository
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # 2. Dependencies
      # ============================================================
      - name: Install dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            cpio \
            flex \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            git \
            libelf-dev \
            libncurses5-dev \
            libssl-dev \
            device-tree-compiler \
            python3 \
            rsync \
            unzip \
            wget \
            xz-utils

      # ============================================================
      # 3. Get boot.img from boot.zip
      # ============================================================
      - name: Extract crDroid boot.img
        run: |
          set -e

          if [ ! -f boot.zip ]; then
            echo "ERROR: boot.zip not found"
            exit 1
          fi

          unzip -o boot.zip

          if [ ! -f boot.img ]; then
            echo "ERROR: boot.img not found"
            exit 1
          fi

          mkdir -p original

          cp boot.img original/boot.img

          echo "Original boot.img:"
          ls -lh original/boot.img

      # ============================================================
      # 4. MagiskBoot
      # ============================================================
      - name: Install MagiskBoot
        run: |
          set -e

          wget -O Magisk.apk \
            https://github.com/topjohnwu/Magisk/releases/download/v27.0/Magisk-v27.0.apk

          unzip -o Magisk.apk \
            "lib/x86_64/libmagiskboot.so" \
            -d magisk_extract

          cp \
            magisk_extract/lib/x86_64/libmagiskboot.so \
            magiskboot

          chmod +x magiskboot

          ./magiskboot --help >/dev/null

      # ============================================================
      # 5. Unpack original boot
      # ============================================================
      - name: Unpack original boot
        run: |
          set -e

          mkdir -p boot_work

          cp original/boot.img boot_work/boot.img

          cd boot_work

          ../../magiskboot unpack boot.img

          echo "======================================"
          echo "Original boot.img structure"
          echo "======================================"

          ls -lah

          echo ""
          echo "Kernel:"
          file kernel || true

          echo ""
          echo "Kernel DTB:"
          file kernel_dtb || true

          echo ""
          echo "Ramdisk:"
          file ramdisk.cpio* || true

      # ============================================================
      # 6. Clone kernel
      # ============================================================
      - name: Clone SDM660 kernel
        run: |
          set -e

          git clone \
            --depth=1 \
            -b "${KERNEL_BRANCH}" \
            "${KERNEL_REPO}" \
            kernel

          cd kernel

          echo "======================================"
          echo "Kernel source"
          echo "======================================"

          git log -1 --oneline

          echo ""
          echo "Kernel version:"
          make kernelversion

      # ============================================================
      # 7. Show available defconfig
      # ============================================================
      - name: Find defconfig
        run: |
          set -e

          cd kernel

          echo "Available relevant defconfigs:"

          find arch/arm64/configs \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' \
            | grep -Ei \
              'sdm660|x00|asus' \
            | sort || true

      # ============================================================
      # 8. Integrate KernelSU
      # ============================================================
      - name: Integrate KernelSU
        run: |
          set -e

          cd kernel

          curl -LSs \
            "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" \
            | bash -s "${KSU_VERSION}"

          if [ ! -d KernelSU ]; then
            echo "ERROR: KernelSU integration failed"
            exit 1
          fi

          echo "KernelSU ${KSU_VERSION} integrated."

      # ============================================================
      # 9. Configure kernel
      # ============================================================
      - name: Configure kernel
        run: |
          set -e

          cd kernel

          mkdir -p out

          if [ -f arch/arm64/configs/x00qd_defconfig ]; then
            DEFCONFIG=x00qd_defconfig

          elif [ -f arch/arm64/configs/sdm660_defconfig ]; then
            DEFCONFIG=sdm660_defconfig

          elif [ -f arch/arm64/configs/vendor/sdm660_defconfig ]; then
            DEFCONFIG=vendor/sdm660_defconfig

          else
            echo "ERROR: No suitable SDM660/X00QD defconfig found"
            exit 1
          fi

          echo "Using:"
          echo "${DEFCONFIG}"

          make O=out "${DEFCONFIG}"

          # KernelSU
          ./scripts/config \
            --file out/.config \
            --enable CONFIG_KSU

          # OverlayFS
          ./scripts/config \
            --file out/.config \
            --enable CONFIG_OVERLAY_FS

          # Disable module signing
          ./scripts/config \
            --file out/.config \
            --disable CONFIG_MODULE_SIG

          ./scripts/config \
            --disable CONFIG_MODULE_SIG_FORCE

          ./scripts/config \
            --disable CONFIG_SYSTEM_TRUSTED_KEYRING

          ./scripts/config \
            --set-str CONFIG_SYSTEM_TRUSTED_KEYS ""

          ./scripts/config \
            --set-str CONFIG_SYSTEM_REVOCATION_KEYS ""

          # Old Android 4.4 ARM64 compatibility
          ./scripts/config \
            --disable CONFIG_VDSO32

          ./scripts/config \
            --disable CONFIG_COMPAT_VDSO

          make O=out olddefconfig

          echo ""
          echo "KernelSU configuration:"
          grep -E \
            '^CONFIG_KSU=|^CONFIG_OVERLAY_FS=' \
            out/.config || true

      # ============================================================
      # 10. Download Clang
      # ============================================================
      - name: Download Android Clang
        run: |
          set -e

          git clone \
            --depth=1 \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
            clang

          echo "Available clang:"
          find clang \
            -type f \
            -path '*/bin/clang' \
            | sort

      # ============================================================
      # 11. Build kernel
      # ============================================================
      - name: Build kernel
        run: |
          set -e

          cd kernel

          CLANG_BIN=$(
            find "$GITHUB_WORKSPACE/clang" \
              -type f \
              -path '*/bin/clang' \
              | sort \
              | tail -1 \
              | xargs dirname
          )

          if [ -z "${CLANG_BIN}" ]; then
            echo "ERROR: Clang not found"
            exit 1
          fi

          export PATH="${CLANG_BIN}:$PATH"

          echo "======================================"
          echo "Compiler"
          echo "======================================"

          clang --version

          export ARCH=arm64
          export SUBARCH=arm64

          make -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            KCFLAGS="-Wno-error" \
            Image.gz

          if [ ! -f out/arch/arm64/boot/Image.gz ]; then
            echo "ERROR: Image.gz was not generated"
            exit 1
          fi

          echo ""
          echo "Kernel built successfully:"
          ls -lh out/arch/arm64/boot/Image.gz

      # ============================================================
      # 12. Preserve original DTB
      # ============================================================
      - name: Prepare kernel + original DTB
        run: |
          set -e

          NEW_KERNEL="kernel/out/arch/arm64/boot/Image.gz"

          if [ ! -f "${NEW_KERNEL}" ]; then
            echo "ERROR: Image.gz missing"
            exit 1
          fi

          cd boot_work

          cp kernel kernel.original

          if [ -f kernel_dtb ]; then

            echo "Original DTB detected."

            cp kernel_dtb ../original_kernel_dtb

            cat \
              "${GITHUB_WORKSPACE}/${NEW_KERNEL}" \
              kernel_dtb \
              > kernel.new

            mv kernel.new kernel

          else

            echo "No separate kernel_dtb detected."

            cp \
              "${GITHUB_WORKSPACE}/${NEW_KERNEL}" \
              kernel

          fi

          echo ""
          echo "Final kernel:"
          stat -c "%s bytes" kernel

      # ============================================================
      # 13. Repack boot
      # ============================================================
      - name: Repack boot.img
        run: |
          set -e

          cd boot_work

          ../../magiskboot repack \
            boot.img \
            ../boot_ksu.img

          if [ ! -f ../boot_ksu.img ]; then
            echo "ERROR: boot_ksu.img not generated"
            exit 1
          fi

          echo "======================================"
          echo "New boot.img"
          echo "======================================"

          ls -lh ../boot_ksu.img

      # ============================================================
      # 14. Validate generated boot
      # ============================================================
      - name: Validate boot image
        run: |
          set -e

          rm -rf validation

          mkdir validation

          cp boot_ksu.img validation/

          cd validation

          ../magiskboot unpack boot_ksu.img

          if [ ! -f kernel ]; then
            echo "ERROR: repacked kernel cannot be unpacked"
            exit 1
          fi

          echo "======================================"
          echo "Repacked boot validation OK"
          echo "======================================"

          ls -lah

      # ============================================================
      # 15. Save build information
      # ============================================================
      - name: Build information
        run: |
          set -e

          {
            echo "Device: ASUS Zenfone 5 ZE620KL / X00QD"
            echo "ROM: crDroid 9.5 Android 13"
            echo "Kernel source: ${KERNEL_REPO}"
            echo "Kernel branch: ${KERNEL_BRANCH}"
            echo "KernelSU: ${KSU_VERSION}"
            echo ""
            echo "Original boot:"
            stat -c "%s bytes" original/boot.img
            echo ""
            echo "New boot:"
            stat -c "%s bytes" boot_ksu.img
            echo ""
            echo "Kernel:"
            stat -c "%s bytes" kernel/out/arch/arm64/boot/Image.gz
          } > build-info.txt

          cat build-info.txt

      # ============================================================
      # 16. Upload
      # ============================================================
      - name: Upload boot_ksu.img
        uses: actions/upload-artifact@v4
        with:
          name: ZE620KL-crDroid-9.5-KernelSU
          path: boot_ksu.img

      - name: Upload build information
        uses: actions/upload-artifact@v4
        with:
          name: ZE620KL-build-info
          path: |
            build-info.txt
            original_kernel_dtb
