      - name: Unpack & Repack boot.img gốc với KernelSU mới
        run: |
          # Kiểm tra file boot.zip hoặc boot.img
          if [ -f boot.zip ]; then
            unzip boot.zip
          fi

          if [ ! -f boot.img ]; then
            echo "LỖI: Không tìm thấy boot.img hoặc boot.zip trong repository!"
            exit 1
          fi

          # Lấy kích thước chuẩn (byte) của file boot.img gốc
          ORIG_SIZE=$(stat -c%s "boot.img")
          echo "Kích thước gốc boot.img: $ORIG_SIZE bytes"

          mkdir workdir
          cp boot.img workdir/
          cd workdir

          # Unpack boot.img gốc bằng magiskboot
          magiskboot unpack boot.img

          # Thay thế kernel bằng kernel vừa biên dịch
          if [ -f ../kernel/out/arch/arm64/boot/Image.gz-dtb ]; then
            cp ../kernel/out/arch/arm64/boot/Image.gz-dtb kernel
          elif [ -f ../kernel/out/arch/arm64/boot/Image.gz ]; then
            cp ../kernel/out/arch/arm64/boot/Image.gz kernel
          elif [ -f ../kernel/out/arch/arm64/boot/Image ]; then
            cp ../kernel/out/arch/arm64/boot/Image kernel
          fi

          # Repack lại
          magiskboot repack boot.img ../boot_raw.img

          # Cắt (truncate) file mới về đúng 100% kích thước phân vùng boot gốc
          cd ..
          cp boot_raw.img boot_ksu.img
          truncate -s $ORIG_SIZE boot_ksu.img
