name: Build ZE620KL crDroid 9.5 KernelSU

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      ARCH: arm64
      SUBARCH: arm64
      KERNEL_DIR: kernel
      OUT_DIR: out

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout Repository
        uses: actions/checkout@v4


      # ============================================================
      # DEPENDENCIES
      # ============================================================
      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libncurses5-dev \
            libelf-dev \
            git \
            wget \
            unzip \
            zip \
            cpio \
            rsync \
            device-tree-compiler \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            g++-arm-linux-gnueabi \
            python3


      # ============================================================
      # ORIGINAL BOOT
      # ============================================================
      - name: Prepare original boot.img
        shell: bash
        run: |
          set -euxo pipefail

          if [ -f boot.zip ]; then
            unzip -o boot.zip
          fi

          if [ ! -f boot.img ]; then
            echo "ERROR: boot.img not found in repository."
            echo "Please place the original ZE620KL boot.img in repository root."
            exit 1
          fi

          echo "Original boot.img:"
          ls -lh boot.img


      # ============================================================
      # MAGISKBOOT
      # ============================================================
      - name: Install MagiskBoot
        shell: bash
        run: |
          set -euxo pipefail

          MAGISK_VERSION="27.0"
          MAGISK_URL="https://github.com/topjohnwu/Magisk/releases/download/v${MAGISK_VERSION}/Magisk-v${MAGISK_VERSION}.apk"

          wget -q \
            -O Magisk.apk \
            "$MAGISK_URL"

          rm -rf magisk_extract
          mkdir -p magisk_extract

          unzip -o \
            Magisk.apk \
            "lib/x86_64/libmagiskboot.so" \
            -d magisk_extract

          test -f \
            magisk_extract/lib/x86_64/libmagiskboot.so

          cp \
            magisk_extract/lib/x86_64/libmagiskboot.so \
            magiskboot

          chmod +x magiskboot

          echo "MagiskBoot installed."

          # Do NOT use "magiskboot --help" here.
          # Some MagiskBoot versions return exit code 1 for --help.
          ./magiskboot 2>&1 | head -20 || true

          ./magiskboot unpack --help 2>&1 | head -5 || true

          echo "MagiskBoot test completed."


      # ============================================================
      # KERNEL SOURCE
      # ============================================================
      - name: Clone ASUS SDM660 Kernel
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf "$KERNEL_DIR"

          git clone \
            --depth=1 \
            -b lineage-18.1 \
            https://github.com/LineageOS/android_kernel_asus_sdm660 \
            "$KERNEL_DIR"

          cd "$KERNEL_DIR"

          echo "Kernel commit:"
          git log -1 --oneline

          test -f Makefile
          test -d arch/arm64


      # ============================================================
      # CLEAN SOURCE TREE
      #
      # IMPORTANT:
      # The old build failed with:
      #
      # Using .. as source for kernel
      # .. is not clean, please run 'make mrproper'
      #
      # mrproper MUST happen before generated files/config are created.
      # ============================================================
      - name: Clean kernel source
        shell: bash
        run: |
          set -euxo pipefail

          cd "$KERNEL_DIR"

          rm -rf out

          make \
            ARCH=arm64 \
            mrproper

          mkdir -p out

          echo "Kernel source cleaned."

          test -f Makefile
          test -d arch/arm64


      # ============================================================
      # EXTRACT ORIGINAL KERNEL CONFIG
      # ============================================================
      - name: Extract original kernel config
        shell: bash
        run: |
          set -euxo pipefail

          cd "$GITHUB_WORKSPACE"

          test -f boot.img

          cd "$KERNEL_DIR"

          if [ ! -x scripts/extract-ikconfig ]; then
            chmod +x scripts/extract-ikconfig
          fi

          echo "Extracting original config..."

          if ../kernel/scripts/extract-ikconfig \
              ../boot.img \
              > ../kernel_config_goc 2>/dev/null; then

            if [ -s ../kernel_config_goc ]; then
              echo "Original kernel config extracted."
            else
              echo "ERROR: extracted config is empty."
              exit 1
            fi

          else
            echo "ERROR: unable to extract kernel config."
            exit 1
          fi

          cp \
            ../kernel_config_goc \
            arch/arm64/configs/custom_x00qd_defconfig

          test -s \
            arch/arm64/configs/custom_x00qd_defconfig

          echo "Custom defconfig created."


      # ============================================================
      # KERNELSU NEXT
      # ============================================================
      - name: Integrate KernelSU Next
        shell: bash
        run: |
          set -euxo pipefail

          cd "$KERNEL_DIR"

          rm -rf KSU
          rm -rf drivers/kernelsu

          git clone \
            --depth=1 \
            https://github.com/KernelSU-Next/KernelSU-Next \
            KSU

          test -d KSU/kernel

          cp -a \
            KSU/kernel \
            drivers/kernelsu

          rm -rf KSU

          if ! grep -q \
              'obj-y += kernelsu/' \
              drivers/Makefile; then

            echo 'obj-y += kernelsu/' >> drivers/Makefile
          fi

          if ! grep -q \
              'drivers/kernelsu/Kconfig' \
              drivers/Kconfig; then

            echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig
          fi

          echo "KernelSU source integrated."

          test -d drivers/kernelsu


      # ============================================================
      # CONFIG
      # ============================================================
      - name: Prepare kernel config
        shell: bash
        run: |
          set -euxo pipefail

          cd "$KERNEL_DIR"

          export ARCH=arm64
          export SUBARCH=arm64

          rm -rf out
          mkdir -p out

          echo "=========================================="
          echo "CREATE DEFCONFIG"
          echo "=========================================="

          make \
            O=out \
            ARCH=arm64 \
            custom_x00qd_defconfig

          test -f out/.config

          echo "=========================================="
          echo "KERNEL CONFIG"
          echo "=========================================="

          ./scripts/config \
            --file out/.config \
            --disable VDSO32 || true

          ./scripts/config \
            --file out/.config \
            --disable COMPAT_VDSO || true

          # Do not force-disable CONFIG_COMPAT unless the
          # original kernel does not require it.
          #
          # Old SDM660 kernels can depend on compat support.
          #
          # Therefore we intentionally leave CONFIG_COMPAT
          # according to the original defconfig.

          ./scripts/config \
            --enable KSU || true

          ./scripts/config \
            --enable OVERLAY_FS || true

          ./scripts/config \
            --set-str SYSTEM_TRUSTED_KEYS "" || true

          ./scripts/config \
            --set-str SYSTEM_REVOCATION_KEYS "" || true

          # Module signing is not required for this build.
          ./scripts/config \
            --disable MODULE_SIG || true

          make \
            O=out \
            ARCH=arm64 \
            olddefconfig

          echo "=========================================="
          echo "FINAL CONFIG"
          echo "=========================================="

          grep -E \
            'CONFIG_(VDSO32|COMPAT_VDSO|COMPAT|KSU|OVERLAY_FS|MODULE_SIG)' \
            out/.config || true

          echo "Config preparation completed."


      # ============================================================
      # ANDROID CLANG
      #
      # The previous build used Clang 22.0.2.
      # This kernel tree is old, so use an older Android Clang.
      # ============================================================
      - name: Download Android Clang
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf clang

          git clone \
            --depth=1 \
            -b android12-release \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
            clang

          CLANG_BIN="$GITHUB_WORKSPACE/clang/clang-r416183b/bin"

          if [ ! -x "$CLANG_BIN/clang" ]; then
            echo "ERROR: clang-r416183b was not found."

            echo "Available clang versions:"
            find "$GITHUB_WORKSPACE/clang" \
              -type f \
              -path '*/bin/clang' \
              -printf '%h\n' \
              | sort \
              | head -50

            exit 1
          fi

          echo "CLANG_BIN=$CLANG_BIN" >> "$GITHUB_ENV"
          echo "$CLANG_BIN" >> "$GITHUB_PATH"

          echo "=========================================="
          echo "CLANG VERSION"
          echo "=========================================="

          "$CLANG_BIN/clang" --version
          "$CLANG_BIN/ld.lld" --version


      # ============================================================
      # TOOLCHAIN CHECK
      # ============================================================
      - name: Check toolchain
        shell: bash
        run: |
          set -euxo pipefail

          echo "=========================================="
          echo "LLVM TOOLCHAIN"
          echo "=========================================="

          clang --version
          ld.lld --version
          llvm-ar --version
          llvm-nm --version

          echo
          echo "AArch64 GCC:"
          aarch64-linux-gnu-gcc --version

          echo
          echo "ARM32 GCC:"
          arm-linux-gnueabi-gcc --version


      # ============================================================
      # BUILD KERNEL
      # ============================================================
      - name: Build kernel
        shell: bash
        run: |
          set -euxo pipefail

          cd "$KERNEL_DIR"

          export ARCH=arm64
          export SUBARCH=arm64

          export PATH="$CLANG_BIN:$PATH"

          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          export LLVM=1
          export LLVM_IAS=1

          export CC=clang
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export STRIP=llvm-strip
          export READELF=llvm-readelf

          echo "=========================================="
          echo "BUILD CONFIG"
          echo "=========================================="

          grep -E \
            'CONFIG_(VDSO32|COMPAT_VDSO|COMPAT|KSU|OVERLAY_FS|MODULE_SIG)' \
            out/.config || true

          echo "=========================================="
          echo "BUILD KERNEL"
          echo "=========================================="

          # Use only 2 jobs.
          #
          # Previous builds produced:
          # LLVM ERROR: IO failure on output stream: Broken pipe
          #
          # Reducing parallelism makes the GitHub runner considerably
          # less likely to kill LLVM processes due to memory pressure.
          JOBS=2

          echo "Parallel jobs: $JOBS"

          make \
            -j"$JOBS" \
            O=out \
            ARCH=arm64 \
            SUBARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            READELF=llvm-readelf \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            KCFLAGS="-Wno-error" \
            WERROR=0 \
            Image.gz

          echo "Kernel build completed."


      # ============================================================
      # VERIFY KERNEL
      # ============================================================
      - name: Verify kernel
        shell: bash
        run: |
          set -euxo pipefail

          cd "$KERNEL_DIR"

          test -f out/arch/arm64/boot/Image.gz

          echo "=========================================="
          echo "KERNEL OUTPUT"
          echo "=========================================="

          ls -lh \
            out/arch/arm64/boot/Image.gz

          file \
            out/arch/arm64/boot/Image.gz


      # ============================================================
      # UNPACK ORIGINAL BOOT
      # ============================================================
      - name: Unpack original boot
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf workdir
          mkdir -p workdir

          cp \
            boot.img \
            workdir/boot.img

          cd workdir

          "$GITHUB_WORKSPACE/magiskboot" \
            unpack \
            boot.img

          echo "=========================================="
          echo "BOOT COMPONENTS"
          echo "=========================================="

          ls -lah


      # ============================================================
      # REPLACE KERNEL
      # ============================================================
      - name: Replace boot kernel
        shell: bash
        run: |
          set -euxo pipefail

          cd workdir

          KOUT="$GITHUB_WORKSPACE/kernel/out/arch/arm64/boot"

          test -f "$KOUT/Image.gz"
          test -f kernel

          echo "Original kernel:"
          file kernel
          ls -lh kernel

          echo "New kernel:"
          file "$KOUT/Image.gz"
          ls -lh "$KOUT/Image.gz"

          # MagiskBoot unpack normally decompresses the kernel
          # into the file named "kernel".
          #
          # We therefore create the replacement from Image.gz
          # and let MagiskBoot handle the boot image compression.
          cp \
            "$KOUT/Image.gz" \
            kernel

          echo "Kernel replaced."


      # ============================================================
      # REPACK BOOT
      # ============================================================
      - name: Repack boot.img
        shell: bash
        run: |
          set -euxo pipefail

          cd workdir

          echo "=========================================="
          echo "REPACK BOOT"
          echo "=========================================="

          "$GITHUB_WORKSPACE/magiskboot" \
            repack \
            boot.img \
            new-boot.img

          test -f new-boot.img

          cp \
            new-boot.img \
            "$GITHUB_WORKSPACE/boot_ksu.img"

          echo "=========================================="
          echo "OUTPUT"
          echo "=========================================="

          ls -lh \
            "$GITHUB_WORKSPACE/boot_ksu.img"


      # ============================================================
      # VERIFY BOOT IMAGE
      # ============================================================
      - name: Verify boot image
        shell: bash
        run: |
          set -euxo pipefail

          test -f boot_ksu.img

          echo "Original boot:"
          stat -c "%n %s bytes" boot.img

          echo "New boot:"
          stat -c "%n %s bytes" boot_ksu.img

          echo "Testing repacked image..."

          rm -rf verify_boot
          mkdir -p verify_boot

          cp \
            boot_ksu.img \
            verify_boot/

          cd verify_boot

          "$GITHUB_WORKSPACE/magiskboot" \
            unpack \
            boot_ksu.img

          test -f kernel

          echo "Repacked boot image is readable."

          echo "Boot contents:"
          ls -lah


      # ============================================================
      # ARTIFACT
      # ============================================================
      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: ZE620KL-crDroid-9.5-KernelSU-kernel
          path: kernel/out/arch/arm64/boot/Image.gz
          if-no-files-found: error


      - name: Upload boot image
        uses: actions/upload-artifact@v4
        with:
          name: ZE620KL-crDroid-9.5-KernelSU-boot
          path: boot_ksu.img
          if-no-files-found: error
