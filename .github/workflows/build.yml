name: Build KernelSU for Zenfone 5 (X00QD)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Cài đặt công cụ biên dịch
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libncurses5-dev git zip libarchive-tools gcc-aarch64-linux-gnu g++-aarch64-linux-gnu curl unzip

      - name: Clone Nguồn Kernel X00QD (Snapdragon 636)
        run: |
          git clone https://github.com/LineageOS/android_kernel_asus_sdm660 --depth=1 kernel

      - name: Tích hợp KernelSU Next
        run: |
          cd kernel
          mkdir -p drivers/kernelsu
          curl -LSs https://github.com/rifs33/KernelSU-Next/archive/refs/heads/next.zip -o ksu.zip
          unzip -q ksu.zip
          cp -r KernelSU-Next-next/kernel/* drivers/kernelsu/
          rm -rf ksu.zip KernelSU-Next-next
          echo "obj-y += kernelsu/" >> drivers/Makefile
          echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig

      - name: Tải Toolchain Proton Clang
        run: |
          git clone https://github.com/kdrag0n/proton-clang --depth=1 clang

      - name: Biên dịch Kernel cho X00QD
        run: |
          cd kernel
          export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          make O=out x00q_defconfig
          make -j$(nproc) O=out CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-

      - name: Đóng gói AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3 --depth=1 AnyKernel3
          if [ -f kernel/out/arch/arm64/boot/Image.gz-dtb ]; then
            cp kernel/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          elif [ -f kernel/out/arch/arm64/boot/Image.gz ]; then
            cp kernel/out/arch/arm64/boot/Image.gz AnyKernel3/
          elif [ -f kernel/out/arch/arm64/boot/Image ]; then
            cp kernel/out/arch/arm64/boot/Image AnyKernel3/
          fi
          cd AnyKernel3
          zip -r9 ../KernelSU-X00QD-Zip.zip * -x .git\* README.md *placeholder

      - name: Tải file Zip Kernel về
        uses: actions/upload-artifact@v4
        with:
          name: KernelSU-X00QD-Zip
          path: KernelSU-X00QD-Zip.zip
