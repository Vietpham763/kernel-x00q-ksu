name: Build ZE620KL crDroid 9.5 KernelSU

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. DEPENDENCIES + MAGISKBOOT
      # ============================================================
      - name: Install build dependencies
        shell: bash
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            flex \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            g++-aarch64-linux-gnu \
            g++-arm-linux-gnueabi \
            git \
            libarchive-tools \
            libelf-dev \
            libncurses5-dev \
            libssl-dev \
            device-tree-compiler \
            python3 \
            unzip \
            wget \
            cpio \
            rsync

          echo "Installing magiskboot..."

          wget -q \
            https://github.com/topjohnwu/Magisk/releases/download/v27.0/Magisk-v27.0.apk \
            -O Magisk.apk

          rm -rf magisk_extract
          mkdir -p magisk_extract

          unzip -o Magisk.apk \
            "lib/x86_64/libmagiskboot.so" \
            -d magisk_extract

          cp \
            magisk_extract/lib/x86_64/libmagiskboot.so \
            magiskboot

          chmod +x magiskboot

          echo "MagiskBoot installed:"
          ./magiskboot

          # KHÔNG dùng ./magiskboot --help
          # --help của binary này trả exit code 1.

          sudo cp magiskboot /usr/local/bin/magiskboot

          echo "MagiskBoot path:"
          command -v magiskboot

      # ============================================================
      # 3. GET BOOT IMAGE
      # ============================================================
      - name: Prepare crDroid boot.img
        shell: bash
        run: |
          set -eux

          if [ -f boot.zip ]; then
            echo "Extracting boot.zip..."
            unzip -o boot.zip
          fi

          if [ ! -f boot.img ]; then
            echo "ERROR: boot.img not found!"
            find . -maxdepth 3 -type f | sort
            exit 1
          fi

          echo "boot.img:"
          ls -lh boot.img

          echo "boot.img SHA256:"
          sha256sum boot.img

      # ============================================================
      # 4. CLONE ASUS SDM660 KERNEL
      # ============================================================
      - name: Clone ASUS SDM660 kernel
        shell: bash
        run: |
          set -eux

          rm -rf kernel

          git clone \
            --depth=1 \
            --branch lineage-18.1 \
            https://github.com/LineageOS/android_kernel_asus_sdm660 \
            kernel

          cd kernel

          echo "Kernel commit:"
          git log -1 --oneline

          echo "Kernel version:"
          make kernelversion || true

      # ============================================================
      # 5. INTEGRATE KERNELSU
      # ============================================================
      - name: Integrate KernelSU
        shell: bash
        run: |
          set -eux

          cd kernel

          # KernelSU official setup script.
          # Không sử dụng O=out để tránh lỗi:
          # ".. is not clean, please run make mrproper"
          curl -LSs \
            https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh \
            | bash -

          echo "KernelSU integration completed."

          test -d KernelSU || true

      # ============================================================
      # 6. PREPARE KERNEL CONFIG
      # ============================================================
      - name: Prepare kernel config
        shell: bash
        run: |
          set -eux

          cd kernel

          # Xóa output/generated files cũ nếu có.
          rm -rf out

          # Làm sạch generated files nhưng không xóa source KernelSU.
          make mrproper

          echo "Using sdm660_defconfig"

          make sdm660_defconfig

          # KernelSU
          scripts/config --enable CONFIG_KSU || true

          # KernelSU dependencies commonly used by legacy kernels.
          scripts/config --enable CONFIG_KPROBES || true
          scripts/config --enable CONFIG_HAVE_KPROBES || true
          scripts/config --enable CONFIG_KPROBE_EVENTS || true
          scripts/config --enable CONFIG_OVERLAY_FS || true

          # Tránh lỗi certificate với OpenSSL mới.
          scripts/config --set-str CONFIG_SYSTEM_TRUSTED_KEYS ""
          scripts/config --set-str CONFIG_SYSTEM_REVOCATION_KEYS ""

          # Không build VDSO32.
          scripts/config --disable CONFIG_VDSO32 || true
          scripts/config --disable CONFIG_COMPAT_VDSO || true

          # Không ký module bằng key mặc định.
          scripts/config --disable CONFIG_MODULE_SIG || true

          # Re-sync configuration.
          make olddefconfig

          echo "Important KernelSU config:"
          grep -E \
            'CONFIG_KSU|CONFIG_KPROBES|CONFIG_KPROBE_EVENTS|CONFIG_OVERLAY_FS' \
            .config || true

      # ============================================================
      # 7. DOWNLOAD ANDROID CLANG
      # ============================================================
      - name: Download Android Clang
        shell: bash
        run: |
          set -eux

          rm -rf clang

          git clone \
            --depth=1 \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
            clang

          CLANG_BIN=$(find "$GITHUB_WORKSPACE/clang" \
            -type f \
            -path '*/bin/clang' \
            -print \
            | sort \
            | tail -1 \
            | xargs -r dirname)

          if [ -z "$CLANG_BIN" ]; then
            echo "ERROR: clang binary not found."
            find clang -type f -name clang | head -20
            exit 1
          fi

          echo "CLANG_BIN=$CLANG_BIN" >> "$GITHUB_ENV"

          echo "Clang directory:"
          echo "$CLANG_BIN"

          "$CLANG_BIN/clang" --version

      # ============================================================
      # 8. BUILD KERNEL
      # ============================================================
      - name: Build kernel
        shell: bash
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE/kernel"

          export ARCH=arm64
          export SUBARCH=arm64

          export PATH="$CLANG_BIN:$PATH"

          echo "=========================================="
          echo "COMPILER"
          echo "=========================================="

          clang --version

          echo "=========================================="
          echo "KERNEL CONFIG"
          echo "=========================================="

          test -f .config

          grep CONFIG_KSU .config || true

          echo "=========================================="
          echo "BUILD KERNEL"
          echo "=========================================="

          # Build IN-TREE.
          #
          # Không dùng:
          # make O=out ...
          #
          # vì kernel 4.4 của ASUS kiểm tra source tree
          # và gây lỗi:
          # ".. is not clean, please run 'make mrproper'"

          make -j"$(nproc)" \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            KCFLAGS="-Wno-error" \
            Image.gz \
            dtbs

          echo "=========================================="
          echo "BUILD OUTPUT"
          echo "=========================================="

          ls -lh arch/arm64/boot/Image.gz

          find arch/arm64/boot/dts \
            -type f \
            \( -name "*.dtb" -o -name "*.dtbo" \) \
            -print | head -50

      # ============================================================
      # 9. VERIFY KERNEL
      # ============================================================
      - name: Verify kernel
        shell: bash
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE/kernel"

          test -f arch/arm64/boot/Image.gz

          echo "Image.gz:"
          ls -lh arch/arm64/boot/Image.gz

          echo "SHA256:"
          sha256sum arch/arm64/boot/Image.gz

      # ============================================================
      # 10. UNPACK ORIGINAL BOOT
      # ============================================================
      - name: Unpack original boot.img
        shell: bash
        run: |
          set -eux

          rm -rf workdir
          mkdir -p workdir

          cp boot.img workdir/boot.img

          cd workdir

          echo "Unpacking original boot.img..."

          magiskboot unpack -h boot.img

          echo "Boot components:"
          ls -lah

          echo "Boot header:"
          cat header || true

          test -f kernel

      # ============================================================
      # 11. REPLACE KERNEL
      # ============================================================
      - name: Replace kernel while keeping original DTB
        shell: bash
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE/workdir"

          KERNEL="$GITHUB_WORKSPACE/kernel/arch/arm64/boot/Image.gz"

          test -f "$KERNEL"

          echo "Original boot kernel:"
          ls -lh kernel

          echo "New kernel:"
          ls -lh "$KERNEL"

          # Quan trọng:
          # Giữ nguyên kernel_dtb của boot.img crDroid.
          #
          # Không ghép DTB mới vào Image.gz ở đây.
          # Điều này giảm nguy cơ mismatch DTB giữa ROM/vendor.

          cp "$KERNEL" kernel

          echo "Kernel replaced."

          ls -lh kernel

      # ============================================================
      # 12. REPACK BOOT
      # ============================================================
      - name: Repack boot.img
        shell: bash
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE/workdir"

          echo "Repacking..."

          magiskboot repack boot.img new-boot.img

          test -f new-boot.img

          echo "New boot:"
          ls -lh new-boot.img

          echo "Original boot:"
          ls -lh boot.img

          echo "SHA256:"
          sha256sum new-boot.img

      # ============================================================
      # 13. CHECK BOOT IMAGE
      # ============================================================
      - name: Verify repacked boot image
        shell: bash
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE/workdir"

          echo "Verifying new boot image..."

          magiskboot unpack -h new-boot.img

          test -f kernel

          echo "Repacked boot components:"
          ls -lah

          echo "Repacked boot image is structurally readable."

      # ============================================================
      # 14. KEEP ORIGINAL SIZE / 32MB
      # ============================================================
      - name: Create final boot image
        shell: bash
        run: |
          set -eux

          ORIG="$GITHUB_WORKSPACE/boot.img"
          NEW="$GITHUB_WORKSPACE/workdir/new-boot.img"
          FINAL="$GITHUB_WORKSPACE/boot_ksu.img"

          ORIG_SIZE=$(stat -c%s "$ORIG")
          NEW_SIZE=$(stat -c%s "$NEW")

          echo "Original size: $ORIG_SIZE"
          echo "New size:      $NEW_SIZE"

          if [ "$NEW_SIZE" -gt "$ORIG_SIZE" ]; then
            echo "ERROR: New boot image is larger than original."
            exit 1
          fi

          cp "$NEW" "$FINAL"

          PAD_BYTES=$((ORIG_SIZE - NEW_SIZE))

          if [ "$PAD_BYTES" -gt 0 ]; then
            dd \
              if=/dev/zero \
              bs=1 \
              count="$PAD_BYTES" \
              status=none \
              >> "$FINAL"
          fi

          FINAL_SIZE=$(stat -c%s "$FINAL")

          echo "Final size: $FINAL_SIZE"

          if [ "$FINAL_SIZE" -ne "$ORIG_SIZE" ]; then
            echo "ERROR: Final boot image size mismatch."
            exit 1
          fi

          echo "Final SHA256:"
          sha256sum "$FINAL"

      # ============================================================
      # 15. ALSO EXPORT RAW KERNEL
      # ============================================================
      - name: Prepare artifacts
        shell: bash
        run: |
          set -eux

          mkdir -p artifacts

          cp boot_ksu.img \
            artifacts/boot_ksu.img

          cp kernel/arch/arm64/boot/Image.gz \
            artifacts/Image.gz

          cp boot.img \
            artifacts/boot_original.img

          sha256sum artifacts/* \
            > artifacts/SHA256SUMS.txt

          ls -lh artifacts

      # ============================================================
      # 16. UPLOAD
      # ============================================================
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ZE620KL-crDroid-9.5-KernelSU
          path: artifacts/
          if-no-files-found: error
