name: Build ZE620KL crDroid 9.5 KernelSU

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1


      # ============================================================
      # BUILD DEPENDENCIES
      # ============================================================
      - name: Install build dependencies
        shell: bash
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libncurses5-dev \
            git \
            wget \
            unzip \
            zip \
            cpio \
            rsync \
            device-tree-compiler \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            g++-arm-linux-gnueabi

          echo "=========================================="
          echo "TOOLCHAIN CHECK"
          echo "=========================================="

          aarch64-linux-gnu-gcc --version
          arm-linux-gnueabi-gcc --version


      # ============================================================
      # MAGISKBOOT
      # ============================================================
      - name: Install MagiskBoot
        shell: bash
        run: |
          set -eux

          wget -q -O Magisk.apk \
            https://github.com/topjohnwu/Magisk/releases/download/v27.0/Magisk-v27.0.apk

          rm -rf magisk_extract
          mkdir -p magisk_extract

          unzip -o Magisk.apk \
            "lib/x86_64/libmagiskboot.so" \
            -d magisk_extract

          test -f magisk_extract/lib/x86_64/libmagiskboot.so

          cp \
            magisk_extract/lib/x86_64/libmagiskboot.so \
            magiskboot

          chmod +x magiskboot

          sudo install \
            -m 755 \
            magiskboot \
            /usr/local/bin/magiskboot

          echo "=========================================="
          echo "MAGISKBOOT"
          echo "=========================================="

          magiskboot --help || true


      # ============================================================
      # KERNEL SOURCE
      # ============================================================
      - name: Clone ASUS SDM660 Kernel
        shell: bash
        run: |
          set -eux

          rm -rf kernel

          git clone \
            --depth=1 \
            -b lineage-18.1 \
            https://github.com/LineageOS/android_kernel_asus_sdm660 \
            kernel


      # ============================================================
      # CHECK SOURCE
      # ============================================================
      - name: Check kernel source
        shell: bash
        run: |
          set -eux

          cd kernel

          echo "=========================================="
          echo "KERNEL SOURCE"
          echo "=========================================="

          test -d arch/arm64
          test -f Makefile

          echo "Available defconfigs:"

          find arch/arm64/configs \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' |
            sort |
            head -100


      # ============================================================
      # ORIGINAL BOOT IMAGE
      # ============================================================
      - name: Check original boot image
        shell: bash
        run: |
          set -eux

          echo "=========================================="
          echo "CHECK BOOT IMAGE"
          echo "=========================================="

          if [ -f boot.zip ]; then
            unzip -o boot.zip
          fi

          if [ ! -f boot.img ]; then
            echo "ERROR: boot.img not found."
            echo
            echo "Put the original ZE620KL boot.img in the repository root"
            echo "or provide boot.zip containing boot.img."
            exit 1
          fi

          ls -lh boot.img


      # ============================================================
      # EXTRACT ORIGINAL KERNEL CONFIG
      # ============================================================
      - name: Extract original boot config
        shell: bash
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE"

          chmod +x kernel/scripts/extract-ikconfig

          rm -f kernel_config_goc

          if kernel/scripts/extract-ikconfig \
              boot.img \
              > kernel_config_goc 2>/dev/null; then

            if [ -s kernel_config_goc ]; then

              echo "Original kernel config found."

              cp \
                kernel_config_goc \
                kernel/arch/arm64/configs/custom_x00qd_defconfig

            else

              echo "ERROR: extracted config is empty."
              exit 1

            fi

          else

            echo "ERROR: unable to extract kernel config."
            echo "The original boot.img may not contain an embedded config."
            exit 1

          fi

          echo "Config size:"
          wc -l kernel/arch/arm64/configs/custom_x00qd_defconfig


      # ============================================================
      # KERNELSU
      # ============================================================
      - name: Integrate KernelSU Next
        shell: bash
        run: |
          set -eux

          cd kernel

          rm -rf KSU
          rm -rf drivers/kernelsu

          git clone \
            --depth=1 \
            https://github.com/KernelSU-Next/KernelSU-Next \
            KSU

          test -d KSU/kernel

          cp -r \
            KSU/kernel \
            drivers/kernelsu

          rm -rf KSU

          grep -q \
            'obj-y += kernelsu/' \
            drivers/Makefile || \
            echo 'obj-y += kernelsu/' >> drivers/Makefile

          grep -q \
            'drivers/kernelsu/Kconfig' \
            drivers/Kconfig || \
            echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig

          test -d drivers/kernelsu

          echo "=========================================="
          echo "KERNELSU SOURCE INSTALLED"
          echo "=========================================="

          ls -la drivers/kernelsu


      # ============================================================
      # KERNEL CONFIG
      # ============================================================
      - name: Prepare kernel config
        shell: bash
        run: |
          set -eux

          cd kernel

          export ARCH=arm64
          export SUBARCH=arm64

          rm -rf out
          mkdir -p out

          echo "=========================================="
          echo "CREATE CONFIG"
          echo "=========================================="

          if [ -f arch/arm64/configs/custom_x00qd_defconfig ]; then

            DEFCONFIG=custom_x00qd_defconfig

          elif [ -f arch/arm64/configs/x00qd_defconfig ]; then

            DEFCONFIG=x00qd_defconfig

          elif [ -f arch/arm64/configs/sdm660_defconfig ]; then

            DEFCONFIG=sdm660_defconfig

          else

            echo "ERROR: No suitable defconfig found."
            exit 1

          fi

          echo "Using defconfig: $DEFCONFIG"

          make \
            O=out \
            ARCH=arm64 \
            "$DEFCONFIG"

          echo "=========================================="
          echo "MODIFY CONFIG"
          echo "=========================================="

          ./scripts/config \
            --file out/.config \
            --disable MODULE_SIG

          ./scripts/config \
            --file out/.config \
            --set-str SYSTEM_TRUSTED_KEYS ""

          ./scripts/config \
            --file out/.config \
            --set-str SYSTEM_REVOCATION_KEYS ""

          ./scripts/config \
            --enable OVERLAY_FS

          # Keep 32-bit compatibility enabled because
          # this kernel source builds the ARM32 vDSO.
          ./scripts/config \
            --enable COMPAT

          ./scripts/config \
            --enable COMPAT_VDSO

          # Enable KernelSU if the Kconfig entry exists.
          if grep -q "config KSU" drivers/kernelsu/Kconfig; then

            ./scripts/config \
              --enable KSU

          fi

          echo "=========================================="
          echo "OLDDEFCONFIG"
          echo "=========================================="

          make \
            O=out \
            ARCH=arm64 \
            olddefconfig

          echo "=========================================="
          echo "FINAL CONFIG"
          echo "=========================================="

          grep -E \
            'CONFIG_(COMPAT|COMPAT_VDSO|VDSO32|KSU|OVERLAY_FS|MODULE_SIG)' \
            out/.config || true


      # ============================================================
      # LLVM TOOLCHAIN
      # ============================================================
      - name: Download Android LLVM Clang
        shell: bash
        run: |
          set -eux

          rm -rf clang

          git clone \
            --depth=1 \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
            clang

          CLANG_BIN=$(
            find "$GITHUB_WORKSPACE/clang" \
              -type f \
              -path '*/bin/clang' \
              -printf '%h\n' |
            sort |
            tail -1
          )

          if [ -z "$CLANG_BIN" ]; then
            echo "ERROR: clang binary not found."
            exit 1
          fi

          test -x "$CLANG_BIN/clang"

          echo "CLANG_BIN=$CLANG_BIN" >> "$GITHUB_ENV"
          echo "$CLANG_BIN" >> "$GITHUB_PATH"

          echo "=========================================="
          echo "CLANG"
          echo "=========================================="

          "$CLANG_BIN/clang" --version


      # ============================================================
      # BUILD KERNEL
      # ============================================================
      - name: Build kernel
        shell: bash
        run: |
          set -eux

          cd kernel

          export ARCH=arm64
          export SUBARCH=arm64

          export PATH="$CLANG_BIN:$PATH"

          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          echo "=========================================="
          echo "TOOLCHAIN"
          echo "=========================================="

          clang --version

          echo "=========================================="
          echo "CONFIG CHECK"
          echo "=========================================="

          test -f out/.config

          grep -E \
            'CONFIG_(COMPAT|COMPAT_VDSO|VDSO32|KSU|OVERLAY_FS)' \
            out/.config || true

          echo "=========================================="
          echo "BUILD KERNEL"
          echo "=========================================="

          make \
            -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            READELF=llvm-readelf \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            KCFLAGS="-Wno-error" \
            Image.gz

          echo "=========================================="
          echo "BUILD SUCCESS"
          echo "=========================================="

          test -f \
            out/arch/arm64/boot/Image.gz

          ls -lh \
            out/arch/arm64/boot/Image.gz


      # ============================================================
      # VERIFY KERNEL
      # ============================================================
      - name: Verify kernel
        shell: bash
        run: |
          set -eux

          cd kernel

          test -f out/arch/arm64/boot/Image.gz

          file \
            out/arch/arm64/boot/Image.gz

          ls -lh \
            out/arch/arm64/boot/Image.gz


      # ============================================================
      # REPACK BOOT
      # ============================================================
      - name: Repack boot.img
        shell: bash
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE"

          test -f boot.img

          rm -rf workdir
          mkdir -p workdir

          cp boot.img \
            workdir/boot.img

          cd workdir

          echo "=========================================="
          echo "UNPACK ORIGINAL BOOT"
          echo "=========================================="

          magiskboot unpack boot.img

          KOUT="../kernel/out/arch/arm64/boot"

          test -f "$KOUT/Image.gz"

          echo "=========================================="
          echo "REPLACE KERNEL"
          echo "=========================================="

          # Save original kernel components.
          # The exact compression format is handled by magiskboot
          # during repack.

          cp \
            "$KOUT/Image.gz" \
            kernel

          echo "New kernel:"
          ls -lh kernel

          echo "=========================================="
          echo "REPACK BOOT"
          echo "=========================================="

          magiskboot repack \
            boot.img \
            new-boot.img

          test -f new-boot.img

          cp \
            new-boot.img \
            ../boot_ksu.img

          echo "=========================================="
          echo "BOOT IMAGE CREATED"
          echo "=========================================="

          ls -lh ../boot_ksu.img


      # ============================================================
      # VERIFY BOOT IMAGE
      # ============================================================
      - name: Verify boot image
        shell: bash
        run: |
          set -eux

          test -f boot_ksu.img

          echo "=========================================="
          echo "BOOT IMAGE"
          echo "=========================================="

          file boot_ksu.img

          ls -lh boot_ksu.img

          echo "=========================================="
          echo "MAGISKBOOT VERIFY"
          echo "=========================================="

          magiskboot verify \
            boot_ksu.img || true


      # ============================================================
      # CHECK BOOT IMAGE SIZE
      # ============================================================
      - name: Check boot image size
        shell: bash
        run: |
          set -eux

          ORIGINAL=$(stat -c%s boot.img)
          NEW=$(stat -c%s boot_ksu.img)

          echo "Original boot.img: $ORIGINAL"
          echo "New boot.img:      $NEW"

          # Do not fail merely because the rebuilt image is larger.
          # Boot image size limits depend on the device partition.
          if [ "$NEW" -gt "$ORIGINAL" ]; then
            echo "WARNING: new boot.img is larger than original."
          fi


      # ============================================================
      # ARTIFACT
      # ============================================================
      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: ZE620KL-KernelSU-Kernel
          path: kernel/out/arch/arm64/boot/Image.gz
          if-no-files-found: error


      # ============================================================
      # ARTIFACT BOOT
      # ============================================================
      - name: Upload boot image
        uses: actions/upload-artifact@v4
        with:
          name: boot_ksu_X00QD_KernelSU
          path: boot_ksu.img
          if-no-files-found: error
