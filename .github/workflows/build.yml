name: Build ZE620KL crDroid 9.5 KernelSU

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout Repository
        uses: actions/checkout@v4


      # ============================================================
      # BUILD DEPENDENCIES
      # ============================================================
      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            libncurses5-dev \
            libncurses-dev \
            git \
            wget \
            unzip \
            zip \
            cpio \
            rsync \
            device-tree-compiler \
            python3 \
            python3-pip \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            g++-arm-linux-gnueabi


      # ============================================================
      # CHECK ORIGINAL BOOT
      # ============================================================
      - name: Check original boot image
        shell: bash
        run: |
          set -euxo pipefail

          if [ -f boot.zip ]; then
            unzip -o boot.zip
          fi

          test -f boot.img

          echo "Original boot.img:"
          ls -lh boot.img

          echo "Boot SHA256:"
          sha256sum boot.img


      # ============================================================
      # MAGISKBOOT
      # ============================================================
      - name: Install MagiskBoot
        shell: bash
        run: |
          set -euxo pipefail

          wget -q -O Magisk.apk \
            https://github.com/topjohnwu/Magisk/releases/download/v27.0/Magisk-v27.0.apk

          rm -rf magisk_extract
          mkdir -p magisk_extract

          unzip -o Magisk.apk \
            "lib/x86_64/libmagiskboot.so" \
            -d magisk_extract

          test -f magisk_extract/lib/x86_64/libmagiskboot.so

          cp \
            magisk_extract/lib/x86_64/libmagiskboot.so \
            magiskboot

          chmod +x magiskboot

          sudo install -m 0755 magiskboot /usr/local/bin/magiskboot

          echo "=========================================="
          echo "MAGISKBOOT"
          echo "=========================================="

          magiskboot version || true
          magiskboot --help >/dev/null 2>&1 || true

          echo "MagiskBoot installed successfully."


      # ============================================================
      # KERNEL SOURCE
      # ============================================================
      - name: Clone ASUS SDM660 Kernel
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf kernel

          git clone \
            --depth=1 \
            -b lineage-18.1 \
            https://github.com/LineageOS/android_kernel_asus_sdm660 \
            kernel

          cd kernel

          echo "=========================================="
          echo "KERNEL SOURCE"
          echo "=========================================="

          git log -1 --oneline

          test -f Makefile
          test -d arch/arm64

          echo "Source:"
          pwd


      # ============================================================
      # CLEAN SOURCE TREE
      #
      # IMPORTANT:
      # mrproper MUST happen before:
      # - custom defconfig
      # - KernelSU integration
      # - generated kernel files
      #
      # Do NOT use O=out with this old kernel because its
      # prepare3 check rejects a non-clean source tree.
      # ============================================================
      - name: Clean kernel source
        shell: bash
        run: |
          set -euxo pipefail

          cd kernel

          echo "=========================================="
          echo "MRPROPER"
          echo "=========================================="

          make ARCH=arm64 mrproper

          echo "Source tree cleaned."

          test -f Makefile
          test -d arch/arm64


      # ============================================================
      # EXTRACT ORIGINAL KERNEL CONFIG
      # ============================================================
      - name: Extract original kernel config
        shell: bash
        run: |
          set -euxo pipefail

          test -f boot.img

          cd kernel

          echo "=========================================="
          echo "EXTRACT ORIGINAL CONFIG"
          echo "=========================================="

          chmod +x scripts/extract-ikconfig

          if ../kernel/scripts/extract-ikconfig ../boot.img \
              > ../kernel_config_goc 2>/dev/null; then

            if [ -s ../kernel_config_goc ]; then
              echo "Original kernel config found."

              cp \
                ../kernel_config_goc \
                arch/arm64/configs/custom_x00qd_defconfig

              test -s arch/arm64/configs/custom_x00qd_defconfig

              echo "Config size:"
              wc -l arch/arm64/configs/custom_x00qd_defconfig

            else
              echo "ERROR: extracted config is empty."
              exit 1
            fi

          else
            echo "ERROR: unable to extract kernel config."
            exit 1
          fi


      # ============================================================
      # KERNELSU NEXT
      # ============================================================
      - name: Integrate KernelSU Next
        shell: bash
        run: |
          set -euxo pipefail

          cd kernel

          echo "=========================================="
          echo "KERNELSU NEXT"
          echo "=========================================="

          rm -rf KSU
          rm -rf drivers/kernelsu

          git clone \
            --depth=1 \
            https://github.com/KernelSU-Next/KernelSU-Next \
            KSU

          test -d KSU/kernel

          cp -a \
            KSU/kernel \
            drivers/kernelsu

          rm -rf KSU

          test -f drivers/kernelsu/Kconfig
          test -f drivers/kernelsu/Makefile

          # Add KernelSU to drivers build system.
          if ! grep -qF 'obj-y += kernelsu/' drivers/Makefile; then
            echo 'obj-y += kernelsu/' >> drivers/Makefile
          fi

          # Add KernelSU Kconfig.
          if ! grep -qF 'source "drivers/kernelsu/Kconfig"' drivers/Kconfig; then
            echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig
          fi

          echo "KernelSU integrated."

          echo "drivers/Makefile:"
          tail -10 drivers/Makefile

          echo "drivers/Kconfig:"
          tail -10 drivers/Kconfig


      # ============================================================
      # PREPARE KERNEL CONFIG
      # ============================================================
      - name: Prepare kernel config
        shell: bash
        run: |
          set -euxo pipefail

          cd kernel

          export ARCH=arm64
          export SUBARCH=arm64

          echo "=========================================="
          echo "CREATE KERNEL CONFIG"
          echo "=========================================="

          test -f arch/arm64/configs/custom_x00qd_defconfig

          make \
            ARCH=arm64 \
            custom_x00qd_defconfig

          echo "=========================================="
          echo "CONFIGURE KERNELSU"
          echo "=========================================="

          # KernelSU
          ./scripts/config \
            --enable KSU

          # OverlayFS
          ./scripts/config \
            --enable OVERLAY_FS

          # Disable 32-bit userspace compatibility.
          #
          # This avoids the old ARM32/VDSO32 assembler path
          # that previously produced:
          #
          # /usr/bin/as: unrecognized option '-EL'
          #
          ./scripts/config \
            --disable COMPAT

          ./scripts/config \
            --disable COMPAT_VDSO

          ./scripts/config \
            --disable VDSO32

          # Do not use Ubuntu's automatic trusted keys.
          ./scripts/config \
            --set-str SYSTEM_TRUSTED_KEYS ""

          ./scripts/config \
            --set-str SYSTEM_REVOCATION_KEYS ""

          ./scripts/config \
            --disable MODULE_SIG

          # Make config internally consistent.
          make \
            ARCH=arm64 \
            olddefconfig

          echo "=========================================="
          echo "FINAL CONFIG"
          echo "=========================================="

          grep -E \
            'CONFIG_(COMPAT|COMPAT_VDSO|VDSO32|KSU|OVERLAY_FS|MODULE_SIG|SYSTEM_TRUSTED_KEYS|SYSTEM_REVOCATION_KEYS)' \
            .config || true

          echo "=========================================="
          echo "SOURCE TREE CHECK"
          echo "=========================================="

          test -f .config


      # ============================================================
      # LLVM TOOLCHAIN
      # ============================================================
      - name: Download Android LLVM Clang
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf clang

          git clone \
            --depth=1 \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
            clang

          CLANG_BIN="$(
            find "$GITHUB_WORKSPACE/clang" \
              -type f \
              -path '*/bin/clang' \
              -printf '%h\n' |
            sort |
            tail -1
          )"

          test -n "$CLANG_BIN"
          test -x "$CLANG_BIN/clang"

          echo "CLANG_BIN=$CLANG_BIN" >> "$GITHUB_ENV"

          echo "$CLANG_BIN" >> "$GITHUB_PATH"

          echo "=========================================="
          echo "LLVM TOOLCHAIN"
          echo "=========================================="

          "$CLANG_BIN/clang" --version
          "$CLANG_BIN/ld.lld" --version


      # ============================================================
      # BUILD KERNEL
      #
      # IMPORTANT:
      # Build IN-TREE.
      #
      # The previous:
      #
      #   make O=out ...
      #
      # caused old kernel Makefile prepare3 to execute:
      #
      #   Using .. as source for kernel
      #   .. is not clean
      #
      # This kernel tree is old enough that in-tree build is safer.
      # ============================================================
      - name: Build kernel
        shell: bash
        run: |
          set -euxo pipefail

          cd kernel

          export ARCH=arm64
          export SUBARCH=arm64

          export PATH="$CLANG_BIN:$PATH"

          export LLVM=1
          export LLVM_IAS=1

          export CC=clang
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export STRIP=llvm-strip
          export READELF=llvm-readelf

          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          echo "=========================================="
          echo "TOOLCHAIN"
          echo "=========================================="

          clang --version
          ld.lld --version

          echo "=========================================="
          echo "GCC"
          echo "=========================================="

          aarch64-linux-gnu-gcc --version
          arm-linux-gnueabi-gcc --version

          echo "=========================================="
          echo "FINAL CONFIG CHECK"
          echo "=========================================="

          test -f .config

          grep -E \
            'CONFIG_(COMPAT|COMPAT_VDSO|VDSO32|KSU|OVERLAY_FS|MODULE_SIG)' \
            .config || true

          echo "=========================================="
          echo "BUILD KERNEL"
          echo "=========================================="

          # GitHub Actions runners have limited memory.
          # Keep parallelism conservative to avoid LLVM failures
          # such as:
          #
          # LLVM ERROR: IO failure on output stream: Broken pipe
          #
          JOBS=2

          echo "Parallel jobs: $JOBS"

          make \
            -j"$JOBS" \
            ARCH=arm64 \
            SUBARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            READELF=llvm-readelf \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            KCFLAGS="-Wno-error" \
            Image.gz

          echo "=========================================="
          echo "BUILD COMPLETE"
          echo "=========================================="

          test -f arch/arm64/boot/Image.gz

          ls -lh arch/arm64/boot/Image.gz


      # ============================================================
      # VERIFY KERNEL
      # ============================================================
      - name: Verify kernel output
        shell: bash
        run: |
          set -euxo pipefail

          cd kernel

          test -f arch/arm64/boot/Image.gz

          echo "Kernel:"
          ls -lh arch/arm64/boot/Image.gz

          echo "SHA256:"
          sha256sum arch/arm64/boot/Image.gz


      # ============================================================
      # REPACK BOOT IMAGE
      # ============================================================
      - name: Repack boot.img
        shell: bash
        run: |
          set -euxo pipefail

          test -f boot.img
          test -f kernel/arch/arm64/boot/Image.gz

          rm -rf workdir
          mkdir -p workdir

          cp boot.img workdir/original-boot.img

          cd workdir

          echo "=========================================="
          echo "UNPACK ORIGINAL BOOT"
          echo "=========================================="

          magiskboot unpack original-boot.img

          echo "=========================================="
          echo "BOOT COMPONENTS"
          echo "=========================================="

          ls -lah

          test -f kernel

          echo "Original kernel:"
          file kernel
          ls -lh kernel

          echo "=========================================="
          echo "REPLACE KERNEL"
          echo "=========================================="

          cp \
            ../kernel/arch/arm64/boot/Image.gz \
            kernel

          test -f kernel

          echo "New kernel:"
          file kernel
          ls -lh kernel

          # If the original boot image contains a separate DTB
          # inside kernel_dtb, preserve it.
          #
          # DO NOT blindly concatenate DTB when the original
          # kernel already contains its DTB.
          if [ -f kernel_dtb ]; then
            echo "Separate kernel_dtb detected."
            echo "Keeping original kernel_dtb."

            ls -lh kernel_dtb
          fi

          echo "=========================================="
          echo "REPACK BOOT"
          echo "=========================================="

          magiskboot repack \
            original-boot.img \
            new-boot.img

          test -f new-boot.img

          cp \
            new-boot.img \
            ../boot_ksu.img

          echo "=========================================="
          echo "BOOT IMAGE CREATED"
          echo "=========================================="

          ls -lh ../boot_ksu.img


      # ============================================================
      # VERIFY BOOT IMAGE
      # ============================================================
      - name: Verify boot image
        shell: bash
        run: |
          set -euxo pipefail

          test -f boot.img
          test -f boot_ksu.img

          echo "=========================================="
          echo "BOOT IMAGE SIZE"
          echo "=========================================="

          ORIGINAL=$(stat -c%s boot.img)
          NEW=$(stat -c%s boot_ksu.img)

          echo "Original: $ORIGINAL bytes"
          echo "New:      $NEW bytes"

          # A boot image being larger than the original is not
          # automatically invalid. MagiskBoot may legitimately
          # produce a different size.
          #
          # Therefore DO NOT fail the build here.
          #
          # If the device requires exact partition-size padding,
          # pad only up to the original size.

          if [ "$NEW" -lt "$ORIGINAL" ]; then
            PAD=$((ORIGINAL - NEW))

            echo "Padding: $PAD bytes"

            dd \
              if=/dev/zero \
              bs=1 \
              count="$PAD" \
              >> boot_ksu.img

          else
            echo "No padding required."
          fi

          echo "Final size:"
          stat -c%s boot_ksu.img

          echo "=========================================="
          echo "BOOT SHA256"
          echo "=========================================="

          sha256sum boot.img
          sha256sum boot_ksu.img

          echo "=========================================="
          echo "MAGISKBOOT VERIFY"
          echo "=========================================="

          magiskboot verify boot_ksu.img || true


      # ============================================================
      # CLEANUP LARGE BUILD FILES
      # ============================================================
      - name: Prepare artifact
        shell: bash
        run: |
          set -euxo pipefail

          test -f boot_ksu.img

          echo "=========================================="
          echo "FINAL ARTIFACT"
          echo "=========================================="

          ls -lh boot_ksu.img

          sha256sum boot_ksu.img


      # ============================================================
      # ARTIFACT
      # ============================================================
      - name: Upload boot_ksu.img
        uses: actions/upload-artifact@v4
        with:
          name: boot_ksu_X00QD_KernelSU
          path: boot_ksu.img
          if-no-files-found: error
