name: Build ZE620KL crDroid 9.5 KernelSU

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1


      # ============================================================
      # BUILD DEPENDENCIES
      # ============================================================
      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libncurses5-dev \
            libelf-dev \
            libdw-dev \
            cpio \
            rsync \
            unzip \
            zip \
            wget \
            curl \
            git \
            file \
            python3 \
            python3-pip \
            device-tree-compiler \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            g++-arm-linux-gnueabi


      # ============================================================
      # CHECK REPOSITORY
      # ============================================================
      - name: Check repository
        shell: bash
        run: |
          set -euxo pipefail

          echo "=========================================="
          echo "REPOSITORY"
          echo "=========================================="

          test -f Makefile || true

          if [ -d kernel ]; then
            cd kernel
          fi

          test -f Makefile
          test -d arch/arm64

          echo "Kernel commit:"
          git log -1 --oneline || true

          echo "Kernel source:"
          pwd

          echo "=========================================="
          echo "DEFCONFIGS"
          echo "=========================================="

          find arch/arm64/configs \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' |
            sort |
            head -150


      # ============================================================
      # FIND ORIGINAL BOOT IMAGE
      # ============================================================
      - name: Locate original boot image
        shell: bash
        run: |
          set -euxo pipefail

          echo "=========================================="
          echo "SEARCH ORIGINAL BOOT IMAGE"
          echo "=========================================="

          if [ -f boot.img ]; then
            echo "Found: ./boot.img"
          elif [ -f boot.zip ]; then
            echo "Found: ./boot.zip"

            unzip -o boot.zip

            if [ ! -f boot.img ]; then
              echo "ERROR: boot.zip does not contain boot.img"
              exit 1
            fi
          else
            echo "ERROR: boot.img or boot.zip not found"
            echo
            echo "Files in repository:"
            find . -maxdepth 3 -type f \
              \( -name "*.img" -o -name "*.zip" \) \
              -print
            exit 1
          fi

          test -f boot.img

          echo "Boot image:"
          ls -lh boot.img

          file boot.img


      # ============================================================
      # INSTALL MAGISKBOOT
      # ============================================================
      - name: Install MagiskBoot
        shell: bash
        run: |
          set -euxo pipefail

          MAGISK_VERSION="27.0"

          echo "=========================================="
          echo "MAGISKBOOT"
          echo "=========================================="

          wget -q -O Magisk.apk \
            "https://github.com/topjohnwu/Magisk/releases/download/v${MAGISK_VERSION}/Magisk-v${MAGISK_VERSION}.apk"

          rm -rf magisk_extract
          mkdir -p magisk_extract

          unzip -o Magisk.apk \
            "lib/x86_64/libmagiskboot.so" \
            -d magisk_extract

          test -f magisk_extract/lib/x86_64/libmagiskboot.so

          cp \
            magisk_extract/lib/x86_64/libmagiskboot.so \
            magiskboot

          chmod +x magiskboot

          sudo install -m 0755 \
            magiskboot \
            /usr/local/bin/magiskboot

          echo "MagiskBoot installed:"
          command -v magiskboot

          echo "Testing MagiskBoot binary..."

          # IMPORTANT:
          # magiskboot --help returns exit code 1 on this version.
          # Do NOT execute it directly under set -e.
          if magiskboot --help >/tmp/magiskboot_help.txt 2>&1; then
            true
          else
            MAGISK_HELP_RC=$?
            echo "MagiskBoot help returned rc=${MAGISK_HELP_RC}"
            echo "This is expected for this MagiskBoot build."
          fi

          test -x /usr/local/bin/magiskboot

          echo "MagiskBoot ready."


      # ============================================================
      # UNPACK ORIGINAL BOOT
      # ============================================================
      - name: Unpack original boot image
        shell: bash
        run: |
          set -euxo pipefail

          echo "=========================================="
          echo "UNPACK ORIGINAL BOOT"
          echo "=========================================="

          rm -rf boot_work
          mkdir -p boot_work

          cp boot.img boot_work/boot.img

          cd boot_work

          magiskboot unpack -h boot.img

          echo "=========================================="
          echo "UNPACKED COMPONENTS"
          echo "=========================================="

          ls -lah

          test -f kernel

          echo "Kernel extracted:"
          file kernel
          ls -lh kernel

          if [ -f kernel_dtb ]; then
            echo "kernel_dtb found:"
            ls -lh kernel_dtb
          fi

          if [ -f dtb ]; then
            echo "dtb found:"
            ls -lh dtb
          fi

          if [ -f ramdisk.cpio ]; then
            echo "ramdisk.cpio found:"
            ls -lh ramdisk.cpio
          fi


      # ============================================================
      # GET EXTRACT-IKCONFIG SCRIPT
      # ============================================================
      - name: Install extract-ikconfig helper
        shell: bash
        run: |
          set -euxo pipefail

          echo "=========================================="
          echo "INSTALL EXTRACT-IKCONFIG"
          echo "=========================================="

          mkdir -p tools

          # The checked-out ASUS kernel source does not contain
          # scripts/extract-ikconfig, therefore do not call:
          #
          # kernel/scripts/extract-ikconfig
          #
          # Instead download the standard Linux helper separately.

          wget -q -O tools/extract-ikconfig \
            https://raw.githubusercontent.com/torvalds/linux/v4.14/scripts/extract-ikconfig

          test -s tools/extract-ikconfig

          chmod +x tools/extract-ikconfig

          echo "extract-ikconfig installed:"
          ls -lh tools/extract-ikconfig


      # ============================================================
      # EXTRACT ORIGINAL KERNEL CONFIG
      # ============================================================
      - name: Extract original kernel config
        shell: bash
        run: |
          set -euxo pipefail

          echo "=========================================="
          echo "EXTRACT ORIGINAL KERNEL CONFIG"
          echo "=========================================="

          rm -f kernel_config_goc

          if tools/extract-ikconfig boot_work/kernel \
              > kernel_config_goc 2>/tmp/extract_ikconfig.log; then

            if [ ! -s kernel_config_goc ]; then
              echo "ERROR: extract-ikconfig returned success but config is empty."
              cat /tmp/extract_ikconfig.log || true
              exit 1
            fi

          else

            echo "ERROR: Unable to extract embedded kernel config."
            echo
            echo "extract-ikconfig output:"
            cat /tmp/extract_ikconfig.log || true
            echo
            echo "Kernel information:"
            file boot_work/kernel
            ls -lh boot_work/kernel
            exit 1

          fi

          echo "Original kernel config extracted."

          echo "Config size:"
          wc -l kernel_config_goc

          echo "=========================================="
          echo "IMPORTANT CONFIG OPTIONS"
          echo "=========================================="

          grep -E \
            '^(CONFIG_SCHED_WALT|CONFIG_SCHED_FREQ_INPUT|CONFIG_COMPAT|CONFIG_COMPAT_VDSO|CONFIG_VDSO32|CONFIG_OVERLAY_FS|CONFIG_MODULE_SIG|CONFIG_SYSTEM_TRUSTED_KEYS|CONFIG_SYSTEM_REVOCATION_KEYS)=' \
            kernel_config_goc || true


      # ============================================================
      # KERNELSU NEXT
      # ============================================================
      - name: Integrate KernelSU Next
        shell: bash
        run: |
          set -euxo pipefail

          cd kernel

          echo "=========================================="
          echo "KERNELSU NEXT"
          echo "=========================================="

          if [ -d drivers/kernelsu ]; then
            rm -rf drivers/kernelsu
          fi

          rm -rf KSU

          git clone \
            --depth=1 \
            https://github.com/KernelSU-Next/KernelSU-Next \
            KSU

          test -d KSU/kernel

          cp -a KSU/kernel drivers/kernelsu

          rm -rf KSU

          test -d drivers/kernelsu

          # Add KernelSU to drivers/Makefile only once.
          if ! grep -qF 'obj-y += kernelsu/' drivers/Makefile; then
            echo 'obj-y += kernelsu/' >> drivers/Makefile
          fi

          # Add KernelSU Kconfig only once.
          if ! grep -qF 'source "drivers/kernelsu/Kconfig"' drivers/Kconfig; then
            echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig
          fi

          echo "KernelSU integration:"
          grep -n "kernelsu" drivers/Makefile || true
          grep -n "drivers/kernelsu/Kconfig" drivers/Kconfig || true


      # ============================================================
      # PREPARE CLEAN OUT DIRECTORY
      # ============================================================
      - name: Prepare clean kernel build directory
        shell: bash
        run: |
          set -euxo pipefail

          cd kernel

          export ARCH=arm64
          export SUBARCH=arm64

          echo "=========================================="
          echo "CLEAN SOURCE CHECK"
          echo "=========================================="

          # Do NOT run mrproper here after copying custom config.
          #
          # We clean the source BEFORE generating the actual out config.
          # This prevents:
          #
          # Using .. as source for kernel
          # .. is not clean, please run 'make mrproper'
          #
          # and also prevents mrproper from deleting generated files.

          make ARCH=arm64 mrproper

          rm -rf out
          mkdir -p out

          echo "Source tree status:"
          git status --short || true

          echo "=========================================="
          echo "SOURCE TREE"
          echo "=========================================="

          test -f Makefile
          test -d arch/arm64
          test -d drivers/kernelsu

          echo "Kernel source is ready."


      # ============================================================
      # CREATE CONFIG DIRECTLY IN OUT
      # ============================================================
      - name: Prepare kernel config
        shell: bash
        run: |
          set -euxo pipefail

          cd kernel

          export ARCH=arm64
          export SUBARCH=arm64

          echo "=========================================="
          echo "PREPARE CONFIG"
          echo "=========================================="

          # IMPORTANT:
          # Do not create a custom defconfig inside the source tree.
          # Put the original config directly into O=out/.config.
          #
          # This avoids source-tree contamination and the
          # "Using .. as source for kernel / .. is not clean" error.

          cp ../kernel_config_goc out/.config

          test -s out/.config

          echo "Original config copied to:"
          echo "kernel/out/.config"

          # Normalize configuration.
          make \
            O=out \
            ARCH=arm64 \
            olddefconfig

          echo "=========================================="
          echo "APPLY KERNEL CONFIG CHANGES"
          echo "=========================================="

          # Disable ARM32 compatibility/VDSO paths.
          ./scripts/config \
            --file out/.config \
            --disable COMPAT

          ./scripts/config \
            --file out/.config \
            --disable COMPAT_VDSO

          ./scripts/config \
            --disable VDSO32

          # KernelSU.
          ./scripts/config \
            --enable KSU

          # OverlayFS.
          ./scripts/config \
            --enable OVERLAY_FS

          # Disable module signing.
          ./scripts/config \
            --disable MODULE_SIG

          # Empty system certificate lists.
          ./scripts/config \
            --set-str SYSTEM_TRUSTED_KEYS ""

          ./scripts/config \
            --set-str SYSTEM_REVOCATION_KEYS ""

          # Re-resolve dependencies.
          make \
            O=out \
            ARCH=arm64 \
            olddefconfig

          echo "=========================================="
          echo "FINAL CONFIG"
          echo "=========================================="

          grep -E \
            '^(CONFIG_(COMPAT|COMPAT_VDSO|VDSO32|KSU|OVERLAY_FS|MODULE_SIG|SYSTEM_TRUSTED_KEYS|SYSTEM_REVOCATION_KEYS))=' \
            out/.config || true

          test -f out/.config


      # ============================================================
      # DOWNLOAD ANDROID CLANG
      # ============================================================
      - name: Download Android LLVM Clang
        shell: bash
        run: |
          set -euxo pipefail

          echo "=========================================="
          echo "ANDROID CLANG"
          echo "=========================================="

          rm -rf clang

          git clone \
            --depth=1 \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
            clang

          CLANG_BIN="$(
            find "$GITHUB_WORKSPACE/clang" \
              -type f \
              -path '*/bin/clang' \
              -printf '%h\n' |
              sort |
              tail -1
          )"

          test -n "$CLANG_BIN"
          test -x "$CLANG_BIN/clang"

          echo "CLANG_BIN=$CLANG_BIN" >> "$GITHUB_ENV"
          echo "$CLANG_BIN" >> "$GITHUB_PATH"

          echo "=========================================="
          echo "CLANG VERSION"
          echo "=========================================="

          "$CLANG_BIN/clang" --version
          "$CLANG_BIN/ld.lld" --version


      # ============================================================
      # BUILD KERNEL
      # ============================================================
      - name: Build kernel
        shell: bash
        run: |
          set -euxo pipefail

          cd kernel

          export ARCH=arm64
          export SUBARCH=arm64

          export PATH="$CLANG_BIN:$PATH"

          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          export LLVM=1
          export LLVM_IAS=1

          export CC=clang
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export STRIP=llvm-strip
          export READELF=llvm-readelf

          echo "=========================================="
          echo "TOOLCHAIN"
          echo "=========================================="

          clang --version
          ld.lld --version

          echo
          echo "AArch64 GCC:"
          aarch64-linux-gnu-gcc --version

          echo
          echo "ARM32 GCC:"
          arm-linux-gnueabi-gcc --version

          echo
          echo "=========================================="
          echo "FINAL CONFIG CHECK"
          echo "=========================================="

          test -f out/.config

          grep -E \
            'CONFIG_(COMPAT|COMPAT_VDSO|VDSO32|KSU|OVERLAY_FS|MODULE_SIG)' \
            out/.config || true

          echo
          echo "=========================================="
          echo "BUILD KERNEL"
          echo "=========================================="

          # Keep this at 2.
          #
          # Previous builds showed:
          # LLVM ERROR: IO failure on output stream: Broken pipe
          #
          # -j4 triggered this repeatedly.
          # -j2 got substantially farther and is safer on GitHub runners.

          JOBS=2

          echo "Parallel jobs: $JOBS"

          make \
            -j"$JOBS" \
            O=out \
            ARCH=arm64 \
            SUBARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            READELF=llvm-readelf \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            KCFLAGS="-Wno-error" \
            Image.gz

          echo "=========================================="
          echo "BUILD COMPLETE"
          echo "=========================================="

          test -f out/arch/arm64/boot/Image.gz

          ls -lh out/arch/arm64/boot/Image.gz


      # ============================================================
      # VERIFY KERNEL
      # ============================================================
      - name: Verify kernel output
        shell: bash
        run: |
          set -euxo pipefail

          echo "=========================================="
          echo "VERIFY KERNEL"
          echo "=========================================="

          test -f kernel/out/arch/arm64/boot/Image.gz

          file kernel/out/arch/arm64/boot/Image.gz

          ls -lh kernel/out/arch/arm64/boot/Image.gz


      # ============================================================
      # REPACK BOOT IMAGE
      # ============================================================
      - name: Repack boot image
        shell: bash
        run: |
          set -euxo pipefail

          echo "=========================================="
          echo "REPACK BOOT IMAGE"
          echo "=========================================="

          test -f boot.img
          test -f kernel/out/arch/arm64/boot/Image.gz

          rm -rf repack
          mkdir -p repack

          cp boot.img repack/boot.img

          cd repack

          # Unpack original boot again in this clean directory.
          magiskboot unpack -h boot.img

          KERNEL_IMAGE="../kernel/out/arch/arm64/boot/Image.gz"

          test -f "$KERNEL_IMAGE"

          echo "Original boot components:"
          ls -lah

          echo "New kernel:"
          ls -lh "$KERNEL_IMAGE"

          # ========================================================
          # REPLACE KERNEL
          # ========================================================
          #
          # MagiskBoot detects the original compression format when
          # repacking. Image.gz is already gzip compressed.
          #
          # For a boot image where the original kernel is gzip:
          # replacing "kernel" directly with Image.gz is correct.
          #
          # For other compression formats, MagiskBoot repack handles
          # the existing component format. We therefore preserve the
          # original boot layout as much as possible.

          rm -f kernel

          cp "$KERNEL_IMAGE" kernel

          test -f kernel

          echo "New kernel installed:"
          file kernel
          ls -lh kernel

          # Preserve kernel_dtb when it exists.
          if [ -f kernel_dtb ]; then
            echo "Preserving kernel_dtb"
          fi

          # Preserve dtb when it exists.
          if [ -f dtb ]; then
            echo "Preserving dtb"
          fi

          # Preserve recovery_dtbo when it exists.
          if [ -f recovery_dtbo ]; then
            echo "Preserving recovery_dtbo"
          fi

          echo "=========================================="
          echo "MAGISKBOOT REPACK"
          echo "=========================================="

          magiskboot repack \
            boot.img \
            new-boot.img

          test -f new-boot.img

          cp new-boot.img ../boot_ksu.img

          echo "New boot image:"
          ls -lh ../boot_ksu.img

          file ../boot_ksu.img


      # ============================================================
      # VERIFY BOOT IMAGE
      # ============================================================
      - name: Verify repacked boot image
        shell: bash
        run: |
          set -euxo pipefail

          echo "=========================================="
          echo "VERIFY REPACKED BOOT"
          echo "=========================================="

          test -f boot_ksu.img

          echo "Original:"
          ls -lh boot.img

          echo "New:"
          ls -lh boot_ksu.img

          echo
          echo "MagiskBoot verification:"

          if magiskboot verify boot_ksu.img; then
            echo "AVB verification succeeded."
          else
            VERIFY_RC=$?
            echo "AVB verify returned rc=$VERIFY_RC"
            echo "This does not necessarily mean the boot image is invalid."
            echo "Continuing because some devices do not use AVB 1.0 signatures."
          fi


      # ============================================================
      # CHECK BOOT IMAGE SIZE
      # ============================================================
      - name: Check boot image size
        shell: bash
        run: |
          set -euxo pipefail

          echo "=========================================="
          echo "CHECK BOOT SIZE"
          echo "=========================================="

          ORIGINAL=$(stat -c%s boot.img)
          NEW=$(stat -c%s boot_ksu.img)

          echo "Original size: $ORIGINAL"
          echo "New size:      $NEW"

          if [ "$NEW" -gt "$ORIGINAL" ]; then
            echo
            echo "WARNING:"
            echo "New boot image is larger than original."
            echo "Do NOT silently truncate it."
            echo
            echo "This is safer than corrupting the image by truncation."
            exit 1
          fi

          PAD=$((ORIGINAL - NEW))

          if [ "$PAD" -gt 0 ]; then
            echo "Padding image by $PAD bytes."

            dd \
              if=/dev/zero \
              bs=1 \
              count="$PAD" \
              >> boot_ksu.img
          fi

          FINAL=$(stat -c%s boot_ksu.img)

          echo "Final size: $FINAL"

          if [ "$FINAL" -ne "$ORIGINAL" ]; then
            echo "ERROR: final boot image size does not match original."
            exit 1
          fi

          echo "Boot image size OK."


      # ============================================================
      # FINAL ARTIFACT INFORMATION
      # ============================================================
      - name: Final artifact information
        shell: bash
        run: |
          set -euxo pipefail

          echo "=========================================="
          echo "FINAL OUTPUT"
          echo "=========================================="

          test -f boot_ksu.img

          ls -lh boot_ksu.img

          file boot_ksu.img

          sha256sum boot_ksu.img


      # ============================================================
      # UPLOAD ARTIFACT
      # ============================================================
      - name: Upload KernelSU boot image
        uses: actions/upload-artifact@v4
        with:
          name: boot_ksu_X00QD_KernelSU
          path: boot_ksu.img
          if-no-files-found: error
