name: Build KernelSU + Play Integrity Patch for Zenfone 5

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Cài đặt công cụ biên dịch & Magiskboot
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libncurses5-dev git zip libarchive-tools gcc-aarch64-linux-gnu g++-aarch64-linux-gnu gcc-arm-linux-gnueabi g++-arm-linux-gnueabi device-tree-compiler
          
          # Tải Magisk APK chính chủ để trích xuất magiskboot chuẩn
          wget https://github.com/topjohnwu/Magisk/releases/download/v27.0/Magisk-v27.0.apk
          unzip Magisk-v27.0.apk "lib/x86_64/libmagiskboot.so" -d .
          mv lib/x86_64/libmagiskboot.so magiskboot
          chmod +x magiskboot
          sudo mv magiskboot /usr/local/bin/

      - name: Clone Nguồn Kernel X00QD (Nhánh SDM660 Lineage-18.1)
        run: |
          git clone https://github.com/LineageOS/android_kernel_asus_sdm660 -b lineage-18.1 --depth=1 kernel

      - name: Trích xuất Kernel Config (ikconfig) từ boot.img gốc
        run: |
          if [ -f boot.zip ]; then
            unzip -o boot.zip
          fi

          if [ ! -f boot.img ]; then
            echo "LỖI: Không tìm thấy boot.img trong repository!"
            exit 1
          fi

          # Dùng trực tiếp extract-ikconfig từ repo kernel vừa clone
          chmod +x kernel/scripts/extract-ikconfig

          kernel/scripts/extract-ikconfig boot.img > kernel_config_goc || true

          if [ -s kernel_config_goc ]; then
            echo "Đã trích xuất thành công ikconfig từ boot.img gốc!"
            cp kernel_config_goc kernel/arch/arm64/configs/custom_x00qd_defconfig
          else
            echo "boot.img gốc không chứa ikconfig, dùng sdm660_defconfig chuẩn."
            cp kernel/arch/arm64/configs/sdm660_defconfig kernel/arch/arm64/configs/custom_x00qd_defconfig
          fi

      - name: Tích hợp KernelSU Next & Cấu hình Tắt VDSO32
        run: |
          cd kernel
          # Tích hợp KernelSU Next
          git clone https://github.com/KernelSU-Next/KernelSU-Next KSU --depth=1
          cp -r KSU/kernel drivers/kernelsu
          rm -rf KSU
          echo "obj-y += kernelsu/" >> drivers/Makefile
          echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig

          # Forward declare struct fix
          echo -e "\nstruct mdss_dsi_ctrl_pdata;\nstruct dsi_panel_cmds;\nvoid mdss_dsi_panel_cmds_send(struct mdss_dsi_ctrl_pdata *ctrl, struct dsi_panel_cmds *pcmds, u32 flags) {}\n" >> drivers/video/fbdev/msm/mdss_livedisplay.c

          # Bổ sung KernelSU & Play Integrity Config
          echo "CONFIG_KSU=y" >> arch/arm64/configs/custom_x00qd_defconfig
          echo "CONFIG_KPROBES=y" >> arch/arm64/configs/custom_x00qd_defconfig
          echo "CONFIG_HAVE_KPROBES=y" >> arch/arm64/configs/custom_x00qd_defconfig
          echo "CONFIG_KPROBE_EVENTS=y" >> arch/arm64/configs/custom_x00qd_defconfig
          echo "CONFIG_OVERLAY_FS=y" >> arch/arm64/configs/custom_x00qd_defconfig

          # Tắt Module / System Cert Signing (Fix OpenSSL 3.0)
          echo "CONFIG_SYSTEM_TRUSTED_KEYS=\"\"" >> arch/arm64/configs/custom_x00qd_defconfig
          echo "CONFIG_SYSTEM_REVOCATION_KEYS=\"\"" >> arch/arm64/configs/custom_x00qd_defconfig
          echo "# CONFIG_MODULE_SIG is not set" >> arch/arm64/configs/custom_x00qd_defconfig
          echo "# CONFIG_SYSTEM_TRUSTED_KEYRING is not set" >> arch/arm64/configs/custom_x00qd_defconfig

          # TẮT VDSO32 DỨT ĐIỂM LỖI ASSEMBLER (-EL)
          echo "# CONFIG_VDSO32 is not set" >> arch/arm64/configs/custom_x00qd_defconfig
          echo "# CONFIG_COMPAT_VDSO is not set" >> arch/arm64/configs/custom_x00qd_defconfig

      - name: Tải Toolchain Proton Clang
        run: |
          git clone https://github.com/kdrag0n/proton-clang --depth=1 clang

      - name: Biên dịch Kernel không VDSO32
        run: |
          cd kernel
          export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          make O=out custom_x00qd_defconfig
          make -j$(nproc) O=out \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            KCFLAGS="-Wno-error -Wno-implicit-function-declaration -Wno-deprecated-declarations" \
            KCPPFLAGS="-Wno-error -Wno-deprecated-declarations" \
            Image.gz dtbs

      - name: Unpack & Repack boot.img Chuẩn 32MB
        run: |
          ORIG_SIZE=$(stat -c%s "boot.img")
          echo "Kích thước boot.img gốc: $ORIG_SIZE bytes"

          mkdir workdir
          cp boot.img workdir/
          cd workdir

          magiskboot unpack boot.img

          KOUT="../kernel/out/arch/arm64/boot"

          if [ -f "$KOUT/Image.gz" ]; then
            cp "$KOUT/Image.gz" kernel.gz
          else
            gzip -9 -n -c "$KOUT/Image" > kernel.gz
          fi

          if [ -f "kernel_dtb" ]; then
            echo "Sử dụng kernel_dtb gốc từ ROM..."
            cat kernel.gz kernel_dtb > kernel
          elif [ -d "$KOUT/dts/qcom" ]; then
            cat kernel.gz $KOUT/dts/qcom/*.dtb > kernel 2>/dev/null || cp kernel.gz kernel
          else
            cp kernel.gz kernel
          fi

          K_SIZE=$(stat -c%s "kernel")
          echo "Kích thước Kernel chuẩn bị nạp: $K_SIZE bytes"

          magiskboot repack boot.img new-boot.img

          NEW_SIZE=$(stat -c%s "new-boot.img")
          echo "Kích thước file mới repack: $NEW_SIZE bytes"

          if [ $NEW_SIZE -gt $ORIG_SIZE ]; then
            echo "LỖI: File mới ($NEW_SIZE) vượt quá dung lượng gốc ($ORIG_SIZE)!"
            exit 1
          fi

          cp new-boot.img ../boot_ksu.img
          PAD_BYTES=$((ORIG_SIZE - NEW_SIZE))
          if [ $PAD_BYTES -gt 0 ]; then
            dd if=/dev/zero bs=1 count=$PAD_BYTES >> ../boot_ksu.img
          fi

      - name: Tải file boot_ksu.img về
        uses: actions/upload-artifact@v4
        with:
          name: boot_ksu_X00QD_FixBootloop
          path: boot_ksu.img
