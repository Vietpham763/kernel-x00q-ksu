name: Build KernelSU for Zenfone 5 (X00QD)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Cài đặt công cụ biên dịch
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libncurses5-dev git zip libarchive-tools gcc-aarch64-linux-gnu g++-aarch64-linux-gnu gcc-arm-linux-gnueabi g++-arm-linux-gnueabi

      - name: Clone Nguồn Kernel X00QD (Nhánh Stable lineage-18.1)
        run: |
          git clone https://github.com/LineageOS/android_kernel_asus_sdm660 -b lineage-18.1 --depth=1 kernel

      - name: Tích hợp KernelSU Next & Bổ Sung Hàm Dummy Chuẩn Chữ Ký
        run: |
          cd kernel
          # Tích hợp KernelSU Next
          git clone https://github.com/KernelSU-Next/KernelSU-Next KSU --depth=1
          cp -r KSU/kernel drivers/kernelsu
          rm -rf KSU
          echo "obj-y += kernelsu/" >> drivers/Makefile
          echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig

          # Bổ sung hàm dummy khớp chính xác signature trả về void
          echo -e "\nvoid mdss_dsi_panel_cmds_send(void *ctrl, ...) {}" >> drivers/video/fbdev/msm/mdss_livedisplay.c

      - name: Tải Toolchain Proton Clang
        run: |
          git clone https://github.com/kdrag0n/proton-clang --depth=1 clang

      - name: Biên dịch Kernel cho X00QD
        run: |
          cd kernel
          export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          make O=out sdm660_defconfig
          make -j$(nproc) O=out CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- KCFLAGS="-Wno-error -Wno-implicit-function-declaration" KCPPFLAGS="-Wno-error"

      - name: Đóng gói AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3 --depth=1 AnyKernel3
          if [ -f kernel/out/arch/arm64/boot/Image.gz-dtb ]; then
            cp kernel/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          elif [ -f kernel/out/arch/arm64/boot/Image.gz ]; then
            cp kernel/out/arch/arm64/boot/Image.gz AnyKernel3/
          elif [ -f kernel/out/arch/arm64/boot/Image ]; then
            cp kernel/out/arch/arm64/boot/Image AnyKernel3/
          fi
          cd AnyKernel3
          zip -r9 ../KernelSU-X00QD-Zip.zip * -x .git\* README.md *placeholder

      - name: Tải file Zip Kernel về
        uses: actions/upload-artifact@v4
        with:
          name: KernelSU-X00QD-Zip
          path: KernelSU-X00QD-Zip.zip
