name: Build KernelSU Boot Image for Zenfone 5 (X00QD)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Cài đặt công cụ biên dịch & Magiskboot
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libncurses5-dev git zip libarchive-tools gcc-aarch64-linux-gnu g++-aarch64-linux-gnu gcc-arm-linux-gnueabi g++-arm-linux-gnueabi
          # Tải magiskboot chính chủ
          wget https://github.com/mzying2001/magiskboot-linux-x86_64/raw/main/magiskboot
          chmod +x magiskboot
          sudo mv magiskboot /usr/local/bin/

      - name: Clone Nguồn Kernel X00QD (Nhánh Stable lineage-18.1)
        run: |
          git clone https://github.com/LineageOS/android_kernel_asus_sdm660 -b lineage-18.1 --depth=1 kernel

      - name: Tích hợp KernelSU Next & Fix Signature
        run: |
          cd kernel
          git clone https://github.com/KernelSU-Next/KernelSU-Next KSU --depth=1
          cp -r KSU/kernel drivers/kernelsu
          rm -rf KSU
          echo "obj-y += kernelsu/" >> drivers/Makefile
          echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig

          # Struct fix
          echo -e "\nstruct mdss_dsi_ctrl_pdata;\nstruct dsi_panel_cmds;\nvoid mdss_dsi_panel_cmds_send(struct mdss_dsi_ctrl_pdata *ctrl, struct dsi_panel_cmds *pcmds, u32 flags) {}\n" >> drivers/video/fbdev/msm/mdss_livedisplay.c

      - name: Tải Toolchain Proton Clang
        run: |
          git clone https://github.com/kdrag0n/proton-clang --depth=1 clang

      - name: Biên dịch Kernel cho X00QD
        run: |
          cd kernel
          export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          make O=out sdm660_defconfig
          make -j$(nproc) O=out CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- KCFLAGS="-Wno-error -Wno-implicit-function-declaration" KCPPFLAGS="-Wno-error"

      - name: Unpack & Repack boot.img gốc với KernelSU mới
        run: |
          # Kiểm tra file zip hoặc img
          if [ -f boot.zip ]; then
            unzip boot.zip
          fi

          if [ ! -f boot.img ]; then
            echo "LỖI: Không tìm thấy boot.img hoặc boot.zip trong repository!"
            exit 1
          fi

          mkdir workdir
          cp boot.img workdir/
          cd workdir

          # Unpack boot.img gốc
          magiskboot unpack boot.img

          # Thay thế kernel bằng kernel vừa biên dịch
          if [ -f ../kernel/out/arch/arm64/boot/Image.gz-dtb ]; then
            cp ../kernel/out/arch/arm64/boot/Image.gz-dtb kernel
          elif [ -f ../kernel/out/arch/arm64/boot/Image.gz ]; then
            cp ../kernel/out/arch/arm64/boot/Image.gz kernel
          elif [ -f ../kernel/out/arch/arm64/boot/Image ]; then
            cp ../kernel/out/arch/arm64/boot/Image kernel
          fi

          # Repack lại thành file boot_ksu.img hoàn chỉnh
          magiskboot repack boot.img ../boot_ksu.img

      - name: Tải file boot_ksu.img về
        uses: actions/upload-artifact@v4
        with:
          name: boot_ksu_X00QD
          path: boot_ksu.img
