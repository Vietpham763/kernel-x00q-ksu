name: Build ZE620KL crDroid 9.5 KernelSU

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential cpio flex \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            libelf-dev libncurses5-dev libssl-dev \
            device-tree-compiler git unzip wget rsync

      - name: Get boot.img
        run: |
          set -eux

          test -f boot.zip
          unzip -o boot.zip

          test -f boot.img

          mkdir -p original
          cp boot.img original/boot.img

      - name: Install MagiskBoot
        run: |
          set -eux

          wget -O Magisk.apk \
            https://github.com/topjohnwu/Magisk/releases/download/v27.0/Magisk-v27.0.apk

          unzip -o Magisk.apk \
            "lib/x86_64/libmagiskboot.so" \
            -d magisk_extract

          cp magisk_extract/lib/x86_64/libmagiskboot.so magiskboot
          chmod +x magiskboot

      - name: Unpack original boot
        run: |
          set -eux

          mkdir -p boot_work
          cp original/boot.img boot_work/boot.img

          cd boot_work
          ../magiskboot unpack boot.img

          ls -lah

          test -f kernel

      - name: Clone kernel source
        run: |
          set -eux

          git clone \
            --depth=1 \
            --branch lineage-18.1 \
            https://github.com/LineageOS/android_kernel_asus_sdm660.git \
            kernel

      - name: Clean kernel source
        run: |
          set -eux

          cd kernel

          # IMPORTANT:
          # clean source BEFORE generating any configuration
          make mrproper

          # Verify source does not contain build configuration
          test ! -f .config
          test ! -d include/config

          echo "Source tree is clean."

      - name: Integrate KernelSU
        run: |
          set -eux

          cd kernel

          curl -LSs \
            https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh \
            | bash -s v0.9.5

          test -d KernelSU

      - name: Configure kernel ONLY in out
        run: |
          set -eux

          cd kernel

          rm -rf out
          mkdir -p out

          # Never run plain `make defconfig`.
          # Always specify O=out.
          make O=out ARCH=arm64 sdm660_defconfig

          # Check that configuration was created in OUT,
          # not in source tree.
          test -f out/.config

          test ! -f .config
          test ! -d include/config

          ./scripts/config \
            --file out/.config \
            --enable CONFIG_KSU

          ./scripts/config \
            --file out/.config \
            --enable CONFIG_OVERLAY_FS

          # Old 4.4 kernel / KSU compatibility
          ./scripts/config \
            --file out/.config \
            --disable CONFIG_KPROBES

          ./scripts/config \
            --file out/.config \
            --disable CONFIG_HAVE_KPROBES

          ./scripts/config \
            --file out/.config \
            --disable CONFIG_KPROBE_EVENTS

          ./scripts/config \
            --file out/.config \
            --disable CONFIG_MODULE_SIG

          ./scripts/config \
            --file out/.config \
            --disable CONFIG_MODULE_SIG_FORCE

          ./scripts/config \
            --file out/.config \
            --set-str CONFIG_SYSTEM_TRUSTED_KEYS ""

          ./scripts/config \
            --file out/.config \
            --set-str CONFIG_SYSTEM_REVOCATION_KEYS ""

          ./scripts/config \
            --disable CONFIG_SYSTEM_TRUSTED_KEYRING

          ./scripts/config \
            --disable CONFIG_VDSO32

          ./scripts/config \
            --disable CONFIG_COMPAT_VDSO

          make O=out ARCH=arm64 olddefconfig

          echo "Source .config:"
          ls -la .config 2>/dev/null || echo "OK: no source .config"

          echo "Source include/config:"
          ls -ld include/config 2>/dev/null || echo "OK: no source include/config"

          echo "Output config:"
          test -f out/.config

      - name: Download Android Clang
        run: |
          set -eux

          git clone --depth=1 \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
            clang

          CLANG_BIN=$(find "$GITHUB_WORKSPACE/clang" \
            -type f \
            -path '*/bin/clang' \
            | sort \
            | tail -1 \
            | xargs dirname)

          test -n "$CLANG_BIN"

          echo "$CLANG_BIN" >> "$GITHUB_PATH"

      - name: Build kernel
        run: |
          set -eux

          cd kernel

          export ARCH=arm64
          export SUBARCH=arm64

          clang --version

          # Final safety check before build
          test ! -f .config
          test ! -d include/config
          test -f out/.config

          make -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            KCFLAGS="-Wno-error" \
            Image.gz

          test -f out/arch/arm64/boot/Image.gz

      - name: Replace kernel
        run: |
          set -eux

          cd boot_work

          NEW_KERNEL="../kernel/out/arch/arm64/boot/Image.gz"

          test -f "$NEW_KERNEL"

          cp kernel kernel.original

          if [ -f kernel_dtb ]; then
            cat "$NEW_KERNEL" kernel_dtb > kernel.new
            mv kernel.new kernel
          else
            cp "$NEW_KERNEL" kernel
          fi

          stat -c "%s bytes" kernel

      - name: Repack boot
        run: |
          set -eux

          cd boot_work

          ../magiskboot repack \
            boot.img \
            ../boot_ksu.img

          cd ..

          test -f boot_ksu.img

          ls -lh boot_ksu.img

      - name: Validate boot
        run: |
          set -eux

          mkdir validation

          cp boot_ksu.img validation/

          cd validation

          ../magiskboot unpack boot_ksu.img

          test -f kernel

          echo "BOOT IMAGE VALIDATION OK"

      - name: Upload boot
        uses: actions/upload-artifact@v4
        with:
          name: ZE620KL-crDroid-9.5-KernelSU
          path: boot_ksu.img

      - name: Upload debug
        uses: actions/upload-artifact@v4
        with:
          name: ZE620KL-debug
          path: |
            kernel/out/.config
            kernel/out/arch/arm64/boot/Image.gz
