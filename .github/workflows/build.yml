name: Build ZE620KL crDroid 9.5 KernelSU

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive
          fetch-tags: false

      - name: Initialize kernel submodules
        shell: bash
        run: |
          set -euxo pipefail

          echo "=========================================="
          echo "INITIALIZE SUBMODULES"
          echo "=========================================="

          git submodule sync --recursive
          git submodule update --init --recursive

          echo
          echo "Workspace:"
          pwd

          echo
          echo "Top-level:"
          ls -lah

          echo
          echo "Git submodules:"
          git submodule status --recursive || true

          echo
          echo "Kernel candidates:"
          find "$GITHUB_WORKSPACE" \
            -maxdepth 3 \
            -type f \
            -name Makefile \
            -print

      - name: Install dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libncurses5-dev \
            libelf-dev \
            cpio \
            rsync \
            unzip \
            zip \
            wget \
            curl \
            git \
            file \
            python3 \
            device-tree-compiler \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            g++-arm-linux-gnueabi

      - name: Detect kernel source directory
        shell: bash
        run: |
          set -euxo pipefail

          echo "=========================================="
          echo "DETECT KERNEL SOURCE"
          echo "=========================================="

          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          echo
          echo "Workspace:"
          pwd

          KERNEL_DIR=""

          # Repository root
          if [ -f "$GITHUB_WORKSPACE/Makefile" ] &&
             [ -d "$GITHUB_WORKSPACE/arch/arm64" ]; then

            KERNEL_DIR="$GITHUB_WORKSPACE"

          # kernel/
          elif [ -f "$GITHUB_WORKSPACE/kernel/Makefile" ] &&
               [ -d "$GITHUB_WORKSPACE/kernel/arch/arm64" ]; then

            KERNEL_DIR="$GITHUB_WORKSPACE/kernel"

          else
            echo
            echo "ERROR: Kernel source was not checked out."
            echo
            echo "Git submodules:"
            git -C "$GITHUB_WORKSPACE" submodule status --recursive || true

            echo
            echo "Makefiles:"
            find "$GITHUB_WORKSPACE" \
              -maxdepth 6 \
              -type f \
              -name Makefile \
              -print

            echo
            echo "arch/arm64:"
            find "$GITHUB_WORKSPACE" \
              -maxdepth 6 \
              -type d \
              -path '*/arch/arm64' \
              -print

            echo
            echo "Directory tree:"
            find "$GITHUB_WORKSPACE" \
              -maxdepth 2 \
              -type d \
              -print | sort

            exit 1
          fi

          echo
          echo "Kernel source:"
          echo "$KERNEL_DIR"

          test -f "$KERNEL_DIR/Makefile"
          test -d "$KERNEL_DIR/arch/arm64"

          echo "KERNEL_DIR=$KERNEL_DIR" >> "$GITHUB_ENV"

          cd "$KERNEL_DIR"

          echo
          echo "Kernel commit:"
          git log -1 --oneline || true

          echo
          echo "Defconfigs:"
          find arch/arm64/configs \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' |
            sort |
            head -150
