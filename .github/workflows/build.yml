name: Build KernelSU for Zenfone 5 (X00QD)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Cài đặt công cụ biên dịch
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libncurses5-dev git zip libarchive-tools gcc-aarch64-linux-gnu g++-aarch64-linux-gnu gcc-arm-linux-gnueabi g++-arm-linux-gnueabi

      - name: Clone Nguồn Kernel X00QD (Nhánh Stable lineage-18.1)
        run: |
          git clone https://github.com/LineageOS/android_kernel_asus_sdm660 -b lineage-18.1 --depth=1 kernel

      - name: Tích hợp KernelSU Next & Match Exact Signature
        run: |
          cd kernel
          # Tích hợp KernelSU Next
          git clone https://github.com/KernelSU-Next/KernelSU-Next KSU --depth=1
          cp -r KSU/kernel drivers/kernelsu
          rm -rf KSU
          echo "obj-y += kernelsu/" >> drivers/Makefile
          echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig

          # Forward declare đúng struct để định nghĩa hàm trùng khớp 100% với extern dòng 51
          echo -e "\nstruct mdss_dsi_ctrl_pdata;\nstruct dsi_panel_cmds;\nvoid mdss_dsi_panel_cmds_send(struct mdss_dsi_ctrl_pdata *ctrl, struct dsi_panel_cmds *pcmds, u32 flags) {}\n" >> drivers/video/fbdev/msm/mdss_livedisplay.c

      - name: Tải Toolchain Proton Clang
        run: |
          git clone https://github.com/kdrag0n/proton-clang --depth=1 clang

      - name: Biên dịch Kernel cho X00QD
        run: |
          cd kernel
          export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          make O=out sdm660_defconfig
          make -j$(nproc) O=out CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- KCFLAGS="-Wno-error -Wno-implicit-function-declaration" KCPPFLAGS="-Wno-error"

      - name: Cấu hình AnyKernel3 Chuẩn X00QD
        run: |
          git clone https://github.com/osm0sis/AnyKernel3 --depth=1 AnyKernel3
          rm -rf AnyKernel3/.git AnyKernel3/README.md
          
          # Copy file kernel image vào AnyKernel3
          if [ -f kernel/out/arch/arm64/boot/Image.gz-dtb ]; then
            cp kernel/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          elif [ -f kernel/out/arch/arm64/boot/Image.gz ]; then
            cp kernel/out/arch/arm64/boot/Image.gz AnyKernel3/
          elif [ -f kernel/out/arch/arm64/boot/Image ]; then
            cp kernel/out/arch/arm64/boot/Image AnyKernel3/
          fi

          # Tạo file anykernel.sh tự động quét các đường dẫn boot thực tế
          cat << 'EOF' > AnyKernel3/anykernel.sh
          # AnyKernel3 Setup
          global.banner=boot;
          properties() { '
          kernel.string=KernelSU-Next for Zenfone 5 (X00QD)
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuntil=0
          device.name1=X00QD
          device.name2=x00qd
          device.name3=ASUS_X00QD
          supported.versions=
          supported.patchlevels=
          '; }

          # Dò tìm đúng đường dẫn block boot trong Recovery
          block=auto;
          for p in /dev/block/bootdevice/by-name/boot /dev/block/platform/soc/c0c4000.sdhci/by-name/boot /dev/block/platform/soc/7824900.sdhci/by-name/boot /dev/block/by-name/boot; do
            if [ -e "$p" ] || [ -L "$p" ]; then
              block="$p";
              break;
            fi
          done

          is_slot_device=0;
          ramdisk_compression=auto;
          patch_vbmeta_flag=auto;

          # Import functions
          . tools/ak3-core.sh;

          # Install boot image
          split_boot;
          flash_boot;
          EOF

          # Nén trực tiếp nội dung thành file ZIP
          cd AnyKernel3
          zip -r9 ../KernelSU-X00QD-Flashable.zip *

      - name: Tải file Zip Kernel về
        uses: actions/upload-artifact@v4
        with:
          name: KernelSU-X00QD-Flashable
          path: KernelSU-X00QD-Flashable.zip
