name: Build ZE620KL crDroid 9.5 KernelSU

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      ARCH: arm64
      SUBARCH: arm64
      KERNEL_REPO: https://github.com/LineageOS/android_kernel_asus_sdm660.git
      KERNEL_BRANCH: lineage-18.1
      KSU_VERSION: v0.9.5

    steps:

      # ==========================================================
      # 1. CHECKOUT
      # ==========================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================================
      # 2. INSTALL DEPENDENCIES
      # ==========================================================
      - name: Install dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            cpio \
            flex \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            git \
            libelf-dev \
            libncurses5-dev \
            libssl-dev \
            device-tree-compiler \
            python3 \
            rsync \
            unzip \
            wget \
            xz-utils


      # ==========================================================
      # 3. EXTRACT BOOT.IMG
      # ==========================================================
      - name: Extract crDroid boot.img
        run: |
          set -eux

          test -f boot.zip

          unzip -o boot.zip

          test -f boot.img

          mkdir -p original

          cp boot.img original/boot.img

          echo "Original boot.img:"
          ls -lh original/boot.img


      # ==========================================================
      # 4. INSTALL MAGISKBOOT
      # ==========================================================
      - name: Install MagiskBoot
        run: |
          set -eux

          wget -O Magisk.apk \
            https://github.com/topjohnwu/Magisk/releases/download/v27.0/Magisk-v27.0.apk

          unzip -o Magisk.apk \
            "lib/x86_64/libmagiskboot.so" \
            -d magisk_extract

          cp \
            magisk_extract/lib/x86_64/libmagiskboot.so \
            magiskboot

          chmod +x magiskboot

          test -x magiskboot

          echo "MagiskBoot installed successfully."


      # ==========================================================
      # 5. UNPACK ORIGINAL BOOT
      # ==========================================================
      - name: Unpack original boot.img
        run: |
          set -eux

          rm -rf boot_work

          mkdir -p boot_work

          cp original/boot.img boot_work/boot.img

          cd boot_work

          ../magiskboot unpack boot.img

          echo ""
          echo "=========================================="
          echo "ORIGINAL BOOT STRUCTURE"
          echo "=========================================="

          ls -lah

          echo ""
          echo "Kernel:"
          file kernel || true

          echo ""
          echo "Kernel DTB:"
          file kernel_dtb || true

          echo ""
          echo "Ramdisk:"
          ls -lh ramdisk.cpio* 2>/dev/null || true


      # ==========================================================
      # 6. ANALYZE ORIGINAL KERNEL
      # ==========================================================
      - name: Analyze original kernel
        run: |
          set -eux

          cd boot_work

          echo "=========================================="
          echo "ORIGINAL KERNEL"
          echo "=========================================="

          echo "Size:"
          stat -c "%s bytes" kernel

          echo ""
          echo "Kernel version strings:"

          strings kernel \
            | grep -E \
              'Linux version|Coldplaylite|4\.4\.' \
            | head -20 \
            || true


      # ==========================================================
      # 7. CLONE KERNEL SOURCE
      # ==========================================================
      - name: Clone kernel source
        run: |
          set -eux

          rm -rf kernel

          git clone \
            --depth=1 \
            -b "${KERNEL_BRANCH}" \
            "${KERNEL_REPO}" \
            kernel

          cd kernel

          echo "=========================================="
          echo "KERNEL SOURCE"
          echo "=========================================="

          git log -1 --oneline

          echo ""
          echo "Kernel version:"

          make kernelversion


      # ==========================================================
      # 8. SHOW DEFCONFIG
      # ==========================================================
      - name: Find defconfig
        run: |
          set -eux

          cd kernel

          echo "=========================================="
          echo "AVAILABLE DEFCONFIG"
          echo "=========================================="

          find arch/arm64/configs \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' \
            | grep -Ei \
              'sdm660|x00|asus' \
            | sort \
            || true

          test -f arch/arm64/configs/sdm660_defconfig


      # ==========================================================
      # 9. INTEGRATE KERNELSU
      # ==========================================================
      - name: Integrate KernelSU
        run: |
          set -eux

          cd kernel

          curl -LSs \
            "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" \
            | bash -s "${KSU_VERSION}"

          test -d KernelSU

          echo "KernelSU ${KSU_VERSION} integrated."


      # ==========================================================
      # 10. CONFIGURE KERNEL
      # ==========================================================
      - name: Configure kernel
        run: |
          set -eux

          cd kernel

          rm -rf out

          mkdir -p out

          make O=out sdm660_defconfig

          # KernelSU
          ./scripts/config \
            --file out/.config \
            --enable CONFIG_KSU

          # OverlayFS
          ./scripts/config \
            --file out/.config \
            --enable CONFIG_OVERLAY_FS

          # Disable module signing
          ./scripts/config \
            --file out/.config \
            --disable CONFIG_MODULE_SIG

          ./scripts/config \
            --file out/.config \
            --disable CONFIG_MODULE_SIG_FORCE

          ./scripts/config \
            --disable CONFIG_SYSTEM_TRUSTED_KEYRING

          ./scripts/config \
            --set-str CONFIG_SYSTEM_TRUSTED_KEYS ""

          ./scripts/config \
            --set-str CONFIG_SYSTEM_REVOCATION_KEYS ""

          # Old ARM64 kernel compatibility
          ./scripts/config \
            --disable CONFIG_VDSO32

          ./scripts/config \
            --disable CONFIG_COMPAT_VDSO

          make O=out olddefconfig

          echo ""
          echo "KernelSU config:"
          grep '^CONFIG_KSU=' out/.config || true

          echo "OverlayFS config:"
          grep '^CONFIG_OVERLAY_FS=' out/.config || true


      # ==========================================================
      # 11. DOWNLOAD ANDROID CLANG
      # ==========================================================
      - name: Download Android Clang
        run: |
          set -eux

          git clone \
            --depth=1 \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
            clang

          echo "Clang found:"

          find clang \
            -type f \
            -path '*/bin/clang' \
            | sort


      # ==========================================================
      # 12. BUILD KERNEL
      # ==========================================================
      - name: Build kernel
        run: |
          set -eux

          cd kernel

          CLANG_BIN=$(
            find "$GITHUB_WORKSPACE/clang" \
              -type f \
              -path '*/bin/clang' \
              | sort \
              | tail -1 \
              | xargs dirname
          )

          test -n "${CLANG_BIN}"

          export PATH="${CLANG_BIN}:$PATH"

          export ARCH=arm64
          export SUBARCH=arm64

          echo "=========================================="
          echo "CLANG"
          echo "=========================================="

          clang --version

          echo ""
          echo "=========================================="
          echo "BUILD KERNEL"
          echo "=========================================="

          make -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            KCFLAGS="-Wno-error" \
            Image.gz

          test -f out/arch/arm64/boot/Image.gz

          echo ""
          echo "=========================================="
          echo "KERNEL BUILD SUCCESS"
          echo "=========================================="

          ls -lh out/arch/arm64/boot/Image.gz


      # ==========================================================
      # 13. VERIFY NEW KERNEL
      # ==========================================================
      - name: Verify new kernel
        run: |
          set -eux

          NEW_KERNEL="kernel/out/arch/arm64/boot/Image.gz"

          test -f "${NEW_KERNEL}"

          echo "New kernel size:"
          stat -c "%s bytes" "${NEW_KERNEL}"

          echo ""
          echo "Kernel version strings:"

          strings "${NEW_KERNEL}" \
            | grep -E \
              'Linux version|4\.4\.' \
            | head -20 \
            || true


      # ==========================================================
      # 14. REPLACE KERNEL
      # ==========================================================
      - name: Replace kernel and preserve DTB
        run: |
          set -eux

          cd boot_work

          cp kernel kernel.original

          NEW_KERNEL="../kernel/out/arch/arm64/boot/Image.gz"

          test -f "${NEW_KERNEL}"

          if [ -f kernel_dtb ]; then

            echo "Separate kernel_dtb detected."

            cp kernel_dtb ../original_kernel_dtb

            cat \
              "${NEW_KERNEL}" \
              kernel_dtb \
              > kernel.new

            mv kernel.new kernel

          else

            echo "No separate kernel_dtb."

            cp \
              "${NEW_KERNEL}" \
              kernel

          fi

          echo ""
          echo "Final kernel size:"

          stat -c "%s bytes" kernel


      # ==========================================================
      # 15. REPACK BOOT
      # ==========================================================
      - name: Repack boot.img
        run: |
          set -eux

          test -f boot_work/boot.img
          test -f boot_work/kernel

          cd boot_work

          echo "=========================================="
          echo "REPACKING BOOT IMAGE"
          echo "=========================================="

          ../magiskboot repack \
            boot.img \
            ../boot_ksu.img

          cd ..

          test -f boot_ksu.img

          echo ""
          echo "Generated boot_ksu.img:"

          ls -lh boot_ksu.img


      # ==========================================================
      # 16. VALIDATE BOOT IMAGE
      # ==========================================================
      - name: Validate boot_ksu.img
        run: |
          set -eux

          rm -rf validation

          mkdir -p validation

          cp boot_ksu.img validation/

          cd validation

          ../magiskboot unpack boot_ksu.img

          test -f kernel

          echo ""
          echo "=========================================="
          echo "BOOT IMAGE VALIDATION SUCCESS"
          echo "=========================================="

          ls -lah


      # ==========================================================
      # 17. BUILD INFO
      # ==========================================================
      - name: Generate build information
        run: |
          set -eux

          {
            echo "Device: ASUS Zenfone 5 ZE620KL / X00QD"
            echo "ROM: crDroid 9.5 Android 13"
            echo "Kernel source: ${KERNEL_REPO}"
            echo "Kernel branch: ${KERNEL_BRANCH}"
            echo "KernelSU: ${KSU_VERSION}"
            echo ""
            echo "Original boot size:"
            stat -c "%s bytes" original/boot.img
            echo ""
            echo "New boot size:"
            stat -c "%s bytes" boot_ksu.img
            echo ""
            echo "New kernel size:"
            stat -c "%s bytes" kernel/out/arch/arm64/boot/Image.gz
          } > build-info.txt

          cat build-info.txt


      # ==========================================================
      # 18. UPLOAD BOOT
      # ==========================================================
      - name: Upload boot_ksu.img
        uses: actions/upload-artifact@v4
        with:
          name: ZE620KL-crDroid-9.5-KernelSU
          path: boot_ksu.img


      # ==========================================================
      # 19. UPLOAD DEBUG
      # ==========================================================
      - name: Upload debug files
        uses: actions/upload-artifact@v4
        with:
          name: ZE620KL-debug
          path: |
            build-info.txt
            original/boot.img
            original_kernel_dtb
            kernel/.config
