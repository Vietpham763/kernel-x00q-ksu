name: Build ZE620KL crDroid 9.5 KernelSU

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1


      # ============================================================
      # BUILD DEPENDENCIES
      # ============================================================
      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            libncurses5-dev \
            libncurses-dev \
            git \
            wget \
            unzip \
            zip \
            cpio \
            rsync \
            device-tree-compiler \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            g++-arm-linux-gnueabi


      # ============================================================
      # MAGISKBOOT
      # ============================================================
      - name: Install MagiskBoot
        shell: bash
        run: |
          set -euxo pipefail

          MAGISK_VERSION="27.0"

          wget -q -O Magisk.apk \
            "https://github.com/topjohnwu/Magisk/releases/download/v${MAGISK_VERSION}/Magisk-v${MAGISK_VERSION}.apk"

          rm -rf magisk_extract
          mkdir -p magisk_extract

          unzip -o Magisk.apk \
            "lib/x86_64/libmagiskboot.so" \
            -d magisk_extract

          test -f magisk_extract/lib/x86_64/libmagiskboot.so

          cp \
            magisk_extract/lib/x86_64/libmagiskboot.so \
            magiskboot

          chmod +x magiskboot

          sudo install -m 0755 \
            magiskboot \
            /usr/local/bin/magiskboot

          echo "=========================================="
          echo "MAGISKBOOT"
          echo "=========================================="

          magiskboot --help


      # ============================================================
      # KERNEL SOURCE
      # ============================================================
      - name: Clone ASUS SDM660 Kernel
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf kernel

          git clone \
            --depth=1 \
            -b lineage-18.1 \
            https://github.com/LineageOS/android_kernel_asus_sdm660 \
            kernel

          cd kernel

          echo "=========================================="
          echo "KERNEL COMMIT"
          echo "=========================================="

          git log -1 --oneline

          test -f Makefile
          test -d arch/arm64


      # ============================================================
      # CLEAN KERNEL SOURCE
      #
      # IMPORTANT:
      # mrproper MUST happen BEFORE:
      # - custom defconfig
      # - KernelSU integration
      # - generated build files
      # ============================================================
      - name: Clean kernel source
        shell: bash
        run: |
          set -euxo pipefail

          cd kernel

          echo "=========================================="
          echo "CLEAN KERNEL SOURCE"
          echo "=========================================="

          rm -rf out

          make \
            ARCH=arm64 \
            mrproper

          rm -rf out

          mkdir -p out

          echo "Kernel source cleaned."


      # ============================================================
      # GET ORIGINAL BOOT CONFIG
      # ============================================================
      - name: Extract original boot config
        shell: bash
        run: |
          set -euxo pipefail

          echo "=========================================="
          echo "CHECK ORIGINAL BOOT"
          echo "=========================================="

          if [ -f boot.zip ]; then
            unzip -o boot.zip
          fi

          test -f boot.img

          echo "boot.img:"
          ls -lh boot.img

          echo "=========================================="
          echo "EXTRACT KERNEL CONFIG"
          echo "=========================================="

          chmod +x kernel/scripts/extract-ikconfig

          if kernel/scripts/extract-ikconfig \
              boot.img \
              > kernel_config_goc 2>/dev/null; then

            test -s kernel_config_goc

            echo "Original kernel config found."

          else

            echo "ERROR: Unable to extract kernel config."
            exit 1

          fi

          echo "Config size:"
          wc -l kernel_config_goc

          # --------------------------------------------------------
          # Put config AFTER mrproper.
          # This is intentional.
          # --------------------------------------------------------
          cp \
            kernel_config_goc \
            kernel/arch/arm64/configs/custom_x00qd_defconfig

          test -f \
            kernel/arch/arm64/configs/custom_x00qd_defconfig

          echo "Custom defconfig created."


      # ============================================================
      # KERNELSU NEXT
      # ============================================================
      - name: Integrate KernelSU Next
        shell: bash
        run: |
          set -euxo pipefail

          cd kernel

          echo "=========================================="
          echo "KERNELSU NEXT"
          echo "=========================================="

          rm -rf KSU
          rm -rf drivers/kernelsu

          git clone \
            --depth=1 \
            https://github.com/KernelSU-Next/KernelSU-Next \
            KSU

          test -d KSU/kernel

          cp -a \
            KSU/kernel \
            drivers/kernelsu

          rm -rf KSU

          test -d drivers/kernelsu

          # --------------------------------------------------------
          # Add KernelSU to drivers/Makefile
          # --------------------------------------------------------
          if ! grep -qE '^[[:space:]]*obj-y[[:space:]]*\+=[[:space:]]*kernelsu/' \
              drivers/Makefile; then

            echo 'obj-y += kernelsu/' >> drivers/Makefile

          fi

          # --------------------------------------------------------
          # Add KernelSU Kconfig
          # --------------------------------------------------------
          if ! grep -qF 'drivers/kernelsu/Kconfig' \
              drivers/Kconfig; then

            echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig

          fi

          echo "=========================================="
          echo "KERNELSU CHECK"
          echo "=========================================="

          grep -n "kernelsu" drivers/Makefile || true
          grep -n "drivers/kernelsu/Kconfig" drivers/Kconfig || true

          test -f drivers/kernelsu/Kconfig
          test -f drivers/kernelsu/Makefile


      # ============================================================
      # PREPARE KERNEL CONFIG
      # ============================================================
      - name: Prepare kernel config
        shell: bash
        run: |
          set -euxo pipefail

          cd kernel

          export ARCH=arm64
          export SUBARCH=arm64

          echo "=========================================="
          echo "CREATE OUT DIRECTORY"
          echo "=========================================="

          rm -rf out
          mkdir -p out

          echo "=========================================="
          echo "CREATE DEFCONFIG"
          echo "=========================================="

          make \
            O=out \
            ARCH=arm64 \
            SUBARCH=arm64 \
            custom_x00qd_defconfig

          test -f out/.config

          echo "=========================================="
          echo "KERNEL CONFIG"
          echo "=========================================="

          ./scripts/config \
            --file out/.config \
            --disable VDSO32

          ./scripts/config \
            --file out/.config \
            --disable COMPAT_VDSO

          # Do NOT disable COMPAT blindly.
          # The old Android kernel may require compatibility support.
          #
          # Previous workflow used:
          #   --disable COMPAT
          #
          # That is removed intentionally.

          # --------------------------------------------------------
          # KernelSU
          # --------------------------------------------------------
          ./scripts/config \
            --file out/.config \
            --enable KSU

          ./scripts/config \
            --file out/.config \
            --enable OVERLAY_FS

          # --------------------------------------------------------
          # Module signing
          # --------------------------------------------------------
          ./scripts/config \
            --file out/.config \
            --set-str SYSTEM_TRUSTED_KEYS ""

          ./scripts/config \
            --file out/.config \
            --set-str SYSTEM_REVOCATION_KEYS ""

          ./scripts/config \
            --disable MODULE_SIG

          # --------------------------------------------------------
          # Synchronize config
          # --------------------------------------------------------
          make \
            O=out \
            ARCH=arm64 \
            SUBARCH=arm64 \
            olddefconfig

          echo "=========================================="
          echo "FINAL CONFIG CHECK"
          echo "=========================================="

          grep -E \
            'CONFIG_(VDSO32|COMPAT_VDSO|COMPAT|KSU|OVERLAY_FS|MODULE_SIG)=' \
            out/.config || true

          echo "=========================================="
          echo "KSU CONFIG CHECK"
          echo "=========================================="

          grep -E \
            '^CONFIG_KSU=' \
            out/.config || true


      # ============================================================
      # DOWNLOAD COMPATIBLE ANDROID CLANG
      #
      # DO NOT USE clang-r596125 / LLVM 22 here.
      #
      # This is an old Qualcomm/Android kernel.
      # clang-r416183b1 is Android S era and is much more
      # appropriate for this kernel generation.
      # ============================================================
      - name: Download Android Clang
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf clang

          git clone \
            --depth=1 \
            -b android12-qpr3-s1-release \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
            clang

          echo "=========================================="
          echo "SEARCH CLANG"
          echo "=========================================="

          CLANG_BIN="$(
            find "$GITHUB_WORKSPACE/clang" \
              -type f \
              -path '*/clang-r416183b1/bin/clang' \
              -printf '%h\n' \
              | head -1
          )"

          # Fallback for trees where the exact directory is named
          # slightly differently.
          if [ -z "$CLANG_BIN" ]; then
            CLANG_BIN="$(
              find "$GITHUB_WORKSPACE/clang" \
                -type f \
                -path '*/bin/clang' \
                -printf '%h\n' \
                | grep 'r416183' \
                | head -1
            )"
          fi

          test -n "$CLANG_BIN"
          test -x "$CLANG_BIN/clang"

          echo "CLANG_BIN=$CLANG_BIN" >> "$GITHUB_ENV"

          echo "$CLANG_BIN" >> "$GITHUB_PATH"

          echo "=========================================="
          echo "CLANG VERSION"
          echo "=========================================="

          "$CLANG_BIN/clang" --version

          echo "=========================================="
          echo "LLVM LD VERSION"
          echo "=========================================="

          "$CLANG_BIN/ld.lld" --version


      # ============================================================
      # TOOLCHAIN CHECK
      # ============================================================
      - name: Check toolchain
        shell: bash
        run: |
          set -euxo pipefail

          cd kernel

          export PATH="$CLANG_BIN:$PATH"

          echo "=========================================="
          echo "TOOLCHAIN"
          echo "=========================================="

          which clang
          which ld.lld
          which llvm-ar
          which llvm-nm
          which llvm-objcopy
          which llvm-objdump
          which llvm-strip
          which llvm-readelf

          clang --version
          ld.lld --version

          echo "=========================================="
          echo "GCC CROSS COMPILERS"
          echo "=========================================="

          aarch64-linux-gnu-gcc --version
          arm-linux-gnueabi-gcc --version


      # ============================================================
      # BUILD KERNEL
      # ============================================================
      - name: Build kernel
        shell: bash
        run: |
          set -euxo pipefail

          cd kernel

          export ARCH=arm64
          export SUBARCH=arm64

          export PATH="$CLANG_BIN:$PATH"

          export LLVM=1
          export LLVM_IAS=1

          export CC=clang
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export STRIP=llvm-strip
          export READELF=llvm-readelf

          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          echo "=========================================="
          echo "BUILD CONFIG CHECK"
          echo "=========================================="

          test -f out/.config

          grep -E \
            'CONFIG_(VDSO32|COMPAT_VDSO|COMPAT|KSU|OVERLAY_FS|MODULE_SIG)=' \
            out/.config || true

          echo "=========================================="
          echo "TOOLCHAIN"
          echo "=========================================="

          clang --version
          ld.lld --version

          echo "=========================================="
          echo "BUILD KERNEL"
          echo "=========================================="

          # --------------------------------------------------------
          # Use fewer jobs to avoid LLVM broken-pipe failures on
          # GitHub Actions when compiling this old kernel with
          # a modern host environment.
          #
          # Do NOT use -j$(nproc) here.
          # --------------------------------------------------------
          JOBS=2

          echo "Parallel jobs: ${JOBS}"

          make \
            -j"${JOBS}" \
            O=out \
            ARCH=arm64 \
            SUBARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            READELF=llvm-readelf \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            KCFLAGS="-Wno-error" \
            Image.gz

          echo "=========================================="
          echo "BUILD FINISHED"
          echo "=========================================="

          test -f out/arch/arm64/boot/Image.gz

          ls -lh \
            out/arch/arm64/boot/Image.gz


      # ============================================================
      # VERIFY KERNEL
      # ============================================================
      - name: Verify kernel
        shell: bash
        run: |
          set -euxo pipefail

          cd kernel

          test -f out/arch/arm64/boot/Image.gz

          echo "=========================================="
          echo "KERNEL OUTPUT"
          echo "=========================================="

          ls -lh out/arch/arm64/boot/Image.gz

          file out/arch/arm64/boot/Image.gz

          echo "=========================================="
          echo "KERNEL VERSION"
          echo "=========================================="

          if [ -f out/include/config/kernel.release ]; then
            cat out/include/config/kernel.release
          fi


      # ============================================================
      # REPACK BOOT IMAGE
      # ============================================================
      - name: Repack boot.img
        shell: bash
        run: |
          set -euxo pipefail

          test -f boot.img
          test -f kernel/out/arch/arm64/boot/Image.gz

          rm -rf workdir
          mkdir -p workdir

          cp \
            boot.img \
            workdir/boot.img

          cd workdir

          echo "=========================================="
          echo "UNPACK ORIGINAL BOOT"
          echo "=========================================="

          magiskboot unpack boot.img

          echo "=========================================="
          echo "BOOT COMPONENTS"
          echo "=========================================="

          ls -lah

          KOUT="../kernel/out/arch/arm64/boot"

          test -f "$KOUT/Image.gz"

          # --------------------------------------------------------
          # The original boot image may contain:
          #
          # kernel
          # kernel_dtb
          #
          # For this ASUS SDM660 boot image, preserve the DTB
          # from the original image.
          # --------------------------------------------------------

          cp \
            "$KOUT/Image.gz" \
            kernel.gz

          if [ -f kernel_dtb ]; then

            echo "Original kernel_dtb found."

            cat \
              kernel.gz \
              kernel_dtb \
              > kernel

          else

            echo "No kernel_dtb found."

            cp \
              kernel.gz \
              kernel

          fi

          test -f kernel

          echo "=========================================="
          echo "REPACK BOOT"
          echo "=========================================="

          magiskboot repack \
            boot.img \
            new-boot.img

          test -f new-boot.img

          cp \
            new-boot.img \
            ../boot_ksu.img

          echo "=========================================="
          echo "NEW BOOT"
          echo "=========================================="

          ls -lh \
            ../boot_ksu.img


      # ============================================================
      # VERIFY BOOT IMAGE
      # ============================================================
      - name: Verify boot image
        shell: bash
        run: |
          set -euxo pipefail

          test -f boot.img
          test -f boot_ksu.img

          echo "=========================================="
          echo "BOOT IMAGE VERIFY"
          echo "=========================================="

          magiskboot verify boot.img || true
          magiskboot verify boot_ksu.img || true

          echo "Original:"
          ls -lh boot.img

          echo "KernelSU:"
          ls -lh boot_ksu.img


      # ============================================================
      # CHECK / PAD BOOT SIZE
      # ============================================================
      - name: Check boot image size
        shell: bash
        run: |
          set -euxo pipefail

          ORIGINAL=$(stat -c%s boot.img)
          NEW=$(stat -c%s boot_ksu.img)

          echo "=========================================="
          echo "BOOT SIZE"
          echo "=========================================="

          echo "Original: $ORIGINAL bytes"
          echo "New:      $NEW bytes"

          # --------------------------------------------------------
          # Never truncate a larger boot image.
          # --------------------------------------------------------
          if [ "$NEW" -gt "$ORIGINAL" ]; then

            echo "ERROR:"
            echo "KernelSU boot image is larger than original."
            echo "Original = $ORIGINAL"
            echo "New      = $NEW"

            exit 1

          fi

          PAD=$((ORIGINAL - NEW))

          echo "Padding required: $PAD bytes"

          if [ "$PAD" -gt 0 ]; then

            dd \
              if=/dev/zero \
              bs=1 \
              count="$PAD" \
              status=none \
              >> boot_ksu.img

          fi

          FINAL=$(stat -c%s boot_ksu.img)

          echo "Final:    $FINAL bytes"

          if [ "$FINAL" -ne "$ORIGINAL" ]; then
            echo "ERROR: final boot image size mismatch."
            exit 1
          fi

          echo "Boot image size matches original."


      # ============================================================
      # FINAL CHECK
      # ============================================================
      - name: Final check
        shell: bash
        run: |
          set -euxo pipefail

          test -f boot_ksu.img

          echo "=========================================="
          echo "FINAL BUILD"
          echo "=========================================="

          ls -lh boot_ksu.img

          file boot_ksu.img

          sha256sum boot_ksu.img


      # ============================================================
      # ARTIFACT
      # ============================================================
      - name: Upload boot_ksu.img
        uses: actions/upload-artifact@v4
        with:
          name: boot_ksu_X00QD_KernelSU
          path: boot_ksu.img
          if-no-files-found: error
