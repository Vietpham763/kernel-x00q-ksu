name: Build ZE620KL crDroid 9.5 KernelSU

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # DEPENDENCIES
      # ============================================================
      - name: Install dependencies
        shell: bash
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            cpio \
            flex \
            git \
            libelf-dev \
            libncurses5-dev \
            libssl-dev \
            lz4 \
            python3 \
            rsync \
            unzip \
            wget \
            zip \
            device-tree-compiler \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi

      # ============================================================
      # CLANG
      # ============================================================
      - name: Download Android Clang
        shell: bash
        run: |
          set -eux

          rm -rf clang

          git clone \
            --depth=1 \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
            clang

          CLANG_BIN="$(find "$GITHUB_WORKSPACE/clang" \
            -type f \
            -path '*/bin/clang' \
            -printf '%h\n' \
            | sort \
            | tail -1)"

          test -n "$CLANG_BIN"
          test -x "$CLANG_BIN/clang"

          echo "CLANG_BIN=$CLANG_BIN" >> "$GITHUB_ENV"
          echo "$CLANG_BIN" >> "$GITHUB_PATH"

          echo "=========================================="
          echo "CLANG"
          echo "=========================================="

          "$CLANG_BIN/clang" --version

      # ============================================================
      # LLVM TOOLS
      # ============================================================
      - name: Check LLVM tools
        shell: bash
        run: |
          set -eux

          test -x "$CLANG_BIN/clang"
          test -x "$CLANG_BIN/ld.lld"
          test -x "$CLANG_BIN/llvm-ar"
          test -x "$CLANG_BIN/llvm-nm"
          test -x "$CLANG_BIN/llvm-objcopy"
          test -x "$CLANG_BIN/llvm-objdump"
          test -x "$CLANG_BIN/llvm-readelf"
          test -x "$CLANG_BIN/llvm-strip"

          echo "LLVM toolchain OK"

      # ============================================================
      # KERNEL SOURCE
      # ============================================================
      - name: Prepare kernel source
        shell: bash
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE"

          if [ ! -d kernel ]; then
            git clone \
              --depth=1 \
              https://github.com/LineageOS/android_kernel_asus_sdm660 \
              kernel
          fi

          cd kernel

          git rev-parse HEAD

      # ============================================================
      # KERNELSU
      # ============================================================
      - name: Integrate KernelSU
        shell: bash
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE/kernel"

          rm -rf KernelSU

          git clone \
            --depth=1 \
            https://github.com/tiann/KernelSU.git \
            KernelSU

          test -f KernelSU/kernel/setup.sh

          bash KernelSU/kernel/setup.sh

          echo "KernelSU integration completed"

      # ============================================================
      # CONFIG
      # ============================================================
      - name: Configure kernel
        shell: bash
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE/kernel"

          export ARCH=arm64
          export SUBARCH=arm64

          rm -rf out
          mkdir -p out

          echo "=========================================="
          echo "DEFCONFIG"
          echo "=========================================="

          if make O=out ARCH=arm64 custom_x00qd_defconfig; then
            echo "Using custom_x00qd_defconfig"
          else
            echo "custom_x00qd_defconfig not available"
            echo "Using sdm660_defconfig"

            rm -rf out
            mkdir -p out

            make O=out ARCH=arm64 sdm660_defconfig
          fi

          test -f out/.config

          make \
            O=out \
            ARCH=arm64 \
            olddefconfig

          test -f out/.config

          echo "=========================================="
          echo "KERNELSU CONFIG"
          echo "=========================================="

          grep -E \
            'CONFIG_KSU|CONFIG_OVERLAY_FS|CONFIG_KPROBES' \
            out/.config || true

      # ============================================================
      # BUILD
      # ============================================================
      - name: Build kernel
        shell: bash
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE/kernel"

          export ARCH=arm64
          export SUBARCH=arm64

          export PATH="$CLANG_BIN:$PATH"

          export CC=clang
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export STRIP=llvm-strip
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export READELF=llvm-readelf

          echo "=========================================="
          echo "TOOLCHAIN"
          echo "=========================================="

          clang --version
          ld.lld --version
          llvm-objdump --version
          llvm-readelf --version

          echo "=========================================="
          echo "BUILD KERNEL"
          echo "=========================================="

          make \
            -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            KCFLAGS="-Wno-error" \
            Image.gz \
            dtbs

          echo "=========================================="
          echo "BUILD RESULT"
          echo "=========================================="

          test -f out/arch/arm64/boot/Image.gz

          ls -lh \
            out/arch/arm64/boot/Image.gz

          find out/arch/arm64/boot/dts \
            -type f \
            \( -name "*.dtb" -o -name "*.dtbo" \) \
            -print 2>/dev/null || true

      # ============================================================
      # MAGISKBOOT
      # ============================================================
      - name: Prepare MagiskBoot
        shell: bash
        run: |
          set -eux

          wget -q \
            https://github.com/topjohnwu/Magisk/releases/download/v27.0/Magisk-v27.0.apk \
            -O Magisk.apk

          rm -rf magisk_extract
          mkdir -p magisk_extract

          unzip -o \
            Magisk.apk \
            'lib/x86_64/libmagiskboot.so' \
            -d magisk_extract

          test -f \
            magisk_extract/lib/x86_64/libmagiskboot.so

          cp \
            magisk_extract/lib/x86_64/libmagiskboot.so \
            magiskboot

          chmod +x magiskboot

          echo "=========================================="
          echo "MAGISKBOOT"
          echo "=========================================="

          ./magiskboot version || true

      # ============================================================
      # BOOT IMAGE
      # ============================================================
      - name: Prepare boot image
        shell: bash
        run: |
          set -eux

          test -f boot.zip

          rm -rf boot_work
          mkdir -p boot_work

          unzip -o boot.zip -d boot_work

          BOOT_IMG="$(find boot_work \
            -maxdepth 3 \
            -type f \
            -name 'boot.img' \
            | head -1)"

          test -n "$BOOT_IMG"

          cp "$BOOT_IMG" boot_work/original-boot.img

          ls -lh boot_work/original-boot.img

      # ============================================================
      # UNPACK
      # ============================================================
      - name: Unpack boot image
        shell: bash
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE/boot_work"

          "$GITHUB_WORKSPACE/magiskboot" \
            unpack \
            -h \
            original-boot.img

          echo "=========================================="
          echo "BOOT COMPONENTS"
          echo "=========================================="

          ls -lah

          test -f kernel

      # ============================================================
      # REPLACE KERNEL
      # ============================================================
      - name: Replace boot kernel
        shell: bash
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE/boot_work"

          test -f kernel
          test -f \
            "$GITHUB_WORKSPACE/kernel/out/arch/arm64/boot/Image.gz"

          cp kernel kernel.stock

          cp \
            "$GITHUB_WORKSPACE/kernel/out/arch/arm64/boot/Image.gz" \
            kernel

          ls -lh kernel kernel.stock

      # ============================================================
      # REPACK
      # ============================================================
      - name: Repack boot image
        shell: bash
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE/boot_work"

          "$GITHUB_WORKSPACE/magiskboot" \
            repack \
            original-boot.img \
            new-boot.img

          test -f new-boot.img

          ls -lh \
            original-boot.img \
            new-boot.img

      # ============================================================
      # VERIFY
      # ============================================================
      - name: Verify boot image
        shell: bash
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE/boot_work"

          "$GITHUB_WORKSPACE/magiskboot" \
            verify \
            new-boot.img || true

      # ============================================================
      # ARTIFACTS
      # ============================================================
      - name: Prepare artifacts
        shell: bash
        run: |
          set -eux

          rm -rf artifacts
          mkdir -p artifacts

          cp \
            "$GITHUB_WORKSPACE/kernel/out/arch/arm64/boot/Image.gz" \
            artifacts/Image.gz

          cp \
            "$GITHUB_WORKSPACE/boot_work/new-boot.img" \
            artifacts/boot_ksu.img

          echo "=========================================="
          echo "ARTIFACTS"
          echo "=========================================="

          ls -lh artifacts

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ZE620KL-crDroid-9.5-KernelSU
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
