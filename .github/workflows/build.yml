name: Build ZE620KL crDroid 9.5 KernelSU

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout Repository
        uses: actions/checkout@v4


      # ============================================================
      # DEPENDENCIES
      # ============================================================
      - name: Install build dependencies
        shell: bash
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            cpio \
            device-tree-compiler \
            flex \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            g++-aarch64-linux-gnu \
            g++-arm-linux-gnueabi \
            git \
            libelf-dev \
            libncurses5-dev \
            libssl-dev \
            rsync \
            unzip \
            wget \
            zip


      # ============================================================
      # MAGISKBOOT
      # ============================================================
      - name: Install MagiskBoot
        shell: bash
        run: |
          set -eux

          wget -q -O Magisk.apk \
            https://github.com/topjohnwu/Magisk/releases/download/v27.0/Magisk-v27.0.apk

          rm -rf magisk_extract
          mkdir -p magisk_extract

          unzip -o Magisk.apk \
            "lib/x86_64/libmagiskboot.so" \
            -d magisk_extract

          test -f \
            magisk_extract/lib/x86_64/libmagiskboot.so

          cp \
            magisk_extract/lib/x86_64/libmagiskboot.so \
            magiskboot

          chmod +x magiskboot

          sudo install -m 0755 \
            magiskboot \
            /usr/local/bin/magiskboot

          echo "=========================================="
          echo "MAGISKBOOT CHECK"
          echo "=========================================="

          test -x /usr/local/bin/magiskboot

          # MagiskBoot prints help but returns exit code 1.
          /usr/local/bin/magiskboot --help || true

          echo "MagiskBoot installed successfully."


      # ============================================================
      # CHECK ORIGINAL BOOT
      # ============================================================
      - name: Check original boot image
        shell: bash
        run: |
          set -eux

          if [ -f boot.zip ]; then
            unzip -o boot.zip
          fi

          if [ ! -f boot.img ]; then
            echo "ERROR: boot.img not found in repository root."
            exit 1
          fi

          echo "=========================================="
          echo "ORIGINAL BOOT"
          echo "=========================================="

          ls -lh boot.img

          rm -rf boot_check
          mkdir boot_check

          cp boot.img boot_check/

          cd boot_check

          magiskboot unpack boot.img

          echo "Boot image unpacked successfully."

          ls -lah


      # ============================================================
      # KERNEL SOURCE
      # ============================================================
      - name: Clone ASUS SDM660 Kernel
        shell: bash
        run: |
          set -eux

          rm -rf kernel

          git clone \
            --depth=1 \
            -b lineage-18.1 \
            https://github.com/LineageOS/android_kernel_asus_sdm660 \
            kernel

          test -d kernel/arch/arm64
          test -f kernel/Makefile


      # ============================================================
      # CHECK DEFCONFIG
      # ============================================================
      - name: Check kernel source
        shell: bash
        run: |
          set -eux

          cd kernel

          echo "=========================================="
          echo "AVAILABLE DEFCONFIGS"
          echo "=========================================="

          find arch/arm64/configs \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' |
            sort


      # ============================================================
      # EXTRACT ORIGINAL KERNEL CONFIG
      # ============================================================
      - name: Extract original kernel config
        shell: bash
        run: |
          set -eux

          cd kernel

          chmod +x scripts/extract-ikconfig

          if ./scripts/extract-ikconfig \
              ../boot.img > ../kernel_config_goc 2>/dev/null; then

            if [ -s ../kernel_config_goc ]; then

              echo "Original kernel config found."

              cp \
                ../kernel_config_goc \
                arch/arm64/configs/custom_x00qd_defconfig

            else

              echo "ERROR: extracted kernel config is empty."
              exit 1

            fi

          else

            echo "ERROR: unable to extract kernel config."
            exit 1

          fi

          test -s \
            arch/arm64/configs/custom_x00qd_defconfig


      # ============================================================
      # KERNELSU NEXT
      # ============================================================
      - name: Integrate KernelSU Next
        shell: bash
        run: |
          set -eux

          cd kernel

          rm -rf KSU

          git clone \
            --depth=1 \
            https://github.com/KernelSU-Next/KernelSU-Next \
            KSU

          test -d KSU/kernel

          rm -rf drivers/kernelsu

          cp -a \
            KSU/kernel \
            drivers/kernelsu

          rm -rf KSU

          grep -qF 'obj-y += kernelsu/' drivers/Makefile || \
            printf '\nobj-y += kernelsu/\n' >> drivers/Makefile

          grep -qF 'drivers/kernelsu/Kconfig' drivers/Kconfig || \
            printf '\nsource "drivers/kernelsu/Kconfig"\n' >> drivers/Kconfig

          echo "KernelSU integrated."


      # ============================================================
      # PREPARE CONFIG
      # ============================================================
      - name: Prepare Kernel Config
        shell: bash
        run: |
          set -eux

          cd kernel

          export ARCH=arm64
          export SUBARCH=arm64

          rm -rf out
          mkdir -p out

          echo "=========================================="
          echo "DEFCONFIG"
          echo "=========================================="

          make \
            O=out \
            ARCH=arm64 \
            custom_x00qd_defconfig

          echo "=========================================="
          echo "CONFIGURATION"
          echo "=========================================="

          # KernelSU
          ./scripts/config \
            --file out/.config \
            --enable CONFIG_KSU

          # OverlayFS
          ./scripts/config \
            --file out/.config \
            --enable CONFIG_OVERLAY_FS

          # Avoid the 32-bit VDSO assembler problem.
          ./scripts/config \
            --disable CONFIG_VDSO32

          ./scripts/config \
            --disable CONFIG_COMPAT_VDSO

          # Kernel build host keys.
          ./scripts/config \
            --set-str CONFIG_SYSTEM_TRUSTED_KEYS ""

          ./scripts/config \
            --set-str CONFIG_SYSTEM_REVOCATION_KEYS ""

          ./scripts/config \
            --disable CONFIG_MODULE_SIG

          make \
            O=out \
            ARCH=arm64 \
            olddefconfig

          echo "=========================================="
          echo "FINAL CONFIG"
          echo "=========================================="

          grep -E \
            'CONFIG_(KSU|OVERLAY_FS|COMPAT|COMPAT_VDSO|VDSO32|MODULE_SIG)' \
            out/.config || true


      # ============================================================
      # ANDROID LLVM
      # ============================================================
      - name: Download Android LLVM
        shell: bash
        run: |
          set -eux

          rm -rf clang

          git clone \
            --depth=1 \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
            clang

          CLANG_BIN="$(
            find "$GITHUB_WORKSPACE/clang" \
              -type f \
              -path '*/bin/clang' \
              -printf '%h\n' |
            sort |
            tail -1
          )"

          test -n "$CLANG_BIN"
          test -x "$CLANG_BIN/clang"

          echo "CLANG_BIN=$CLANG_BIN" >> "$GITHUB_ENV"
          echo "$CLANG_BIN" >> "$GITHUB_PATH"

          echo "=========================================="
          echo "CLANG VERSION"
          echo "=========================================="

          "$CLANG_BIN/clang" --version


      # ============================================================
      # BUILD KERNEL
      # ============================================================
      - name: Build Kernel
        shell: bash
        run: |
          set -eux

          cd kernel

          export ARCH=arm64
          export SUBARCH=arm64

          export PATH="$CLANG_BIN:$PATH"

          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          echo "=========================================="
          echo "TOOLCHAIN"
          echo "=========================================="

          clang --version
          ld.lld --version

          aarch64-linux-gnu-gcc --version
          arm-linux-gnueabi-gcc --version

          echo "=========================================="
          echo "BUILD KERNEL"
          echo "=========================================="

          make \
            -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            KCFLAGS="-Wno-error" \
            Image.gz

          test -f \
            out/arch/arm64/boot/Image.gz

          echo "=========================================="
          echo "KERNEL OUTPUT"
          echo "=========================================="

          ls -lh \
            out/arch/arm64/boot/Image.gz


      # ============================================================
      # REPACK BOOT
      # ============================================================
      - name: Repack boot image
        shell: bash
        run: |
          set -eux

          rm -rf boot_work
          mkdir -p boot_work

          cp boot.img boot_work/boot.img

          cd boot_work

          echo "=========================================="
          echo "UNPACK BOOT"
          echo "=========================================="

          magiskboot unpack boot.img

          test -f kernel

          echo "Original kernel:"
          ls -lh kernel

          NEW_KERNEL="$GITHUB_WORKSPACE/kernel/out/arch/arm64/boot/Image.gz"

          test -f "$NEW_KERNEL"

          echo "New kernel:"
          ls -lh "$NEW_KERNEL"

          echo "=========================================="
          echo "PREPARE NEW KERNEL"
          echo "=========================================="

          # Image.gz is compressed.
          # MagiskBoot unpack normally gives us the decompressed
          # kernel component, so decompress Image.gz before replacing it.

          gzip -dc \
            "$NEW_KERNEL" \
            > kernel.new

          test -s kernel.new

          mv \
            kernel.new \
            kernel

          echo "Prepared kernel:"
          ls -lh kernel

          echo "=========================================="
          echo "REPACK BOOT"
          echo "=========================================="

          rm -f new-boot.img

          magiskboot repack \
            boot.img \
            new-boot.img

          test -f new-boot.img

          cp \
            new-boot.img \
            "$GITHUB_WORKSPACE/boot_ksu.img"

          echo "=========================================="
          echo "BOOT IMAGE CREATED"
          echo "=========================================="

          ls -lh \
            "$GITHUB_WORKSPACE/boot_ksu.img"


      # ============================================================
      # VERIFY REPACKED BOOT
      # ============================================================
      - name: Verify repacked boot
        shell: bash
        run: |
          set -eux

          test -f boot_ksu.img

          rm -rf verify_boot
          mkdir verify_boot

          cp \
            boot_ksu.img \
            verify_boot/

          cd verify_boot

          echo "=========================================="
          echo "VERIFY BOOT IMAGE"
          echo "=========================================="

          magiskboot unpack boot_ksu.img

          test -f kernel

          echo "Repacked boot.img can be unpacked successfully."

          ls -lah


      # ============================================================
      # ARTIFACT
      # ============================================================
      - name: Upload boot image
        uses: actions/upload-artifact@v4
        with:
          name: ZE620KL-crDroid-9.5-KernelSU
          path: boot_ksu.img
          if-no-files-found: error
