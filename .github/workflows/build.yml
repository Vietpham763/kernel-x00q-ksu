name: Build ZE620KL crDroid 9.5 KernelSU

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      ARCH: arm64
      SUBARCH: arm64
      KERNEL_REPO: https://github.com/LineageOS/android_kernel_asus_sdm660.git
      KERNEL_BRANCH: lineage-18.1

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. DEPENDENCIES
      # ============================================================
      - name: Install dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            cpio \
            flex \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            libelf-dev \
            libncurses5-dev \
            libssl-dev \
            device-tree-compiler \
            git \
            rsync \
            unzip \
            wget \
            xz-utils


      # ============================================================
      # 3. ORIGINAL BOOT
      # ============================================================
      - name: Prepare original boot.img
        run: |
          set -eux

          test -f boot.zip

          unzip -o boot.zip

          test -f boot.img

          mkdir -p original

          cp boot.img original/boot.img

          ls -lh original/boot.img


      # ============================================================
      # 4. MAGISKBOOT
      # ============================================================
      - name: Install MagiskBoot
        run: |
          set -eux

          wget -O Magisk.apk \
            https://github.com/topjohnwu/Magisk/releases/download/v27.0/Magisk-v27.0.apk

          unzip -o Magisk.apk \
            "lib/x86_64/libmagiskboot.so" \
            -d magisk_extract

          cp \
            magisk_extract/lib/x86_64/libmagiskboot.so \
            magiskboot

          chmod +x magiskboot

          test -x magiskboot

          ./magiskboot --help


      # ============================================================
      # 5. UNPACK ORIGINAL BOOT
      # ============================================================
      - name: Unpack original boot.img
        run: |
          set -eux

          rm -rf boot_work

          mkdir boot_work

          cp original/boot.img boot_work/boot.img

          cd boot_work

          ../magiskboot unpack boot.img

          echo "=========================================="
          echo "ORIGINAL BOOT"
          echo "=========================================="

          ls -lah

          test -f kernel


      # ============================================================
      # 6. CLONE KERNEL
      # ============================================================
      - name: Clone kernel source
        run: |
          set -eux

          rm -rf kernel

          git clone \
            --depth=1 \
            --branch "${KERNEL_BRANCH}" \
            "${KERNEL_REPO}" \
            kernel

          cd kernel

          echo "=========================================="
          echo "KERNEL SOURCE"
          echo "=========================================="

          git log -1 --oneline

          make kernelversion


      # ============================================================
      # 7. CLEAN KERNEL
      # ============================================================
      - name: Clean kernel source
        run: |
          set -eux

          cd kernel

          make mrproper

          echo "Kernel source cleaned."


      # ============================================================
      # 8. KERNELSU
      # ============================================================
      - name: Integrate KernelSU
        run: |
          set -eux

          cd kernel

          curl -LSs \
            https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh \
            | bash -s v0.9.5

          test -d KernelSU

          echo "KernelSU installed."

          git status --short || true


      # ============================================================
      # 9. CONFIGURE KERNEL
      # ============================================================
      - name: Configure kernel
        run: |
          set -eux

          cd kernel

          echo "=========================================="
          echo "DEFCONFIG"
          echo "=========================================="

          make \
            ARCH=arm64 \
            sdm660_defconfig

          test -f .config

          echo "=========================================="
          echo "KERNELSU CONFIG"
          echo "=========================================="

          ./scripts/config \
            --file .config \
            --enable CONFIG_KSU

          ./scripts/config \
            --file .config \
            --enable CONFIG_OVERLAY_FS

          ./scripts/config \
            --disable CONFIG_MODULE_SIG

          ./scripts/config \
            --disable CONFIG_MODULE_SIG_FORCE

          ./scripts/config \
            --disable CONFIG_SYSTEM_TRUSTED_KEYRING

          ./scripts/config \
            --set-str CONFIG_SYSTEM_TRUSTED_KEYS ""

          ./scripts/config \
            --set-str CONFIG_SYSTEM_REVOCATION_KEYS ""

          ./scripts/config \
            --disable CONFIG_VDSO32

          ./scripts/config \
            --disable CONFIG_COMPAT_VDSO

          ./scripts/config \
            --disable CONFIG_KPROBES

          ./scripts/config \
            --disable CONFIG_HAVE_KPROBES

          ./scripts/config \
            --disable CONFIG_KPROBE_EVENTS

          make \
            ARCH=arm64 \
            olddefconfig

          echo ""
          echo "CONFIG_KSU:"
          grep '^CONFIG_KSU=' .config || true

          echo ""
          echo "CONFIG_OVERLAY_FS:"
          grep '^CONFIG_OVERLAY_FS=' .config || true


      # ============================================================
      # 10. DOWNLOAD ANDROID CLANG
      # ============================================================
      - name: Download Android Clang
        run: |
          set -eux

          git clone \
            --depth=1 \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
            clang

          CLANG_BIN=$(
            find "$GITHUB_WORKSPACE/clang" \
              -type f \
              -path '*/bin/clang' \
              | sort \
              | tail -1 \
              | xargs dirname
          )

          test -n "$CLANG_BIN"

          echo "$CLANG_BIN" >> "$GITHUB_PATH"

          echo "=========================================="
          echo "CLANG"
          echo "=========================================="

          "$CLANG_BIN/clang" --version


      # ============================================================
      # 11. BUILD KERNEL
      #
      # IMPORTANT:
      # No O=out here.
      # Kernel 4.4 prepare3 rejects dirty source trees when using
      # an external output directory.
      # ============================================================
      - name: Build kernel
        run: |
          set -eux

          cd kernel

          export ARCH=arm64
          export SUBARCH=arm64

          echo "=========================================="
          echo "BUILD KERNEL"
          echo "=========================================="

          clang --version

          test -f .config

          make -j"$(nproc)" \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            KCFLAGS="-Wno-error" \
            Image.gz

          test -f arch/arm64/boot/Image.gz

          echo ""
          echo "=========================================="
          echo "BUILD SUCCESS"
          echo "=========================================="

          ls -lh arch/arm64/boot/Image.gz


      # ============================================================
      # 12. PREPARE NEW KERNEL
      # ============================================================
      - name: Prepare kernel for boot.img
        run: |
          set -eux

          cd boot_work

          NEW_KERNEL="../kernel/arch/arm64/boot/Image.gz"

          test -f "$NEW_KERNEL"

          cp kernel kernel.original

          if [ -f kernel_dtb ]; then

            echo "Original boot contains kernel_dtb."

            cat \
              "$NEW_KERNEL" \
              kernel_dtb \
              > kernel.new

            mv kernel.new kernel

          else

            echo "No separate kernel_dtb."

            cp "$NEW_KERNEL" kernel

          fi

          echo "Final kernel:"
          stat -c "%s bytes" kernel


      # ============================================================
      # 13. REPACK BOOT
      # ============================================================
      - name: Repack boot.img
        run: |
          set -eux

          cd boot_work

          test -f boot.img
          test -f kernel

          ../magiskboot repack \
            boot.img \
            ../boot_ksu.img

          cd ..

          test -f boot_ksu.img

          echo "=========================================="
          echo "BOOT IMAGE"
          echo "=========================================="

          ls -lh boot_ksu.img


      # ============================================================
      # 14. VALIDATE
      # ============================================================
      - name: Validate boot.img
        run: |
          set -eux

          rm -rf validation

          mkdir validation

          cp boot_ksu.img validation/

          cd validation

          ../magiskboot unpack boot_ksu.img

          test -f kernel

          echo "=========================================="
          echo "VALIDATION SUCCESS"
          echo "=========================================="

          ls -lah


      # ============================================================
      # 15. BUILD INFO
      # ============================================================
      - name: Generate build information
        run: |
          set -eux

          {
            echo "Device: ASUS Zenfone 5 ZE620KL / X00QD"
            echo "SoC: Snapdragon 636"
            echo "ROM: crDroid 9.5 Android 13"
            echo "Kernel: 4.4"
            echo "KernelSU: v0.9.5"
            echo ""
            echo "Kernel source:"
            echo "${KERNEL_REPO}"
            echo ""
            echo "Branch:"
            echo "${KERNEL_BRANCH}"
            echo ""
            echo "Original boot:"
            stat -c "%s bytes" original/boot.img
            echo ""
            echo "New boot:"
            stat -c "%s bytes" boot_ksu.img
            echo ""
            echo "Kernel:"
            stat -c "%s bytes" kernel/arch/arm64/boot/Image.gz
          } > build-info.txt

          cat build-info.txt


      # ============================================================
      # 16. UPLOAD BOOT
      # ============================================================
      - name: Upload boot.img
        uses: actions/upload-artifact@v4
        with:
          name: ZE620KL-crDroid-9.5-KernelSU
          path: boot_ksu.img


      # ============================================================
      # 17. UPLOAD DEBUG
      # ============================================================
      - name: Upload build files
        uses: actions/upload-artifact@v4
        with:
          name: ZE620KL-build-debug
          path: |
            build-info.txt
            kernel/.config
            kernel/arch/arm64/boot/Image.gz
