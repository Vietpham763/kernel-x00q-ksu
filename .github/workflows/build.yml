name: Build ZE620KL crDroid 9.5 KernelSU

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout Repository
        uses: actions/checkout@v4


      # ============================================================
      # BUILD DEPENDENCIES
      # ============================================================
      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            libncurses5-dev \
            libncurses-dev \
            git \
            wget \
            unzip \
            zip \
            cpio \
            rsync \
            device-tree-compiler \
            python3 \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            g++-arm-linux-gnueabi


      # ============================================================
      # CHECK INPUT BOOT
      # ============================================================
      - name: Check original boot image
        shell: bash
        run: |
          set -euxo pipefail

          echo "=========================================="
          echo "CHECK BOOT IMAGE"
          echo "=========================================="

          if [ -f boot.zip ]; then
            unzip -o boot.zip
          fi

          test -f boot.img

          echo "boot.img:"
          ls -lh boot.img

          file boot.img


      # ============================================================
      # MAGISKBOOT
      # ============================================================
      - name: Install MagiskBoot
        shell: bash
        run: |
          set -euxo pipefail

          MAGISK_VERSION="27.0"
          MAGISK_URL="https://github.com/topjohnwu/Magisk/releases/download/v${MAGISK_VERSION}/Magisk-v${MAGISK_VERSION}.apk"

          rm -rf Magisk.apk magisk_extract magiskboot

          wget -q \
            -O Magisk.apk \
            "$MAGISK_URL"

          mkdir -p magisk_extract

          unzip -o \
            Magisk.apk \
            "lib/x86_64/libmagiskboot.so" \
            -d magisk_extract

          test -f magisk_extract/lib/x86_64/libmagiskboot.so

          cp \
            magisk_extract/lib/x86_64/libmagiskboot.so \
            magiskboot

          chmod +x magiskboot

          echo "=========================================="
          echo "MAGISKBOOT"
          echo "=========================================="

          file magiskboot
          ls -lh magiskboot

          # DO NOT run --help here.
          # MagiskBoot prints help but intentionally returns exit code 1.
          test -x magiskboot

          sudo cp magiskboot /usr/local/bin/magiskboot
          sudo chmod +x /usr/local/bin/magiskboot

          test -x /usr/local/bin/magiskboot


      # ============================================================
      # EXTRACT ORIGINAL KERNEL CONFIG
      # ============================================================
      - name: Extract original kernel config
        shell: bash
        run: |
          set -euxo pipefail

          echo "=========================================="
          echo "EXTRACT ORIGINAL CONFIG"
          echo "=========================================="

          rm -f kernel_config_goc

          chmod +x kernel/scripts/extract-ikconfig

          if kernel/scripts/extract-ikconfig boot.img \
              > kernel_config_goc 2>/dev/null; then

            test -s kernel_config_goc

            echo "Original kernel config extracted."

            grep -E \
              '^(CONFIG_SCHED_WALT|CONFIG_SCHED_FREQ_INPUT|CONFIG_COMPAT|CONFIG_COMPAT_VDSO|CONFIG_VDSO32|CONFIG_OVERLAY_FS|CONFIG_MODULE_SIG)=' \
              kernel_config_goc || true

          else
            echo "ERROR: Unable to extract kernel config from boot.img"
            exit 1
          fi


      # ============================================================
      # CLEAN KERNEL SOURCE
      # ============================================================
      - name: Clean kernel source
        shell: bash
        run: |
          set -euxo pipefail

          cd kernel

          echo "=========================================="
          echo "SOURCE BEFORE CLEAN"
          echo "=========================================="

          git log -1 --oneline

          test -f Makefile
          test -d arch/arm64

          # IMPORTANT:
          # Clean the source BEFORE creating the O=out build tree.
          # This prevents:
          # ".. is not clean, please run make mrproper"
          #
          # mrproper does not remove normal source files such as
          # arch/arm64/configs/*.config.
          make ARCH=arm64 mrproper

          rm -rf out

          echo "Kernel source cleaned."


      # ============================================================
      # CREATE CUSTOM DEFCONFIG
      # ============================================================
      - name: Create custom kernel defconfig
        shell: bash
        run: |
          set -euxo pipefail

          cd kernel

          echo "=========================================="
          echo "CREATE CUSTOM DEFCONFIG"
          echo "=========================================="

          test -s ../kernel_config_goc

          cp \
            ../kernel_config_goc \
            arch/arm64/configs/custom_x00qd_defconfig

          test -f \
            arch/arm64/configs/custom_x00qd_defconfig

          echo "Custom defconfig created."

          grep -E \
            '^(CONFIG_SCHED_WALT|CONFIG_SCHED_FREQ_INPUT|CONFIG_COMPAT|CONFIG_COMPAT_VDSO|CONFIG_VDSO32|CONFIG_OVERLAY_FS|CONFIG_MODULE_SIG)=' \
            arch/arm64/configs/custom_x00qd_defconfig || true


      # ============================================================
      # KERNELSU NEXT
      # ============================================================
      - name: Integrate KernelSU Next
        shell: bash
        run: |
          set -euxo pipefail

          cd kernel

          echo "=========================================="
          echo "KERNELSU NEXT"
          echo "=========================================="

          rm -rf KSU
          rm -rf drivers/kernelsu

          git clone \
            --depth=1 \
            https://github.com/KernelSU-Next/KernelSU-Next \
            KSU

          test -d KSU/kernel

          cp -r \
            KSU/kernel \
            drivers/kernelsu

          rm -rf KSU

          test -d drivers/kernelsu

          # KernelSU Kconfig
          if ! grep -q 'drivers/kernelsu/Kconfig' drivers/Kconfig; then
            echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig
          fi

          # KernelSU Makefile
          if ! grep -q 'obj-y += kernelsu/' drivers/Makefile; then
            echo 'obj-y += kernelsu/' >> drivers/Makefile
          fi

          echo "KernelSU integration complete."


      # ============================================================
      # PREPARE KERNEL CONFIG
      # ============================================================
      - name: Prepare kernel config
        shell: bash
        run: |
          set -euxo pipefail

          cd kernel

          export ARCH=arm64
          export SUBARCH=arm64

          rm -rf out
          mkdir -p out

          echo "=========================================="
          echo "CREATE KERNEL CONFIG"
          echo "=========================================="

          make \
            O=out \
            ARCH=arm64 \
            custom_x00qd_defconfig

          test -f out/.config

          echo "=========================================="
          echo "CONFIGURATION FIXES"
          echo "=========================================="

          # ----------------------------------------------------------
          # WALT
          #
          # The SDM660 scheduler source uses:
          #   task_struct.ravg
          #   task_struct.last_sleep_ts
          #
          # These are provided by CONFIG_SCHED_WALT.
          # The previous build had WALT disabled, causing:
          #
          # error: no member named 'last_sleep_ts'
          # error: no member named 'ravg'
          # ----------------------------------------------------------

          ./scripts/config \
            --file out/.config \
            --enable SCHED_WALT

          # Qualcomm WALT scheduler normally works together with
          # scheduler frequency input support in this kernel tree.
          if grep -q 'config SCHED_FREQ_INPUT' Kconfig \
             || grep -Rqs 'config SCHED_FREQ_INPUT' kernel/sched \
             || grep -Rqs 'CONFIG_SCHED_FREQ_INPUT' .; then

            ./scripts/config \
              --file out/.config \
              --enable SCHED_FREQ_INPUT || true
          fi

          # ----------------------------------------------------------
          # VDSO32
          #
          # Keep VDSO32 disabled because this old kernel tree can
          # trigger the GNU assembler -EL problem on the Android
          # userspace compatibility path.
          # ----------------------------------------------------------

          ./scripts/config \
            --file out/.config \
            --disable VDSO32

          ./scripts/config \
            --file out/.config \
            --disable COMPAT_VDSO

          # IMPORTANT:
          # DO NOT disable CONFIG_COMPAT.
          #
          # COMPAT is required for 32-bit userspace support and is
          # unrelated to the previous assembler problem.
          #
          # Therefore we intentionally leave CONFIG_COMPAT alone.

          # ----------------------------------------------------------
          # KernelSU
          # ----------------------------------------------------------

          ./scripts/config \
            --file out/.config \
            --enable KSU

          # ----------------------------------------------------------
          # OverlayFS
          # ----------------------------------------------------------

          ./scripts/config \
            --file out/.config \
            --enable OVERLAY_FS

          # ----------------------------------------------------------
          # Module signing
          # ----------------------------------------------------------

          ./scripts/config \
            --file out/.config \
            --set-str SYSTEM_TRUSTED_KEYS ""

          ./scripts/config \
            --file out/.config \
            --set-str SYSTEM_REVOCATION_KEYS ""

          ./scripts/config \
            --disable MODULE_SIG

          # ----------------------------------------------------------
          # Old kernel + new host compatibility
          # ----------------------------------------------------------

          ./scripts/config \
            --set-str CONFIG_LOCALVERSION "-KernelSU"

          # Re-resolve dependencies after all changes.
          make \
            O=out \
            ARCH=arm64 \
            olddefconfig

          echo "=========================================="
          echo "FINAL CONFIG"
          echo "=========================================="

          grep -E \
            '^(CONFIG_SCHED_WALT|CONFIG_SCHED_FREQ_INPUT|CONFIG_COMPAT|CONFIG_COMPAT_VDSO|CONFIG_VDSO32|CONFIG_KSU|CONFIG_OVERLAY_FS|CONFIG_MODULE_SIG)=' \
            out/.config || true

          echo "=========================================="
          echo "VERIFY REQUIRED CONFIG"
          echo "=========================================="

          # WALT MUST be enabled.
          grep -q '^CONFIG_SCHED_WALT=y$' out/.config

          # KernelSU MUST be enabled.
          grep -q '^CONFIG_KSU=y$' out/.config

          # OverlayFS MUST be enabled.
          grep -q '^CONFIG_OVERLAY_FS=y$' out/.config

          # VDSO32 MUST be disabled.
          if grep -q '^CONFIG_VDSO32=y$' out/.config; then
            echo "ERROR: CONFIG_VDSO32 is still enabled."
            exit 1
          fi

          # COMPAT_VDSO MUST be disabled.
          if grep -q '^CONFIG_COMPAT_VDSO=y$' out/.config; then
            echo "ERROR: CONFIG_COMPAT_VDSO is still enabled."
            exit 1
          fi

          echo "Required configuration verified."


      # ============================================================
      # LLVM TOOLCHAIN
      # ============================================================
      - name: Download Android LLVM Clang
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf clang

          git clone \
            --depth=1 \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
            clang

          CLANG_BIN="$(
            find "$GITHUB_WORKSPACE/clang" \
              -type f \
              -path '*/bin/clang' \
              -printf '%h\n' |
            sort |
            tail -1
          )"

          test -n "$CLANG_BIN"
          test -x "$CLANG_BIN/clang"

          echo "CLANG_BIN=$CLANG_BIN" >> "$GITHUB_ENV"
          echo "$CLANG_BIN" >> "$GITHUB_PATH"

          echo "=========================================="
          echo "CLANG TOOLCHAIN"
          echo "=========================================="

          "$CLANG_BIN/clang" --version
          "$CLANG_BIN/ld.lld" --version


      # ============================================================
      # BUILD KERNEL
      # ============================================================
      - name: Build kernel
        shell: bash
        run: |
          set -euxo pipefail

          cd kernel

          export ARCH=arm64
          export SUBARCH=arm64

          export PATH="$CLANG_BIN:$PATH"

          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          export LLVM=1
          export LLVM_IAS=1

          export CC=clang
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export STRIP=llvm-strip
          export READELF=llvm-readelf

          echo "=========================================="
          echo "TOOLCHAIN"
          echo "=========================================="

          clang --version
          ld.lld --version

          echo
          echo "AArch64 GCC:"
          aarch64-linux-gnu-gcc --version

          echo
          echo "ARM32 GCC:"
          arm-linux-gnueabi-gcc --version

          echo
          echo "=========================================="
          echo "FINAL CONFIG CHECK"
          echo "=========================================="

          test -f out/.config

          grep -E \
            '^(CONFIG_SCHED_WALT|CONFIG_SCHED_FREQ_INPUT|CONFIG_COMPAT|CONFIG_COMPAT_VDSO|CONFIG_VDSO32|CONFIG_KSU|CONFIG_OVERLAY_FS|CONFIG_MODULE_SIG)=' \
            out/.config || true

          echo
          echo "=========================================="
          echo "BUILD KERNEL"
          echo "=========================================="

          # GitHub-hosted runners have limited resources.
          # Keep parallelism conservative.
          JOBS=2

          echo "Parallel jobs: $JOBS"

          make \
            -j"$JOBS" \
            O=out \
            ARCH=arm64 \
            SUBARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            READELF=llvm-readelf \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            KCFLAGS="-Wno-error" \
            Image.gz

          echo
          echo "=========================================="
          echo "BUILD COMPLETE"
          echo "=========================================="

          test -f out/arch/arm64/boot/Image.gz

          ls -lh \
            out/arch/arm64/boot/Image.gz


      # ============================================================
      # VERIFY KERNEL
      # ============================================================
      - name: Verify kernel output
        shell: bash
        run: |
          set -euxo pipefail

          cd kernel

          test -f out/arch/arm64/boot/Image.gz

          echo "Kernel:"
          ls -lh out/arch/arm64/boot/Image.gz

          echo "SHA256:"
          sha256sum out/arch/arm64/boot/Image.gz


      # ============================================================
      # UNPACK ORIGINAL BOOT
      # ============================================================
      - name: Unpack original boot image
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf workdir
          mkdir -p workdir

          cp boot.img workdir/boot.img

          cd workdir

          echo "=========================================="
          echo "UNPACK ORIGINAL BOOT"
          echo "=========================================="

          magiskboot unpack -h boot.img

          test -f kernel || true

          echo
          echo "BOOT COMPONENTS:"
          ls -lah

          echo
          echo "HEADER:"
          if [ -f header ]; then
            cat header
          fi


      # ============================================================
      # REPLACE KERNEL
      # ============================================================
      - name: Replace kernel in boot image
        shell: bash
        run: |
          set -euxo pipefail

          cd workdir

          KOUT="../kernel/out/arch/arm64/boot"

          test -f "$KOUT/Image.gz"

          echo "=========================================="
          echo "REPLACE KERNEL"
          echo "=========================================="

          # Backup original kernel for diagnostics.
          if [ -f kernel ]; then
            cp kernel original_kernel
          fi

          if [ -f kernel_dtb ]; then

            echo "Original boot contains kernel_dtb."

            cat \
              "$KOUT/Image.gz" \
              kernel_dtb \
              > kernel

          else

            echo "No separate kernel_dtb."

            cp \
              "$KOUT/Image.gz" \
              kernel

          fi

          test -f kernel

          echo "New kernel:"
          ls -lh kernel

          echo
          echo "Kernel file:"
          file kernel


      # ============================================================
      # REPACK BOOT
      # ============================================================
      - name: Repack boot image
        shell: bash
        run: |
          set -euxo pipefail

          cd workdir

          echo "=========================================="
          echo "REPACK BOOT"
          echo "=========================================="

          rm -f new-boot.img

          magiskboot repack \
            boot.img \
            new-boot.img

          test -f new-boot.img

          echo "New boot image:"
          ls -lh new-boot.img

          file new-boot.img

          cp \
            new-boot.img \
            ../boot_ksu.img


      # ============================================================
      # VERIFY REPACKED BOOT
      # ============================================================
      - name: Verify repacked boot
        shell: bash
        run: |
          set -euxo pipefail

          test -f boot_ksu.img

          echo "=========================================="
          echo "VERIFY BOOT IMAGE"
          echo "=========================================="

          magiskboot verify boot_ksu.img || true

          file boot_ksu.img
          ls -lh boot_ksu.img


      # ============================================================
      # MATCH ORIGINAL BOOT SIZE
      # ============================================================
      - name: Normalize boot image size
        shell: bash
        run: |
          set -euxo pipefail

          echo "=========================================="
          echo "BOOT SIZE"
          echo "=========================================="

          ORIGINAL=$(stat -c%s boot.img)
          NEW=$(stat -c%s boot_ksu.img)

          echo "Original: $ORIGINAL bytes"
          echo "New:      $NEW bytes"

          if [ "$NEW" -gt "$ORIGINAL" ]; then
            echo
            echo "WARNING: New boot image is larger than original."
            echo "This is not automatically a kernel build failure."
            echo
            echo "The repacked image will be kept as-is."
          fi

          if [ "$NEW" -lt "$ORIGINAL" ]; then

            PAD=$((ORIGINAL - NEW))

            echo "Padding: $PAD bytes"

            truncate \
              -s "$ORIGINAL" \
              boot_ksu.img

          fi

          FINAL=$(stat -c%s boot_ksu.img)

          echo
          echo "Final:    $FINAL bytes"
          echo "Original: $ORIGINAL bytes"

          ls -lh boot_ksu.img

          sha256sum boot_ksu.img


      # ============================================================
      # FINAL CHECK
      # ============================================================
      - name: Final artifact check
        shell: bash
        run: |
          set -euxo pipefail

          test -f boot_ksu.img
          test -s boot_ksu.img

          echo "=========================================="
          echo "FINAL ARTIFACT"
          echo "=========================================="

          ls -lh boot_ksu.img

          file boot_ksu.img

          echo
          echo "SHA256:"
          sha256sum boot_ksu.img


      # ============================================================
      # ARTIFACT
      # ============================================================
      - name: Upload KernelSU boot image
        uses: actions/upload-artifact@v4
        with:
          name: boot_ksu_X00QD_KernelSU
          path: boot_ksu.img
          if-no-files-found: error
          retention-days: 30
