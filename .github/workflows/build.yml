name: Build ZE620KL crDroid 9.5 KernelSU

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # DEPENDENCIES
      # ============================================================
      - name: Install dependencies
        shell: bash
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            cpio \
            device-tree-compiler \
            flex \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            g++-aarch64-linux-gnu \
            g++-arm-linux-gnueabi \
            git \
            libelf-dev \
            libncurses5-dev \
            libssl-dev \
            rsync \
            unzip \
            wget \
            zip


      # ============================================================
      # MAGISKBOOT
      # ============================================================
      - name: Install MagiskBoot
        shell: bash
        run: |
          set -eux

          wget -q -O Magisk.apk \
            https://github.com/topjohnwu/Magisk/releases/download/v27.0/Magisk-v27.0.apk

          rm -rf magisk_extract
          mkdir -p magisk_extract

          unzip -o Magisk.apk \
            "lib/x86_64/libmagiskboot.so" \
            -d magisk_extract

          test -f magisk_extract/lib/x86_64/libmagiskboot.so

          cp \
            magisk_extract/lib/x86_64/libmagiskboot.so \
            magiskboot

          chmod +x magiskboot

          ./magiskboot --help >/dev/null

          sudo install -m 0755 \
            magiskboot \
            /usr/local/bin/magiskboot

          magiskboot --help


      # ============================================================
      # KERNEL SOURCE
      # ============================================================
      - name: Clone ASUS SDM660 kernel
        shell: bash
        run: |
          set -eux

          git clone \
            --depth=1 \
            -b lineage-18.1 \
            https://github.com/LineageOS/android_kernel_asus_sdm660 \
            kernel

          test -d kernel/arch/arm64
          test -f kernel/Makefile


      # ============================================================
      # SHOW DEFCONFIG
      # ============================================================
      - name: Check kernel source
        shell: bash
        run: |
          set -eux

          cd kernel

          echo "=========================================="
          echo "AVAILABLE DEFCONFIG"
          echo "=========================================="

          find arch/arm64/configs \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' |
            sort


      # ============================================================
      # ORIGINAL BOOT IMAGE
      # ============================================================
      - name: Check original boot image
        shell: bash
        run: |
          set -eux

          echo "=========================================="
          echo "CHECK BOOT IMAGE"
          echo "=========================================="

          if [ -f boot.zip ]; then
            unzip -o boot.zip
          fi

          if [ ! -f boot.img ]; then
            echo "ERROR: boot.img is required."
            echo "Put boot.img in repository root."
            exit 1
          fi

          ls -lh boot.img

          magiskboot unpack boot.img

          echo "=========================================="
          echo "BOOT CONTENT"
          echo "=========================================="

          ls -lah


      # ============================================================
      # EXTRACT ORIGINAL KERNEL CONFIG
      # ============================================================
      - name: Extract original kernel config
        shell: bash
        run: |
          set -eux

          cd kernel

          if [ ! -x scripts/extract-ikconfig ]; then
            chmod +x scripts/extract-ikconfig
          fi

          cd ..

          if ./kernel/scripts/extract-ikconfig \
              boot.img > kernel_config_goc 2>/dev/null; then

            if [ -s kernel_config_goc ]; then

              echo "Original kernel config extracted."

              cp \
                kernel_config_goc \
                kernel/arch/arm64/configs/custom_x00qd_defconfig

            else

              echo "ERROR: extracted config is empty."
              exit 1

            fi

          else

            echo "ERROR: unable to extract kernel config."
            exit 1

          fi

          test -s kernel/arch/arm64/configs/custom_x00qd_defconfig


      # ============================================================
      # KERNELSU
      # ============================================================
      - name: Integrate KernelSU Next
        shell: bash
        run: |
          set -eux

          cd kernel

          rm -rf KSU

          git clone \
            --depth=1 \
            https://github.com/KernelSU-Next/KernelSU-Next \
            KSU

          test -d KSU/kernel

          rm -rf drivers/kernelsu

          cp -a \
            KSU/kernel \
            drivers/kernelsu

          rm -rf KSU

          grep -qF 'obj-y += kernelsu/' drivers/Makefile || \
            printf '\nobj-y += kernelsu/\n' >> drivers/Makefile

          grep -qF 'drivers/kernelsu/Kconfig' drivers/Kconfig || \
            printf '\nsource "drivers/kernelsu/Kconfig"\n' >> drivers/Kconfig

          echo "KernelSU integrated."


      # ============================================================
      # PREPARE CONFIG
      # ============================================================
      - name: Prepare kernel config
        shell: bash
        run: |
          set -eux

          cd kernel

          export ARCH=arm64
          export SUBARCH=arm64

          rm -rf out
          mkdir -p out

          echo "=========================================="
          echo "DEFCONFIG"
          echo "=========================================="

          make \
            O=out \
            ARCH=arm64 \
            custom_x00qd_defconfig

          echo "=========================================="
          echo "CONFIGURE"
          echo "=========================================="

          ./scripts/config \
            --file out/.config \
            --enable CONFIG_KSU

          ./scripts/config \
            --file out/.config \
            --enable CONFIG_OVERLAY_FS

          # Không build 32-bit userspace compatibility VDSO.
          ./scripts/config \
            --file out/.config \
            --disable CONFIG_COMPAT_VDSO

          ./scripts/config \
            --disable CONFIG_VDSO32

          # Android kernel build không cần host distro signing keys.
          ./scripts/config \
            --file out/.config \
            --set-str CONFIG_SYSTEM_TRUSTED_KEYS ""

          ./scripts/config \
            --file out/.config \
            --set-str CONFIG_SYSTEM_REVOCATION_KEYS ""

          ./scripts/config \
            --file out/.config \
            --disable CONFIG_MODULE_SIG

          make \
            O=out \
            ARCH=arm64 \
            olddefconfig

          echo "=========================================="
          echo "FINAL CONFIG"
          echo "=========================================="

          grep -E \
            'CONFIG_(KSU|OVERLAY_FS|COMPAT|COMPAT_VDSO|VDSO32|MODULE_SIG)' \
            out/.config || true


      # ============================================================
      # ANDROID LLVM
      # ============================================================
      - name: Download Android LLVM
        shell: bash
        run: |
          set -eux

          rm -rf clang

          git clone \
            --depth=1 \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
            clang

          CLANG_BIN="$(
            find "$GITHUB_WORKSPACE/clang" \
              -type f \
              -path '*/bin/clang' \
              -printf '%h\n' |
            sort |
            tail -1
          )"

          if [ -z "$CLANG_BIN" ]; then
            echo "ERROR: clang not found."
            exit 1
          fi

          test -x "$CLANG_BIN/clang"

          echo "CLANG_BIN=$CLANG_BIN" >> "$GITHUB_ENV"
          echo "$CLANG_BIN" >> "$GITHUB_PATH"

          echo "=========================================="
          echo "LLVM"
          echo "=========================================="

          "$CLANG_BIN/clang" --version


      # ============================================================
      # BUILD KERNEL
      # ============================================================
      - name: Build kernel
        shell: bash
        run: |
          set -eux

          cd kernel

          export ARCH=arm64
          export SUBARCH=arm64

          export PATH="$CLANG_BIN:$PATH"

          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          echo "=========================================="
          echo "TOOLCHAIN"
          echo "=========================================="

          clang --version
          ld.lld --version
          aarch64-linux-gnu-gcc --version
          arm-linux-gnueabi-gcc --version

          echo "=========================================="
          echo "BUILD KERNEL"
          echo "=========================================="

          make \
            -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            KCFLAGS="-Wno-error" \
            Image.gz

          test -f out/arch/arm64/boot/Image.gz

          ls -lh out/arch/arm64/boot/Image.gz


      # ============================================================
      # VERIFY KERNEL
      # ============================================================
      - name: Verify kernel output
        shell: bash
        run: |
          set -eux

          cd kernel

          test -f out/arch/arm64/boot/Image.gz

          file out/arch/arm64/boot/Image.gz

          ls -lh \
            out/arch/arm64/boot/Image.gz


      # ============================================================
      # REPACK BOOT
      # ============================================================
      - name: Repack boot image
        shell: bash
        run: |
          set -eux

          rm -rf boot_work
          mkdir -p boot_work

          cp boot.img boot_work/boot.img

          cd boot_work

          echo "=========================================="
          echo "UNPACK ORIGINAL BOOT"
          echo "=========================================="

          magiskboot unpack boot.img

          echo "=========================================="
          echo "BOOT FILES"
          echo "=========================================="

          ls -lah

          KERNEL="$GITHUB_WORKSPACE/kernel/out/arch/arm64/boot/Image.gz"

          test -f "$KERNEL"

          echo "=========================================="
          echo "REPLACE KERNEL"
          echo "=========================================="

          # MagiskBoot repack expects the component named "kernel".
          # Keep Image.gz as-is; MagiskBoot detects compression
          # from the original boot image during repack.

          cp "$KERNEL" kernel

          test -f kernel

          ls -lh kernel

          echo "=========================================="
          echo "REPACK"
          echo "=========================================="

          rm -f new-boot.img

          magiskboot repack \
            boot.img \
            new-boot.img

          test -f new-boot.img

          echo "=========================================="
          echo "BOOT CREATED"
          echo "=========================================="

          ls -lh new-boot.img

          cp \
            new-boot.img \
            "$GITHUB_WORKSPACE/boot_ksu.img"


      # ============================================================
      # VERIFY FINAL BOOT
      # ============================================================
      - name: Verify final boot image
        shell: bash
        run: |
          set -eux

          test -f boot_ksu.img

          echo "=========================================="
          echo "FINAL BOOT"
          echo "=========================================="

          ls -lh boot.img
          ls -lh boot_ksu.img

          echo "=========================================="
          echo "MAGISKBOOT VERIFY"
          echo "=========================================="

          rm -rf verify_boot
          mkdir verify_boot

          cp boot_ksu.img verify_boot/

          cd verify_boot

          magiskboot unpack boot_ksu.img

          test -f kernel

          echo "Repacked boot image is readable."


      # ============================================================
      # ARTIFACT
      # ============================================================
      - name: Upload boot image
        uses: actions/upload-artifact@v4
        with:
          name: ZE620KL-crDroid-9.5-KernelSU
          path: boot_ksu.img
          if-no-files-found: error
