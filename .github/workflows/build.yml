name: Build ZE620KL crDroid 9.5 KernelSU

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # DEPENDENCIES
      # ============================================================
      - name: Install dependencies
        shell: bash
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            cpio \
            flex \
            git \
            libelf-dev \
            libncurses5-dev \
            libssl-dev \
            lz4 \
            python3 \
            rsync \
            unzip \
            wget \
            zip \
            device-tree-compiler \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi

      # ============================================================
      # ANDROID CLANG
      # ============================================================
      - name: Download Android Clang
        shell: bash
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE"

          rm -rf clang

          git clone \
            --depth=1 \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
            clang

          CLANG_BIN="$(
            find "$GITHUB_WORKSPACE/clang" \
              -type f \
              -path '*/bin/clang' \
              -printf '%h\n' |
            sort |
            tail -1
          )"

          test -n "$CLANG_BIN"

          test -x "$CLANG_BIN/clang"
          test -x "$CLANG_BIN/ld.lld"
          test -x "$CLANG_BIN/llvm-ar"
          test -x "$CLANG_BIN/llvm-nm"
          test -x "$CLANG_BIN/llvm-objcopy"
          test -x "$CLANG_BIN/llvm-objdump"
          test -x "$CLANG_BIN/llvm-readelf"
          test -x "$CLANG_BIN/llvm-strip"

          echo "CLANG_BIN=$CLANG_BIN" >> "$GITHUB_ENV"
          echo "$CLANG_BIN" >> "$GITHUB_PATH"

          echo "=========================================="
          echo "CLANG"
          echo "=========================================="

          "$CLANG_BIN/clang" --version
          "$CLANG_BIN/ld.lld" --version

      # ============================================================
      # KERNEL SOURCE
      # ============================================================
      - name: Clone kernel source
        shell: bash
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE"

          rm -rf kernel

          git clone \
            --depth=1 \
            --branch lineage-18.1 \
            https://github.com/LineageOS/android_kernel_asus_sdm660 \
            kernel

          cd kernel

          echo "=========================================="
          echo "KERNEL SOURCE"
          echo "=========================================="

          git rev-parse HEAD

          echo "Available defconfigs:"
          find arch/arm64/configs \
            -maxdepth 1 \
            -type f \
            -name '*defconfig' \
            -printf '%f\n' |
            sort

      # ============================================================
      # SELECT DEFCONFIG
      # ============================================================
      - name: Select defconfig
        shell: bash
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE/kernel"

          echo "=========================================="
          echo "SELECT DEFCONFIG"
          echo "=========================================="

          if [ -f arch/arm64/configs/X00TD_defconfig ]; then
            DEFCONFIG=X00TD_defconfig

          elif [ -f arch/arm64/configs/X01BD_defconfig ]; then
            DEFCONFIG=X01BD_defconfig

          elif [ -f arch/arm64/configs/sdm660-perf_defconfig ]; then
            DEFCONFIG=sdm660-perf_defconfig

          elif [ -f arch/arm64/configs/sdm660_defconfig ]; then
            DEFCONFIG=sdm660_defconfig

          else
            echo "ERROR: No compatible defconfig found."
            exit 1
          fi

          echo "Selected: $DEFCONFIG"

          echo "DEFCONFIG=$DEFCONFIG" >> "$GITHUB_ENV"

      # ============================================================
      # KERNELSU
      # ============================================================
      - name: Integrate KernelSU
        shell: bash
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE/kernel"

          rm -rf KernelSU

          git clone \
            --depth=1 \
            https://github.com/tiann/KernelSU.git \
            KernelSU

          test -f KernelSU/kernel/setup.sh

          bash KernelSU/kernel/setup.sh

          echo "=========================================="
          echo "KERNELSU"
          echo "=========================================="

          git -C KernelSU rev-parse HEAD

      # ============================================================
      # CONFIGURE
      # ============================================================
      - name: Configure kernel
        shell: bash
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE/kernel"

          export ARCH=arm64
          export SUBARCH=arm64

          rm -rf out
          mkdir -p out

          echo "=========================================="
          echo "DEFCONFIG"
          echo "=========================================="

          make \
            O=out \
            ARCH=arm64 \
            "$DEFCONFIG"

          test -f out/.config

          echo "=========================================="
          echo "OLDDEFCONFIG"
          echo "=========================================="

          make \
            O=out \
            ARCH=arm64 \
            olddefconfig

          test -f out/.config

      # ============================================================
      # BUILD KERNEL
      # ============================================================
      - name: Build kernel
        shell: bash
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE/kernel"

          export ARCH=arm64
          export SUBARCH=arm64

          export PATH="$CLANG_BIN:$PATH"

          # --------------------------------------------------------
          # LLVM
          # --------------------------------------------------------
          export CC=clang
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export STRIP=llvm-strip
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export READELF=llvm-readelf

          # --------------------------------------------------------
          # CROSS COMPILERS
          # --------------------------------------------------------
          #
          # ARM64:
          export CROSS_COMPILE=aarch64-linux-gnu-

          # ARM32:
          # Kernel 4.x SDM660 source requires this variable.
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          echo "=========================================="
          echo "TOOLCHAIN"
          echo "=========================================="

          echo "CLANG_BIN=$CLANG_BIN"
          echo "CROSS_COMPILE=$CROSS_COMPILE"
          echo "CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32"

          echo "------------------------------------------"
          echo "Clang"
          echo "------------------------------------------"

          clang --version
          ld.lld --version
          llvm-ar --version
          llvm-objdump --version
          llvm-readelf --version

          echo "------------------------------------------"
          echo "ARM64 GCC"
          echo "------------------------------------------"

          aarch64-linux-gnu-gcc --version

          echo "------------------------------------------"
          echo "ARM32 GCC"
          echo "------------------------------------------"

          arm-linux-gnueabi-gcc --version

          echo "=========================================="
          echo "BUILD KERNEL"
          echo "=========================================="

          test -f out/.config

          make \
            -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            SUBARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            STRIP=llvm-strip \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            READELF=llvm-readelf \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            KCFLAGS="-Wno-error" \
            Image.gz

          echo "=========================================="
          echo "BUILD RESULT"
          echo "=========================================="

          test -f out/arch/arm64/boot/Image.gz

          ls -lh \
            out/arch/arm64/boot/Image.gz

      # ============================================================
      # PREPARE ARTIFACTS
      # ============================================================
      - name: Prepare kernel artifact
        shell: bash
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE"

          rm -rf artifacts
          mkdir -p artifacts

          cp \
            kernel/out/arch/arm64/boot/Image.gz \
            artifacts/Image.gz

          echo "=========================================="
          echo "ARTIFACT"
          echo "=========================================="

          ls -lh artifacts/

      # ============================================================
      # UPLOAD
      # ============================================================
      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: ZE620KL-crDroid-9.5-KernelSU
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
